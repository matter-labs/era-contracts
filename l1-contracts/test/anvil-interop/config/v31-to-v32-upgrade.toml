# Upgrade input for the v31 -> v32 scenario. `bridgehub_proxy_address` and `owner_address` are substituted
# by the harness from the loaded chain states; everything else, including `[chain] chain_id`, is a literal
# that has to match the fixture.

old_protocol_version = 0x1f00000000
bridgehub_proxy_address = "0x0000000000000000000000000000000000000000"
owner_address = "0x0000000000000000000000000000000000000000"

# The fixture's chains are at v31 while its L1 contracts are, too, so autodetection would be right here;
# stating it keeps the scenario independent of how the states were generated.
pre_v32_introspection = true

# The sections below mirror the shape of a production upgrade input so the same scripts can read this file.
# Only `pre_v32_introspection` above and `contracts.new_protocol_version` below are consumed; the genesis
# and recursion-vk placeholders that used to sit here were read by nothing and have been dropped.
[chain]
chain_id = 10

[contracts]
new_protocol_version = 0x2000000000
