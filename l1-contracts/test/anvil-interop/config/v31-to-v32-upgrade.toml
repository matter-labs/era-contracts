bridgehub_proxy_address = "0x0000000000000000000000000000000000000000"
owner_address = "0x0000000000000000000000000000000000000000"

# The fixture's chains are at v31 while its L1 contracts are, too, so autodetection would be right here;
# stating it keeps the scenario independent of how the states were generated.
pre_v32_introspection = true

