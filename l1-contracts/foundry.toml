[profile.default]
allow_paths = ["../lib"]
src = "contracts"
out = "out"
libs = ["./lib"]
cache_path = "cache-forge"
test = "test/foundry"
solc_version = "0.8.28"
evm_version = "prague"
fs_permissions = [
    { access = "read-write", path = "./script-out" },
    { access = "read-write", path = "./test/anvil-interop/" },
    { access = "read-write", path = "./test/foundry/l1/integration/deploy-scripts/script-config/" },
    { access = "read-write", path = "./test/foundry/l1/integration/deploy-scripts/script-out/" },
    { access = "read-write", path = "./test/foundry/l1/integration/upgrade-envs/script-config/" },
    { access = "read-write", path = "./test/foundry/l1/integration/upgrade-envs/script-out/" },
    { access = "read-write", path = "./test/foundry/l1/integration/upgrade-envs/permanent-values/" },
    { access = "read-write", path = "./upgrade-envs/permanent-values/local.toml" },
    { access = "read-write", path = "./upgrade-envs/" },
    { access = "read-write", path = "./script-out" },
    { access = "read", path = "../l1-contracts/script-out/" },
    { access = "read", path = "../l1-contracts/broadcast/" },
    { access = "read", path = "../da-contracts/" },
    { access = "read", path = "./script-config" },
    { access = "read", path = "./upgrade-envs/" },
    { access = "read", path = "./out" },
    { access = "read", path = "../configs/genesis/" },
    { access = "read", path = "../configs/" },
]
ignored_error_codes = ["missing-receive-ether", "code-size"]
ignored_warnings_from = ["test", "contracts/dev-contracts"]
suppressed_warnings = ["txorigin"]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "murky/=lib/murky/src/",
  "foundry-test/=test/foundry/",
  # The audited L1 sources import the frozen system constants by their historical
  # `system-contracts/...` path; the workspace is gone, the file lives in-tree.
  "system-contracts/contracts/Constants.sol=frozen-system-constants/Constants.sol",
  "@openzeppelin/contracts-v4/=lib/openzeppelin-contracts-v4/contracts/",
  "@openzeppelin/contracts-upgradeable-v4/=lib/openzeppelin-contracts-upgradeable-v4/contracts/",
  "test-utils/=test/foundry/l1/integration/utils/",
]
optimizer = true
optimizer_runs = 9999999
# TODO(X): the latest foundry disallows reverts that happen inside the internal calls and we should fix tests that rely
# on such reverts
allow_internal_expect_revert = true


# Profile for anvil-interop state generation: disables CBOR metadata to produce
# deterministic bytecode across platforms (macOS vs Linux CI). Without this,
# the CBOR metadata hash differs → CREATE2 addresses differ → storage differs.
# Usage: FOUNDRY_PROFILE=anvil-interop forge build
[profile.anvil-interop]
cbor_metadata = false
bytecode_hash = "none"

# Deterministic sub-build for the anvil registry-driven upgrade test: the committed v32
# registries (contracts/upgrades/registry/v32) pin the CODEHASHES of the implementations the
# runner deploys, so those artifacts must be byte-identical across platforms (macOS regen vs
# Linux CI). Same metadata settings as anvil-interop, but with a dedicated out/cache so it
# never clobbers the default-profile artifacts the rest of the harness loads.
# Usage: FOUNDRY_PROFILE=registry-deterministic forge build <sources>
[profile.registry-deterministic]
cbor_metadata = false
bytecode_hash = "none"
out = "out-registry-deterministic"
cache_path = "cache-forge-registry-deterministic"

[profile.invariant_tests_l1context]
test = "test"
ignored_error_codes = ["missing-receive-ether", "code-size", 2018, 5667, 2519, 6321, 3149, 3860]
optimizer = false
[profile.invariant_tests_l1context.invariant]
runs = 10
depth = 1000

[profile.invariant_tests_l1context_ci]
test = "test"
ignored_error_codes = ["missing-receive-ether", "code-size", 2018, 5667, 2519, 6321, 3149, 3860]
optimizer = false
[profile.invariant_tests_l1context_ci.invariant]
runs = 10
depth = 10000

[lint]
lint_on_build = false
