# Human-readable descriptions for this upgrade's transaction-simulator scenario, read by
# `protocol_ops ecosystem governance-toml-to-simulator --descriptions` (see generate-stage.sh).
# Each `[[entries]]` block matches a tx by `(target, selector)`; an unmatched tx fails the emit.

[labels]
# --- stage (Sepolia) atomic-interop ecosystem, all pre-existing ---
bridgehub           = "0xb9415d43C7753cCeBaa1ac05c8BabA36159ab13F"
chain_asset_handler = "0x33388639Ba3f30AD47fc6e6769CEe89e53a09991"
zkos_ctm            = "0x94d8784d719181EA00f58ab4a85333959FFA5a79"
chain_2727          = "0xA9a82F284AB58964E9dA89B9865FF0e704507579"

# --- deployed by this upgrade (rotate with the CREATE2 salt) ---
gov_upgrade_timer       = "0xa1FAdE7c8863D9f6ebF59B25b0C693b291ecd9d4"
upgrade_stage_validator = "0xd4cf05E557C28eC06952dB961Bd371a254223014"

[[entries]]
target = "chain_asset_handler"
selector = "0xac700e63"
desc = "Stage 0: pause chain migrations (ChainAssetHandler.pauseMigration) — the CTM refuses a new version otherwise"

[[entries]]
target = "gov_upgrade_timer"
selector = "0xa39f7449"
desc = "Stage 0: start the governance upgrade timer (GovernanceUpgradeTimer.startTimer)"

[[entries]]
target = "gov_upgrade_timer"
selector = "0x43bf9936"
desc = "Stage 1: check the upgrade timer deadline has passed (GovernanceUpgradeTimer.checkDeadline)"

[[entries]]
target = "upgrade_stage_validator"
selector = "0x386584cf"
desc = "Stage 1: check chain migrations are paused (UpgradeStageValidator.checkMigrationsPaused)"

[[entries]]
target = "zkos_ctm"
selector = "0xca4ea357"
desc = "Stage 1: register v0.33.2 as an upgrade of v0.33.0 with the new ZKsyncOSTestnetVerifier (CTM.createNewVerifierOnlyUpgrade)"

[[entries]]
target = "upgrade_stage_validator"
selector = "0x37076ce3"
desc = "Stage 2: check v0.33.2 is registered on the CTM (UpgradeStageValidator.checkProtocolUpgradePresence)"

[[entries]]
target = "upgrade_stage_validator"
selector = "0x407a5a0b"
desc = "Stage 2: check chain migrations are unpaused (UpgradeStageValidator.checkMigrationsUnpaused)"

[[entries]]
target = "chain_asset_handler"
selector = "0xf7c7eb92"
desc = "Stage 2: unpause chain migrations (ChainAssetHandler.unpauseMigration)"

[[entries]]
target = "bridgehub"
selector = "0xf113c88b"
desc = "test: create chain 556 on v0.33.2 from the unchanged chain creation params (Bridgehub.createNewChain)"

[[entries]]
target = "chain_2727"
selector = "0x3b6d7534"
desc = "test: upgrade chain 2727 from v0.33.0 to v0.33.2 as its ChainAdmin (upgradeChainFromVersion)"
