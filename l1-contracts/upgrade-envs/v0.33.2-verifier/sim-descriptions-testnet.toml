# Human-readable descriptions for this upgrade's testnet transaction-simulator scenarios, read by
# `protocol_ops ecosystem governance-toml-to-simulator` / `manifest-to-simulator --descriptions`
# (the generate and per-chain workflows). Each `[[entries]]` block matches a tx by `(target, selector)`;
# an unmatched tx fails the emit.

[labels]
# --- testnet (Sepolia) ecosystem, all pre-existing ---
bridgehub           = "0xc4FD2580C3487bba18D63f50301020132342fdbD"
chain_asset_handler = "0xDfA2193b161d7bd45FC81b4E80225eebDc3CF96C"
zkos_ctm            = "0x54D55e74De9c6003E7a68a1fE70E633f05761eb5"

# --- per-chain ChainAdmins (pre-existing; each chain takes the cut itself) ---
chain_admin_1913    = "0xa7F9a1A7b6b68fBf68aDC938104A096006794aD7"
chain_admin_4221    = "0x82b6590F23591A6BE0f0434e681A038467F21900"
chain_admin_42111   = "0x4e48a5152F8d705073b5ACcCCAF234571B2a0621"
chain_admin_88288   = "0xf3B67C6E88BB7Ab3721D0CFA47c024F08F0f2476"
chain_admin_579029  = "0x0C39098d6a7e7287DB4a2aE5Bad67c9EF76eb265"
chain_admin_8022833 = "0x3b7a24e583867ab85694CF55941734653bdfaB9c"
chain_admin_8022834 = "0xF87E2FB52AB4769Bf60B04D4C7aD311048858230"

# --- deployed by this upgrade (rotate with the CREATE2 salt) ---
gov_upgrade_timer       = "0x8041C49aefbA4c0f96AF9dB80Ca76139E69c925E"
upgrade_stage_validator = "0xC04FC5Ed2fFD03b27E953afe4020fAC1e2f0f885"

[[entries]]
target = "chain_asset_handler"
selector = "0xac700e63"
desc = "Stage 0: pause chain migrations (ChainAssetHandler.pauseMigration) — the CTM refuses a new version otherwise"

[[entries]]
target = "gov_upgrade_timer"
selector = "0xa39f7449"
desc = "Stage 0: start the governance upgrade timer (GovernanceUpgradeTimer.startTimer)"

[[entries]]
target = "gov_upgrade_timer"
selector = "0x43bf9936"
desc = "Stage 1: check the upgrade timer deadline has passed (GovernanceUpgradeTimer.checkDeadline)"

[[entries]]
target = "upgrade_stage_validator"
selector = "0x386584cf"
desc = "Stage 1: check chain migrations are paused (UpgradeStageValidator.checkMigrationsPaused)"

[[entries]]
target = "zkos_ctm"
selector = "0xca4ea357"
desc = "Stage 1: register v0.33.2 as an upgrade of v0.33.0 with the new ZKsyncOSTestnetVerifier (CTM.createNewVerifierOnlyUpgrade)"

[[entries]]
target = "upgrade_stage_validator"
selector = "0x37076ce3"
desc = "Stage 2: check v0.33.2 is registered on the CTM (UpgradeStageValidator.checkProtocolUpgradePresence)"

[[entries]]
target = "upgrade_stage_validator"
selector = "0x407a5a0b"
desc = "Stage 2: check chain migrations are unpaused (UpgradeStageValidator.checkMigrationsUnpaused)"

[[entries]]
target = "chain_asset_handler"
selector = "0xf7c7eb92"
desc = "Stage 2: unpause chain migrations (ChainAssetHandler.unpauseMigration)"

[[entries]]
target = "bridgehub"
selector = "0xf113c88b"
desc = "test: create chain 556 on v0.33.2 from the unchanged chain creation params (Bridgehub.createNewChain)"

# --- per-chain bundles (chain-upgrades/<id>/), both `ChainAdmin.multicall`, told apart by the inner selector:
#   0xe2a9d554 = ServerNotifier.setUpgradeTimestamp
#   0x3b6d7534 = upgradeChainFromVersion

[[entries]]
target = "chain_admin_1913"
selector = "0x69340beb"
inner_selector = "0xe2a9d554"
desc = "ChainAdmin.multicall: ServerNotifier.setUpgradeTimestamp(1913, 1) — 1 means no waiting, and 0 is rejected as the unset sentinel. Requires stage 1 to have registered the v0.33.2 cut, which is why this file must run after the ecosystem scenario."

[[entries]]
target = "chain_admin_1913"
selector = "0x69340beb"
inner_selector = "0x3b6d7534"
desc = "ChainAdmin.multicall: upgradeChainFromVersion(chain 1913, 0x2100000000 -> 0x2100000002) — the per-chain diamond cut: no facets, new verifier, DA unchanged."

[[entries]]
