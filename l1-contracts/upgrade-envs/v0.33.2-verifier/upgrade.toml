# How the generate / replay / deploy pipeline handles this upgrade
# (protocol-ops/src/common/upgrade_descriptor.rs). One forge script prepares it; its only L1 transactions are
# the four CREATE2 deployments (both verifiers, the stage validator and the governance timer).
prepare = "forge-script"
script = "deploy-scripts/upgrade/verifier-only/ZKsyncOSVerifierOnlyUpgrade.s.sol:ZKsyncOSVerifierOnlyUpgrade"
signature = "prepare(string,string)"
args = [
  "/upgrade-envs/v0.33.2-verifier/{env}.toml",
  "/upgrade-envs/v0.33.2-verifier/output/{env}/ecosystem.toml",
]
# On the fork the bundle was replayed on: governance stages, the committed chain bundles, a test chain, L1
# assertions.
verify_fork = ["bash", "upgrade-envs/v0.33.2-verifier/rehearse.sh"]
# Read-only against the real chain: the deployments, their VK and wiring.
verify_chain = ["bash", "upgrade-envs/v0.33.2-verifier/check-deployment.sh"]

# How whoever executes sends the governance stages, by what owns the env's CTM: one emergency proposal
# through the Emergency Upgrade Board (testnet), or `scheduleTransparent` + `execute` per stage from the
# `Governance` owner (stage3). Run read-only on the generation fork after the deploy bundle; the pipeline
# replays the txs there and renders EXECUTE.md from them.
[execution]
script = "deploy-scripts/upgrade/verifier-only/ZKsyncOSVerifierOnlyExecution.s.sol:ZKsyncOSVerifierOnlyExecution"
signature = "writeExecution(string,string,string,string)"
args = [
  "/upgrade-envs/permanent-values/{env}.toml",
  "/upgrade-envs/v0.33.2-verifier/{env}.toml",
  "/upgrade-envs/v0.33.2-verifier/output/{env}/ecosystem.toml",
  "/upgrade-envs/v0.33.2-verifier/output/{env}/execution.json",
]
output = "execution.json"
