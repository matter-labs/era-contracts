# Upgrade input for the stage environment on the v34 release.
#
# Created from the v0.33.0-atomic-interop entry of the same name: the environment values (owner,
# era_chain_id, upgrade timer) are carried over, while the CREATE2 and legacy-Gov salts are fresh, so
# this release's deployments do not resolve to v33's addresses.
#
# Only these keys are read: protocol-ops' `--env stage` reads `owner_address`, `era_chain_id` and the
# salts, and `DefaultCTMUpgrade` reads `governance_upgrade_timer_initial_delay`. The old protocol version
# comes from each CTM and the target from `configs/genesis/zksync-os/latest.json`. A missing file fails
# closed rather than falling back to local's values.

era_chain_id = 270

# Delay armed on the `GovernanceUpgradeTimer` this upgrade deploys, bounding the window between stage 0
# and stage 1 becoming executable. The timer is a fresh contract each upgrade, so it is a per-release input.
governance_upgrade_timer_initial_delay = 1200

# `bridgehub.owner()`, the signer of every governance stage.
owner_address = "0x8f08627524aeD610192132A425D6b9C32a1727EF"

[contracts]
# Rotated every release: CREATE2 returns the previously deployed contract if a salt is reused.
create2_factory_salt = "0xb3ba30996341c8b82e535d6322f872fa02be7e0e8678a3ba7be4abd3b6e094fb"
# Salt for legacy `Governance.sol` op ids, rotated so they do not collide with executed ones.
legacy_gov_salt = "0x0945e335b8afbf326106bd2199af8979ccc6feed7bed327934e73e0d4dff346e"

# Per-CTM CREATE2 salts, keyed by CTM proxy: each CTM prepare deploys its own `GovernanceUpgradeTimer`
# with env-wide constructor args, so two CTMs need distinct salts.
[create2_factory_salts]
"0x8b448ac7cd0f18F3d8464E2645575772a26A3b6b" = "0x269f149271c75d19bb55bfe0ed6f5c186110c9a5ec58b3ae07b49450a527aa7d"
"0x73bee414c6e006525f3cceedf6d8004c0370502e" = "0xfa06d48b9e988a0a52e824e23e15131a8b68e9116be16efdec3d885bf4a1d511"
