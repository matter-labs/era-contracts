l1_chain_id = 1
# zksync-os-mainnet: the ZKsync OS ecosystem on Ethereum mainnet, separate from `mainnet.toml` (the Era
# ecosystem, bridgehub 0x303a465B…). Taken from #2618 (`sb/v33.2-upgrade-ci`).
#
# Read from mainnet on 2026-11-13. Its only CTM is ZKsync OS, on v0.33.2; chains 5790, 51703, 61703,
# 20250714, 886229927.
testnet_verifier = false

# The ZK token as this ecosystem's L1NativeTokenVault (0x3e1615c7…) registers it: the L1 token
# 0x66A5cFB2… as L1-native (origin 1). Not `mainnet.toml`'s 324-origin id, which this NTV has never
# registered: the chains already run with this one.
zk_token_asset_id = "0x3a38577a86db1c11f5d17ced1d0c3757370aed1b14a1829de6fef58c6d0741d2"

[permanent_contracts]
create2_factory_addr = "0x4e59b44847b379578588920cA78FbF26c0B4956C"

[core_contracts]
bridgehub_proxy_addr = "0xEe293Fd09348e22Cde4CFc7c1ddE82953fc33027"
# `bridgehub.owner()`, the CTM's and the ChainAssetHandler's `owner()` are the legacy `Governance`
# below (`minDelay() == 0`), itself owned by the 6-of-8 Safe 0xDF19897e2b3c654A6681d6DC02F5E7cE15205c63.
# The bridgehub and the CTM share the ProxyAdmin 0x1ECf7E0787Cd327Ce7ECeBdba0D011A5aB4E4CFD, which v35
# splits before the bootstrap.
governance_kind = "legacy"

[ctm_contracts]
ctm_proxy_addr = "0xF9Fc08eaA6dAD8DDE886F3B174a019c9ac56B2Ef"

[[ctm_contracts.ctms]]
proxy = "0xF9Fc08eaA6dAD8DDE886F3B174a019c9ac56B2Ef"

[[ownable_proxies]]
# Legacy `Governance.sol`: owns the bridgehub, the CTM and the ChainAssetHandler. Its owner sends
# `scheduleTransparent(op, 0)` then `execute(op)`.
addr = "0x3d67838307eedEF76026b84170737254A5FaA438"
kind = "legacy_governance"

[[ownable_proxies]]
# `ChainAdminOwnable`, the bridgehub's and the CTM's `admin()`; owned by the 4-of-7 Safe
# 0x4e4943346848c4867F81dFb37c4cA9C5715A7828.
addr = "0x1Cf8e760e2A85373b8d63d7bff6EbC6A56E4148f"
kind = "oz_chain_admin"
