l1_chain_id = 11155111

# ZK token asset ID as registered in this ecosystem's L1NativeTokenVault (0xF8d4A519...).
# Resolves to 0xd1Ee6cE0A0fDB29793cbDC41DcFE5d356C7d5C7f ("ZKsync"/ZK), whose originChainId
# is 301 — the bridged L1 representation of the chain-301 ZK token.
#
# Recovered from live state rather than chosen: it is the `zkTokenAssetId` field of the
# ZKsync OS CTM's current chain-creation params, as emitted by `NewChainCreationParams` in
# the v31 upgrade (tx 0xb7141992..., block 11172145). Keeping it identical means the v33
# params carry the same L2 `InteropCenter.ZK_TOKEN_ASSET_ID` the ecosystem already runs with.
#
# NOTE: not 0xc479e944..., which is what the same NTV assigns to 0xF41D4478... (a stage-NTV
# bridged ZK token that testnet re-registered as an L1-native asset).
zk_token_asset_id = "0xefb0794fa43edc760ef9bf5b09af2fc0a667a288453d2d55d48878897dc2f317"

# Whether this environment's CTM verifier is the testnet one. Env-wide, not per-CTM.
# Non-mainnet envs run `ZKsyncOSTestnetVerifier`, which accepts unproven batches.
testnet_verifier = true

[permanent_contracts]
create2_factory_addr = "0x4e59b44847b379578588920cA78FbF26c0B4956C"
# `create2_factory_salt` lives in the v31 input TOML
# (`upgrade-envs/v0.31.0-interopB/<env>.toml [contracts] create2_factory_salt`),
# not here — it rotates every regen so it isn't a permanent value.

[core_contracts]
bridgehub_proxy_addr = "0xc4fd2580c3487bba18d63f50301020132342fdbd"
# `bridgehub.owner()` is the ProtocolUpgradeHandler 0x803e5E7aF1FDD504F8844E28a249203Cfa7c471D,
# not a plain `Ownable` — so governance replay must impersonate the handler directly rather
# than taking the schedule+execute path.
governance_kind = "puh"


# TODO(EVM-1200): The single-CTM `[ctm_contracts]` block below is for ZKsync OS (Atlas)
# and NOT Era — this is due to no canonical Era chain being present on testnet historically.
# The newer `[[ctm_contracts.ctms]]` array reflects both CTMs that are actually registered
# on the testnet bridgehub today.
[ctm_contracts]
ctm_proxy_addr = "0x54D55e74De9c6003E7a68a1fE70E633f05761eb5"
l1_bytecodes_supplier_addr = "0x3ad11E8BAAa24708086EEdaEE28722B8c1489e3b"
rollup_da_manager = "0xC90E4E4897421E9380d734b72221f5485C3fd116"

# Multi-CTM list. Both CTMs are on v31 now, so the getters the overrides used to stand in
# for (`ctm.isZKsyncOS()`, `ctm.L1_BYTECODES_SUPPLIER()`) exist on chain.
#
# Only the ZKsync OS entry is upgradeable onto v33: `upgrade-prepare-all` logs
# "skipping Era CTM ..." for the other, and `CTMUpgrade_v33.noGovernancePrepare` would refuse
# it outright. The Era entry stays listed because it describes the environment.
[[ctm_contracts.ctms]]
# Atlas (ZKsyncOS) CTM (witness chain: 8022833)
# No `bytecodes_supplier`: `ChainTypeManagerBase` exposes it as the immutable
# `L1_BYTECODES_SUPPLIER`, so protocol-ops auto-resolves it from the CTM. The override this
# entry used to carry had gone stale (it named the pre-v31 supplier), which is exactly the
# drift an override invites — the getter cannot go stale.
# rollup_da_manager queried via `chain.getRollupDAManager()` on chain 8022833's diamond.
proxy = "0x54D55e74De9c6003E7a68a1fE70E633f05761eb5"
is_zk_sync_os = true
rollup_da_manager = "0xC90E4E4897421E9380d734b72221f5485C3fd116"

[[ctm_contracts.ctms]]
# Era CTM (witness chain: 301, v29)
# rollup_da_manager queried via `chain.getRollupDAManager()` on chain 301.
# bytecodes_supplier from v0.29.1-interopA-ff/testnet.toml.
proxy = "0x3Cc81628a14C824057a97C1B4Ab17758E5D18864"
is_zk_sync_os = false
bytecodes_supplier = "0x3ad11E8BAAa24708086EEdaEE28722B8c1489e3b"
rollup_da_manager = "0x6b7D8FD12eF94485c8E928a055124F94C2B5d411"

