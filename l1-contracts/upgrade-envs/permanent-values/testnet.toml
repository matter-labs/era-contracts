[legacy_gateway]
# The chain ID of the legacy Gateway (9075 for mainnet)
# TODO(EVM-1200): The new ZKsync OS testnet does NOT have a legacy Gateway, so just a random valid chain id
# is provided here.
#
# Read only by `ecosystem verify-upgrade` (PUVT), which is a v31-only verifier and is not
# run for v33. The v33 upgrade input deliberately omits its own `[legacy_gateway]` section
# so that the redeployed `L1MessageRoot` keeps `ERA_GATEWAY_CHAIN_ID == 0`, matching the
# currently deployed one — see the note in `v0.33.0-atomic-interop/testnet.toml`.
chain_id = 531050204

