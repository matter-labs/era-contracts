# Permanent values for the `battlechain` environment.
#
# Battlechain is a standalone ecosystem on Ethereum MAINNET (L1 chainId 1) with a
# SINGLE ZKsync-OS ChainTypeManager and a single registered chain (626). It is
# owned end-to-end by a legacy ZKsync `Governance.sol`, not a
# ProtocolUpgradeHandler — hence `governance_kind = "legacy"`.
#
# Every value below was read off mainnet at the time of writing:
#   bridgehub.owner()                        == 0x6145cb32… (the Governance)
#   bridgehub.getAllZKChainChainIDs()        == [626]
#   bridgehub.chainTypeManager(626)          == 0x4Ee4EA87… (the CTM below)
#   CTM.owner()                              == 0x6145cb32…
#   CTM.protocolVersion()                    == 0x1e00000001  (v30.1)
#   CTM.BRIDGE_HUB()                         == 0x6f85C08e…
#   Governance.owner()  = 0x4e494334…(EOA), securityCouncil() = 0x0, minDelay() = 0
#   chain 626 diamond (0xB44d26D2…).getRollupDAManager() == 0x1b60B986…
# The chain is ZKsync-OS, not Era: chain 626's `getDAValidatorPair()` L2 side is
# the DA-scheme sentinel `0x…04` (canonical ZKsync-OS chains likewise use a
# sentinel; Era chain 324 has a real L2 validator address).
#
# v31 takes its CTM from 0x1e00000001 (v30.1) to 0x1f00000000 (v31.0) — the same
# transition as canonical mainnet's ZKsync-OS CTM.

l1_chain_id = 1

# ZK token asset id — the NTV asset id of the ZKsync "ZK" token (L1
# representation 0x66A5cFB2…, native to chain 324). Verified on canonical
# mainnet: NTV(0xbeD1EB54…).tokenAddress(<this id>) == 0x66A5cFB2… (symbol "ZK").
# Asset ids are (originChainId, tokenAddress)-deterministic, so the identifier is
# network-wide regardless of which ecosystem's NTV has bridged it — Battlechain's
# own NTV (0xADD8491a…) has not registered it yet (tokenAddress() returns 0x0),
# which is fine: v31 only needs the identifier.
zk_token_asset_id = "0x83e2fbc0a739b3c765de4c2b4bf8072a71ea8fbb09c8cf579c71425d8bc8804a"

[permanent_contracts]
# Canonical deterministic CREATE2 deployer (Arachnid/foundry).
create2_factory_addr = "0x4e59b44847b379578588920cA78FbF26c0B4956C"
# `create2_factory_salt` lives in the v31 input TOML — it rotates per regen, so it
# is not a permanent value.

[core_contracts]
bridgehub_proxy_addr = "0x6f85C08e2DabB6b0B8B3587D3628FCfb5b10BE19"
# The whole ecosystem — bridgehub, CTM, the shared ProxyAdmin (0x31b47777…) and
# the RollupDAManager — is owned by the legacy `Governance.sol` 0x6145cb32…
# (Ownable2Step timelock, securityCouncil = 0x0, minDelay = 0). Its own owner is
# an EOA (0x4e494334…), so the ceremony replays as
# scheduleTransparent + execute from that EOA.
governance_kind = "legacy"

[ctm_contracts]
# Single ZKsync-OS CTM. The flat field is the legacy shape; the v31 multi-CTM flow
# reads the `[[ctm_contracts.ctms]]` array below.
ctm_proxy_addr = "0x4Ee4EA87b909ea3E1C36d9fcbf6C0e535165f96D"

[[ctm_contracts.ctms]]
proxy = "0x4Ee4EA87b909ea3E1C36d9fcbf6C0e535165f96D"
# Pre-v31 overrides: the v31 getters (`ctm.isZKsyncOS()`,
# `ctm.L1_BYTECODES_SUPPLIER()`) don't exist on v30.1 yet, so the introspector
# takes its V29 path and cannot resolve them.
is_zk_sync_os = true
# NOT load-bearing: the v31 CTM prepare deploys a FRESH BytecodesSupplier and
# overwrites this before anything reads it (the value is never called nor
# code-checked). A non-zero address is nevertheless required to satisfy the
# resolve step, so this points at canonical mainnet's BytecodesSupplier — a real
# deployed contract (verified: it has code).
bytecodes_supplier = "0xC9F20FC268Fc3e0e597660550033Bf2C24218fd8"
# Verified: chain 626's diamond reports this manager, and it is Governance-owned.
rollup_da_manager = "0x1b60B98612163e47BFD038F11e79Cad235500581"

# No `[[ownable_proxies]]`: nothing here is owned by a keyless contract that would
# need wrapping. The CTM, the bridgehub and the shared ProxyAdmin are all owned
# directly by the single ecosystem Governance, which `governance_kind = "legacy"`
# already drives (verified: ProxyAdmin 0x31b47777….owner() == 0x6145cb32…).
#
# No `[legacy_gateway]`: chain 626 has always settled on L1, never on a Gateway,
# so v31 emits no settlement-layer decommission calls.
# No `[new_gateway]`: v31 brings up no Gateway CTM for this ecosystem — which also
# means the ZK token is not a new-GW base token here, so the fork rehearsal's ZK
# funding is best-effort (see `env_has_gateway` in upgrade-bundle-lib.sh).
