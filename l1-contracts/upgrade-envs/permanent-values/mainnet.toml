l1_chain_id = 1

zk_token_asset_id = "0x83e2fbc0a739b3c765de4c2b4bf8072a71ea8fbb09c8cf579c71425d8bc8804a"

# Whether this environment's CTM verifier is the testnet one. Env-wide, not per-CTM.
# Mainnet runs the production verifier.
testnet_verifier = false

[permanent_contracts]
create2_factory_addr = "0xf1Ebfaa992854ECcB01Ac1F60e5b5279095cca7F"
# `create2_factory_salt` lives in the v31 input TOML
# (`upgrade-envs/v0.31.0-interopB/<env>.toml [contracts] create2_factory_salt`),
# not here — it rotates every regen so it isn't a permanent value.

[core_contracts]
bridgehub_proxy_addr = "0x303a465B659cBB0ab36eE643eA362c509EEb5213"
# Mainnet's bridgehub.owner() is the ProtocolUpgradeHandler (decentralized
# governance) — same shape as stage. Replay short-circuits via direct anvil
# impersonation in fork mode (`governanceExecuteCallsDirect`). On real chain
# the proposal goes through PUH's emergency / standard upgrade path.
governance_kind = "puh"

[ctm_contracts]
# Legacy single-CTM (Era) — kept for anvil-interop synthetic-state harnesses.
# The v31 multi-CTM upgrade flow uses the `[[ctm_contracts.ctms]]` array below.
ctm_proxy_addr = "0xc2eE6b6af7d616f6e27ce7F4A451Aedc2b0F5f5C"
l1_bytecodes_supplier_addr = "0xC9F20FC268Fc3e0e597660550033Bf2C24218fd8"
rollup_da_manager = "0xE689e79a06D3D09f99C21E534cCF6a8b7C9b3C45"

# Multi-CTM list — consumed by `protocol_ops` via `--env` (see `EnvConfig::ctms`).
# Mainnet is currently pre-v31 — overrides are required because the v31 getters
# (`ctm.isZKsyncOS()`, `ctm.L1_BYTECODES_SUPPLIER()`) don't exist yet.
[[ctm_contracts.ctms]]
# Era CTM (witness chain: 324)
proxy = "0xc2eE6b6af7d616f6e27ce7F4A451Aedc2b0F5f5C"
is_zk_sync_os = false

bytecodes_supplier = "0xC9F20FC268Fc3e0e597660550033Bf2C24218fd8"
rollup_da_manager = "0xE689e79a06D3D09f99C21E534cCF6a8b7C9b3C45"

[[ctm_contracts.ctms]]
# Atlas (ZKsyncOS) CTM (witness chain: 30715)
# rollup_da_manager queried via `chain.getRollupDAManager()` on the diamond proxy.
# bytecodes_supplier shared with Era on mainnet (per
# v0.29.2-interopA-ff/mainnet.toml and v0.31.0-interopB/mainnet.toml — both
# carry a single `l1_bytecodes_supplier_addr` per env, matching the pattern
# already documented on stage/testnet).
proxy = "0x1adf137f59949c9081157d5dE1e002D1c992071F"
is_zk_sync_os = true
bytecodes_supplier = "0xC9F20FC268Fc3e0e597660550033Bf2C24218fd8"
rollup_da_manager = "0x3F54A35a979Fe576159002B05bE2eDf9b455FAAA"

