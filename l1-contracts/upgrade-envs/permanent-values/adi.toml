# Permanent values for the `adi` environment.
#
# ADI is a standalone ecosystem on Ethereum MAINNET (L1 chainId 1) with a SINGLE
# ZKsync-OS ChainTypeManager and a single registered chain (36900). It is owned
# end to end by a legacy ZKsync `Governance.sol`, not a ProtocolUpgradeHandler —
# hence `governance_kind = "legacy"`.
#
# Every value below was read off mainnet on 2026-09-04. Discovery started from the
# Jarvis registry entry `adi_mainnet` (ecosystem `adiMainnet`, chainId 36900,
# state `normal`, settlementLayerChainId 1, l2SemVerProtocolVersion v0.30.1) and
# was then confirmed by direct calls against Ethereum mainnet:
#
#   bridgehub.owner()                     == 0x8253F33026c49A430963FE3991441c02175bda95 (the Governance)
#   bridgehub.admin()                     == 0x2d6E82F1f8fba89a67cc8d742B12633db4732Ca7
#   bridgehub.getAllZKChainChainIDs()     == [36900]
#   bridgehub.assetRouter()               == 0xf25227EFAD2046d19777A4CA540b5C016Df7fe7A
#   CTM.BRIDGE_HUB()                      == 0x7a38c18a229Ef8a0AE7104Ba272A46280f2d59Cb
#   CTM.owner()                           == 0x8253F330… (same Governance)
#   CTM.protocolVersion()                 == 128849018881 (0x1e00000001, v0.30.1)
#   CTM proxy admin (EIP-1967 slot)       == 0x8140abb60c9afb5241d90af948cfa7644b2d3217,
#                                            whose owner() == 0x8253F330… (the Governance)
#   Governance.owner()                    == 0xB272B188855128c10a933Edb62CC64c22B1f3754 (a contract, ~171 bytes: a Safe)
#   Governance.securityCouncil()          == 0x95f0c748f60624ddAd536d979993fA23FD86021a (also a Safe)
#   Governance.minDelay()                 == 259200 (3 days)
#   chain 36900 diamond 0x0583Ef2B6416cb7B287406438B940E4d99680C5B:
#     getRollupDAManager()                == 0x57B05e2394B3A12708C552A891f8b0f93645EdEA
#     getAdmin()                          == 0x0a8a2473cc5731575a94f58F470851Bc6695B5B8
#     getDAValidatorPair()                == (0xFB630a206E6D7485cB9DFa929859E1a977F0a211, 0x…04)
#
# The chain is ZKsync-OS, not Era: chain 36900's `getDAValidatorPair()` L2 side is
# the DA-scheme sentinel `0x…04` (canonical ZKsync-OS chains likewise use a
# sentinel; Era chain 324 has a real L2 validator address). `CTM.isZKsyncOS()`
# cannot be used to confirm this — it does not exist at v0.30.x and reverts.
#
# v31 takes this CTM from 0x1e00000001 (v30.1) to 0x1f00000000 (v31.0) — the same
# transition as canonical mainnet's ZKsync-OS CTM.
#
# CAUTION — this Governance is NOT like any env committed so far. stage/testnet/
# mainnet are PUH-governed. The (removed) battlechain env was legacy-Governance too
# but had `securityCouncil() == 0x0` and `minDelay() == 0`, so its ceremony replayed
# as `scheduleTransparent` + `executeInstant` in two consecutive txs from an EOA.
# Here the Governance is owned by a Safe, has a REAL security council and a 3-day
# minDelay, so a fork replay must either impersonate the security council for
# `executeInstant`, or advance time past the delay (protocol_ops has
# `evm_increase_time_and_mine`) before calling `execute`. Verify this path before
# trusting a rehearsal.

l1_chain_id = 1

# ZK token asset id — the NTV asset id of the ZKsync "ZK" token (L1 representation
# 0x66A5cFB2…, native to chain 324). Asset ids are (originChainId, tokenAddress)-
# deterministic, so the identifier is network-wide regardless of which ecosystem's
# NTV has bridged it. ADI's own NTV (0x0A0F8912162Ff83A036883dbaDA42efF647a3065)
# has NOT registered it — `tokenAddress(<this id>)` returns 0x0 — which is fine:
# v31 only needs the identifier. Note the fork-rehearsal ZK funding is therefore a
# no-op here (it mints to the zero address), same as it was for battlechain.
zk_token_asset_id = "0x83e2fbc0a739b3c765de4c2b4bf8072a71ea8fbb09c8cf579c71425d8bc8804a"

[permanent_contracts]
# Canonical deterministic CREATE2 deployer (Arachnid/foundry).
create2_factory_addr = "0x4e59b44847b379578588920cA78FbF26c0B4956C"
# `create2_factory_salt` lives in the v31 input TOML — it rotates per regen, so it
# is not a permanent value.

[core_contracts]
bridgehub_proxy_addr = "0x7a38c18a229Ef8a0AE7104Ba272A46280f2d59Cb"
# The whole ecosystem — bridgehub, CTM and the CTM's ProxyAdmin (0x8140abb6…) — is
# owned by the legacy `Governance.sol` 0x8253F330… (Ownable2Step timelock,
# securityCouncil = 0x95f0c748…, minDelay = 259200). Its own owner is a Safe
# (0xB272B188…), so the ceremony is scheduled and executed through that Safe.
governance_kind = "legacy"

# Deliberately no flat `[ctm_contracts] ctm_proxy_addr`: `EnvConfig::ctms()` reads
# only the `[[ctm_contracts.ctms]]` array below (no fallback), and the flat field is
# a legacy shape whose sole reader is the anvil-interop synthetic-state runner.
[[ctm_contracts.ctms]]
proxy = "0x08A1D2962fC29AA46e869A1E7561112cc1026EfA"
# Pre-v31 overrides: the v31 getters (`ctm.isZKsyncOS()`,
# `ctm.L1_BYTECODES_SUPPLIER()`) do not exist on v30.1 — both revert — so the
# introspector takes its V29 path and cannot resolve them.
is_zk_sync_os = true
# NOT load-bearing: the v31 CTM prepare deploys a FRESH BytecodesSupplier and
# overwrites this before anything reads it (the value is never called nor
# code-checked). A non-zero address is nevertheless required to satisfy the resolve
# step, so this points at canonical mainnet's BytecodesSupplier — a real deployed
# contract (verified 2026-09-04: it has code). The cleaner fix is to let the
# resolver accept an absent supplier for pre-v31 ZKsync-OS CTMs.
bytecodes_supplier = "0xC9F20FC268Fc3e0e597660550033Bf2C24218fd8"
# Verified: chain 36900's diamond reports this manager.
rollup_da_manager = "0x57B05e2394B3A12708C552A891f8b0f93645EdEA"

# No `[[ownable_proxies]]`: nothing here is owned by a keyless contract that would
# need wrapping. The CTM, the bridgehub and the CTM's ProxyAdmin are all owned
# directly by the single ecosystem Governance, which `governance_kind = "legacy"`
# already drives (verified: ProxyAdmin 0x8140abb6….owner() == 0x8253F330…).
#
# No `[legacy_gateway]`: chain 36900 settles on L1 (settlementLayerChainId == 1),
# so v31 emits no settlement-layer decommission calls.
# No `[new_gateway]`: v31 brings up no Gateway CTM for this ecosystem — which also
# means PUVT needs no `--gw-rpc-url` here.
