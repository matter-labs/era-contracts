# How the generate / replay / deploy pipeline handles this upgrade
# (protocol-ops/src/common/upgrade_descriptor.rs). One forge script prepares it; its only L1
# transactions publish the L2 factory deps into stage's BytecodesSupplier.
prepare = "forge-script"
script = "deploy-scripts/upgrade/v33/CTMUpgrade_v33.s.sol:CTMUpgrade_v33"
signature = "prepare(string,string)"
args = [
  "/upgrade-envs/v0.33.0-compiler/{env}.toml",
  "/upgrade-envs/v0.33.0-compiler/output/{env}/ecosystem.toml",
]
# On the fork the bundle was replayed on: governance stages, the chain upgrade, a test chain, L1 assertions.
verify_fork = ["bash", "upgrade-envs/v0.33.0-compiler/rehearse-stage.sh"]
# Read-only against the real chain: every factory dep is published.
verify_chain = ["bash", "upgrade-envs/v0.33.0-compiler/rehearse-stage.sh", "--published-only"]

# How whoever executes sends the governance stages: one emergency proposal through the env's
# Emergency Upgrade Board, from the owner of its member Safes. Run read-only on the generation fork
# after the deploy bundle; the pipeline replays the txs there and renders EXECUTE.md from them.
[execution]
script = "deploy-scripts/upgrade/EmergencyStageUpgradeCalldata.s.sol:EmergencyStageUpgradeCalldata"
signature = "emergencyUpgradeAllStages(string,string,string)"
args = [
  "/upgrade-envs/permanent-values/{env}.toml",
  "/upgrade-envs/v0.33.0-compiler/output/{env}/ecosystem.toml",
  "/upgrade-envs/v0.33.0-compiler/output/{env}/emergency-upgrade-board.json",
]
output = "emergency-upgrade-board.json"
