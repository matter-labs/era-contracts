# v33 compiler-only upgrade of testnet3's Era CTM (the EraVM testnet ecosystem, chain 312) — input for
# deploy-scripts/upgrade/v33/CTMUpgrade_v33.s.sol (see that script's doc).
#
# The ecosystem was deployed directly at v0.31.1 (Sepolia block 11759177) with the bootloader built by
# zksolc 1.5.11. v33 installs this branch's zksolc 1.5.17 + DSE-safe bootloader / default account / EVM
# emulator and system contracts, the same upgrade stage got; nothing on L1 changes.

# testnet3 Era ChainTypeManager proxy (Sepolia). Chains 312 and 300300.
ctm = "0x4d058d138F477c4b97B3D762f923811b20220078"
# The CTM's BytecodesSupplier (`L1_BYTECODES_SUPPLIER()`).
bytecodes_supplier = "0x9F04fAfbc1b4FED64DeBa32bd9817f26B6428305"
# DefaultUpgrade deployed with the CTM (CREATE2 from the ecosystem deployer, verified on Etherscan). The
# CTM has never been upgraded, so this is the DefaultUpgrade compiled with its live diamond layout.
default_upgrade = "0x23Cc64B919B08265309B2e5eC498Dd38CBf887F7"

old_protocol_version = 133143986177  # v0.31.1
new_protocol_version = 141733920768  # v0.33.0, the version stage's Era chains run

# Chains upgraded by this output. 300300 is also on v0.31.1 but has never committed a batch, so its
# genesis L2 upgrade tx is still pending and BaseZkSyncUpgrade refuses a new minor until it executes.
# Once it has, build its call with `protocol_ops chain upgrade --env testnet3 --chain-id 300300`, which
# reads the v0.31.1 -> v0.33.0 cut registered on the CTM.
chain_ids = [312]

# Layout of the force-deployment data the CTM stores: testnet3 was deployed after #2239, so it is
# this branch's FixedForceDeploymentsData.
stored_force_deployments_layout = "current"

# Data of the CTM's last NewChainCreationParams event (Sepolia block 11760516, tx 0xb9dc4ce5…):
# abi.encode(genesisUpgrade, genesisBatchHash, genesisIndexRepeatedStorageChanges,
# genesisBatchCommitment, newInitialCut, newInitialCutHash, forceDeploymentsData,
# forceDeploymentHash). The script checks both hashes against the CTM before using it.
current_chain_creation_params_event_data = ""
