# Upgrade input for the mainnet environment on the v35 release. See protocol-ops/README.md "Environment inputs".

era_chain_id = 324

# `bridgehub.owner()`, the signer of the governance bundle.
owner_address = "0xE30Dca3047B37dc7d88849dE4A4Dc07937ad5Ab3"

# This release replaces the ecosystem's governance set: a new ProtocolUpgradeHandler
# implementation plus Guardians, SecurityCouncil and EmergencyUpgradeBoard, wired in by four
# governance calls (protocol-ops `zk_governance.rs`). Declared per RELEASE, here, rather than
# inferred from `governance_kind = "puh"` in permanent-values — that key says the ecosystem
# HAS a PUH, which is true of every release, so inferring from it made every recurring
# preparation redeploy the governance set. A later release omits this key and redeploys
# nothing. Revalidate at the release cut, like every other value in this file.
redeploy_zk_governance = true

[contracts]
# Rotated every release: CREATE2 returns the previously deployed contract if a salt is reused.
create2_factory_salt = "0x59b6b8c797dcd101be698bc89bf2a96c5fddc12899f1d0ecc546ada6c53e451c"

# Per-CTM CREATE2 salts, keyed by CTM proxy: two CTM prepares deploying a contract with env-wide
# constructor args need distinct salts.
[create2_factory_salts]
"0xc2eE6b6af7d616f6e27ce7F4A451Aedc2b0F5f5C" = "0x992875e9cc73665d5ef1d34d81987e888e166131fee674ca9b07c554061ec96d"
"0x1adf137f59949c9081157d5dE1e002D1c992071F" = "0x15efa40253d294e6b3ef780e69710cb6a5d2ad59bc550b87b396555a5dbbab04"
