# Upgrade input for the stage environment on the v33 release.
#
# Copied from the v0.31.0-interopB entry of the same name: these values describe the
# *environment* (bridgehub address, chain id, create2 salt), not the release. The target
# protocol version and chain-creation params come from
# `configs/genesis/zksync-os/latest.json`.
#
# The file must exist for `--env <name>` to work at all: `upgrade-prepare-all` refuses to fall
# back to the local default, which would silently substitute local's values for the keys this
# file does supply.
#
# ⚠ Salts, `owner_address` and `era_chain_id` are NOT read from this file yet.
# `EnvConfig` still resolves them from `upgrade-envs/v0.31.0-interopB/<env>.toml`
# (`env_config.rs`'s `V31_UPGRADE_DIR`), so editing them here has no effect — and a v33
# prepare consequently reuses the v31 CREATE2 salt, which the salt is explicitly not
# supposed to be (it rotates per regen, or CREATE2 returns the previously deployed
# contract). Moving that namespace per release also moves the canonical review-artifact
# directory (`output/<env>/`), so it is left as a follow-up decision rather than folded
# into this PR.
#
# Pruned for v33: the EraVM chain-creation params and v29-era leftovers earlier envs carried
# (bootloader / default-AA / EVM-emulator hashes, `recursion_*_vk_hash`, `genesis_*`,
# `diamond_init_*`, `v28_protocol_version`, the priority-tx gas knobs) are gone — v33 is
# ZKsync OS-only and nothing on this path reads them. Chain-creation params come from
# `configs/genesis/zksync-os/latest.json`.

era_chain_id = 270
testnet_verifier = true
governance_upgrade_timer_initial_delay = 1200
