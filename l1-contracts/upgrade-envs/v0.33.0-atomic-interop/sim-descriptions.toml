# Human-readable descriptions for this release's transaction-simulator scenarios.
#
# Loaded by `protocol_ops ecosystem governance-toml-to-simulator`, which auto-discovers this
# file at `upgrade-envs/<release>/sim-descriptions.toml`. Each `[[entries]]` block matches a
# tx by `(target, selector)` plus optional discriminators; first match wins, and an unmatched
# tx keeps its auto-generated `[unlabelled] …` description.
#
# The registry is release-wide, not per-env. Entries below are keyed by **testnet** addresses,
# which do not collide with stage or mainnet, so adding stage/mainnet entries later is safe.
#
# Address-typed fields (`target`, `arg0_address`, `inner_target`) accept a `0x…` literal or a
# label from `[labels]`. Prefer labels: a salt rotation then only edits `[labels]`.

[labels]
