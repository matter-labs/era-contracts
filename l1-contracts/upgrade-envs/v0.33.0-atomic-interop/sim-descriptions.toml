# ── Migration pause / unpause ────────────────────────────────────────────────
[[entries]]
target = "chain_asset_handler"
selector = "0xac700e63"
desc = "L1ChainAssetHandler.pauseMigration(): freeze chain migrations for the duration of the upgrade"

[[entries]]
target = "chain_asset_handler"
selector = "0xf7c7eb92"
desc = "L1ChainAssetHandler.unpauseMigration(): re-enable chain migrations now that the upgrade is live"

# ── Governance upgrade timer ─────────────────────────────────────────────────
[[entries]]
