# ── Per-chain upgrade (one scenario file each, from `protocol_ops chain upgrade`) ─────────
# Both calls are `ChainAdmin.multicall`, so they are told apart by the inner call's selector:
#   0xe2a9d554 = ServerNotifier.setUpgradeTimestamp
#   0x3b6d7534 = upgradeChainFromVersion

[[entries]]
target = "zkos_chain_admin_1401"
selector = "0x69340beb"
inner_selector = "0xe2a9d554"
desc = "ChainAdmin.multicall: ServerNotifier.setUpgradeTimestamp(1401, 1) — 1 means no waiting, and 0 is rejected as the unset sentinel. Requires stage 1 to have registered the v33 cut, which is why this file must run after the ecosystem scenario."

[[entries]]
target = "zkos_chain_admin_1401"
selector = "0x69340beb"
inner_selector = "0x3b6d7534"
desc = "ChainAdmin.multicall: upgradeChainFromVersion(chain 1401, 0x1f00000001 -> 0x2100000000) plus the DA move to LogsOnly delivered through blobs — THE per-chain diamond cut."

