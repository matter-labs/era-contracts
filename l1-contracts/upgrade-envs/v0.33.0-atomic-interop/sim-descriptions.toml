selector = "0xa39f7449"
desc = "GovernanceUpgradeTimer.startTimer(): open the 1200s window chains get to upgrade before stage 1 may run"

[[entries]]
target = "gov_upgrade_timer"
selector = "0x43bf9936"
desc = "GovernanceUpgradeTimer.checkDeadline(): assert the stage-0 window has elapsed (reverts if stage 1 runs too early)"

