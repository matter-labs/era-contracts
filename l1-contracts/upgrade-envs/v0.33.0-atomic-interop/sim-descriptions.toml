selector = "0x810340c0"
desc = "ChainTypeManager.setDefaultUpgrade(DefaultUpgradeZKsyncOS): the GENERIC upgrade contract later releases reuse when they need no custom logic. Deliberately not this release's one-shot V32UpgradeZKsyncOS, whose priority-op-bound preconditions only hold while crossing v31 -> v33."

