# Upgrade input for the v33 release on a local anvil ecosystem.
#
# Intentionally empty of values. Nothing on the v33 path reads a key from this file:
#   - the target protocol version and chain-creation params come from
#     `configs/genesis/zksync-os/latest.json` (`DefaultCoreUpgrade.loadProtocolVersionFromGenesis`);
#   - the old version comes from the chain on L1;
#   - the bridgehub and CTM come from the caller's `--bridgehub` / `--ctm-proxy`;
#   - `era_chain_id`, `testnet_verifier` and the CREATE2 salts come from
#     `permanent-values/<env>.toml`.
#
# What the file is for is its *name*: `upgrade-prepare-all --env local` resolves its input as
# `upgrade-envs/v0.33.0-atomic-interop/local.toml` and refuses to fall back to another
# environment's file, because the same name also selects `permanent-values/local.toml` — and
# with it `testnet_verifier`. So the file has to exist; it does not have to say anything.
#
# If a future consumer needs a value here, note that `new_protocol_version` is read as
# `$.contracts.new_protocol_version` (nested), not at the top level.
