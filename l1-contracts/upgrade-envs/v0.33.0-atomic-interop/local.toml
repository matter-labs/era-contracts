# Upgrade input for the v33 release on a local anvil ecosystem.
#
# Same shape as `stage.toml` / `mainnet.toml`, minus the recorded addresses: a local ecosystem is
# deployed fresh, so its bridgehub, bytecodes supplier, DA manager, security council and CREATE2
# salts are discovered at run time or randomised per regen rather than committed. `--bridgehub` and
# `--ctm-proxy` supply the first two on the command line.

era_chain_id = 6565
testnet_verifier = true
governance_upgrade_timer_initial_delay = 0
support_l2_legacy_shared_bridge_test = false
old_protocol_version = 0x1f00000000  # v31.0.0

[contracts]
governance_min_delay = 0
max_number_of_chains = 100
create2_factory_addr = "0x4e59b44847b379578588920cA78FbF26c0B4956C"
validator_timelock_execution_delay = 0
latest_protocol_version = 0x2100000000  # v33.0.0
