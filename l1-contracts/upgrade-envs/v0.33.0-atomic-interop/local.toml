# Upgrade input for the v33 release on a local anvil ecosystem.
#
# Deliberately minimal. The upgrade reads almost nothing from here: the target protocol
# version and chain-creation params come from `configs/genesis/zksync-os/latest.json`
# (`DefaultCoreUpgrade.loadProtocolVersionFromGenesis`), the old version from the chain
# on L1, and the bridgehub/CTM addresses from the caller's `--bridgehub`/`--ctm-proxy`.
# The versions below are recorded so tooling reporting on the upgrade is accurate.
#
# v33 is ZKsync OS-only, so the EraVM chain-creation params earlier envs carried
# (bootloader/default-AA/EVM-emulator hashes, `recursion_*_vk_hash`, `diamond_init_*`)
# are deliberately absent — nothing on this path reads them.
#
# The file's *name* matters: `--env <name>` resolves the input as
# `upgrade-envs/v0.33.0-atomic-interop/<name>.toml` and the permanent values as
# `permanent-values/<name>.toml`, which is where `testnet_verifier` lives.

# The bridgehub is not repeated here: it comes from the caller's `--bridgehub` and is recorded
# in `permanent-values/<env>.toml` under `[core_contracts]`. The chain id is not read on this
# path either, so both are omitted rather than kept in sync in three places.

# v31 -> v33.
old_protocol_version = 0x1f00000000
latest_protocol_version = 0x2100000000
new_protocol_version = 0x2100000000
