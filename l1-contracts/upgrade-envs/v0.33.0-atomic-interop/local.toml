# Upgrade input for the v33 release on a local anvil ecosystem.
#
# Intentionally empty of values. Nothing on the v33 path reads a key from this file:
#   - the target protocol version and chain-creation params come from
#     `configs/genesis/zksync-os/latest.json` (`DefaultCoreUpgrade.loadProtocolVersionFromGenesis`);
#   - the old version comes from the chain on L1;
#   - the bridgehub and CTM come from the caller's `--bridgehub` / `--ctm-proxy`;
#   - `era_chain_id`, `testnet_verifier` and the CREATE2 salts come from
#     `permanent-values/<env>.toml`.
#
# It still has to exist, though: `upgrade-prepare-all --env local` resolves its input as
# `upgrade-envs/v0.33.0-atomic-interop/local.toml` and errors if that file is absent rather than
# falling back to a default. The fallback is what is dangerous — for a *real* environment it would
# quietly substitute local's `era_chain_id`, `governance_upgrade_timer_initial_delay` and gateway
# chain id (the last of which is baked into `L1MessageRoot` as `ERA_GATEWAY_CHAIN_ID`). Requiring
# the file also catches a mistyped `--env`. So an empty file is this environment stating, on the
# record, that it needs nothing from the input.
#
# Note that `permanent-values/local.toml` is selected by the `--env` name directly, not by this
# file — so this file's contents cannot affect which `testnet_verifier` is used.
#
# If a future consumer needs a value here, note that `new_protocol_version` is read as
# `$.contracts.new_protocol_version` (nested), not at the top level.
