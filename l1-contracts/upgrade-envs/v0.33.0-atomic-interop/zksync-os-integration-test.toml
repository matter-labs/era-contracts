# Upgrade input for the frozen local chain committed in zksync-os-integration-tests
# (`tests/local-chains/`, currently v31.0 / chain 506), used by its v31 -> v33 upgrade test.
#
# Value-for-value a copy of `local.toml` in this directory; it exists under its own basename so the
# fixture is addressable as its own `--env zksync-os-integration-test`.
#
# Note for anyone porting the v31 flow's reasoning: v31 needed a separate basename because
# `CoreUpgrade_v31` paired the input with `../permanent-values/<basename>.toml` and
# `permanent-values/local.toml` declares chain 506 as the legacy gateway — the very chain being
# upgraded. v33 has no stage-2 decommission step and reads permanent-values nowhere, so that hazard
# is gone and only the env-name addressing remains.
#
# See `local.toml` for why the values below are inert.

