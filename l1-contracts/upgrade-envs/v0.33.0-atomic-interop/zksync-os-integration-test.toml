# Upgrade input for the frozen local chain committed in zksync-os-integration-tests
# (`tests/local-chains/`, currently v31.0 / chain 506), used by its v31 -> v33 upgrade test.
#
# Value-for-value a copy of `local.toml` in this directory. It exists under its own basename
# so that `CoreUpgrade_v33`'s basename pairing resolves to
# `../permanent-values/zksync-os-integration-test.toml` rather than
# `../permanent-values/local.toml`.
#
# Note that unlike the v31 flow, v33 never reads `[legacy_gateway]` — it has no stage-2
# decommission step — so the separation is now about keeping the fixture's permanent values
# addressable on their own, not about avoiding calls against chain 506.
#
# See `local.toml` above for why the values below are inert.

