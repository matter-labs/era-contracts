# v34 Era upgrade of mainnet's Era CTM — input for
# deploy-scripts/upgrade/v34-era/CTMUpgrade_v34Era.s.sol (see that script's doc).
# Values as they will be after ZIP-18 (v31) executes, which moves the CTM from v0.30.1 to v0.33.0: from
# ZIP-18's committed output (tag zip-18, upgrade-envs/v0.31.0-interopB/output/mainnet/ecosystem.toml) and
# read on mainnet at block 26292702 from the contracts ZIP-18 already deployed. Re-read on live mainnet
# once ZIP-18 has executed, before generating. The script re-checks each one that has an on-chain getter.

# Mainnet Era ChainTypeManager proxy.
ctm = "0xc2eE6b6af7d616f6e27ce7F4A451Aedc2b0F5f5C"
# L1_BYTECODES_SUPPLIER() of ZIP-18's CTM implementation (permanent-values/mainnet.toml's is pre-ZIP-18).
bytecodes_supplier = "0x456A572539d9D9697fFD68954A7a039682D99557"
# PERMISSIONLESS_VALIDATOR() of ZIP-18's CTM implementation; a constructor argument of the new one.
permissionless_validator = "0xE220059BBA4684BF2Cf0B9E6E5A9DF94D9fb90E9"
# The bridgehub's chainAssetHandler(): MailboxFacet constructor and the stage 0/1/2 pause target.
chain_asset_handler = "0xDd5CB8B9037357B4cD37391A073798f8aaB61076"
# ROLLUP_DA_MANAGER() of ZIP-18's AdminFacet; an AdminFacet constructor argument.
rollup_da_manager = "0xc16161C7f704388285fE58db287F6216a350dAFA"
# EIP_7702_CHECKER of ZIP-18's MailboxFacet (internal immutable, read from its code).
eip7702_checker = "0x4a9928907Fa80dd3c0cFBd2d30BF44160F092714"
# Reuse ZIP-18's FFLONK verifier: its key is the genesis fflonk_snark_wrapper_vk_hash.
deploy_verifier_fflonk = false
# FFLONK_VERIFIER() of ZIP-18's v0.33.0 verifier; reused as the multi-proof verifier's Boojum verifier.
verifier_fflonk = "0x870C0A2bd4f253dd867b2239a0d8d86f87D64128"
# initAddress of ZIP-18's creation cut; reused for new chains.
diamond_init = "0xA4A7fD899CaD981A66D366D7C293A234e4c967D0"
# ERA_CHAIN_ID of ZIP-18's MailboxFacet, and eraChainId of the stored force-deployment data.
era_chain_id = 324
# Production: deploy EraMultiProofVerifier, and the Mailbox and Migrator facets' mainnet time windows.
testnet_verifier = false
# Runtime codehash of ZIP-18's v0.33.0 verifier (EraDualVerifier 0x5D5d…, which has no IS_TESTNET_VERIFIER()).
old_verifier_codehash = "0x791fb5f800c0abdc60f37dd2fd93cec0de9c92a79ffc9b479ee3823b365fd65b"

old_protocol_version = 141733920768  # v0.33.0
new_protocol_version = 146028888064  # v0.34.0

# Deploy a GovernanceUpgradeTimer and an UpgradeStageValidator: stage 1 runs at least 48 hours after
# stage 0. The delay every mainnet upgrade has used since v28.
governance_upgrade_timer_initial_delay = 172800

# ServerNotifier / ChainAdmin upgrade timestamp for chain 324. 0 until its date is chosen: the script rejects 0,
# so no generation carries a date nobody chose. Commit the chosen date with the generation. The fork test sets
# one locally, uncommitted: the fork's time + 7 days, which fork-mainnet-zip18.sh prints.
upgrade_timestamp = 0

# CREATE2 salt for every deployment. Fresh for this generation; rotate it on every regeneration.
create2_factory_salt = "0x33c3ad6aa59321440ec4b49ac4b9c010a86f555643539add2327afbf12a30cd9"

# Chains upgraded by this output. The CTM's other chains get their calls from the chain workflows.
chain_ids = [324]

# Data of the NewChainCreationParams event ZIP-18's stage 1 emits:
# abi.encode(genesisUpgrade, genesisBatchHash, genesisIndexRepeatedStorageChanges,
# genesisBatchCommitment, newInitialCut, newInitialCutHash, forceDeploymentsData,
# forceDeploymentHash). Built from that stage's setChainCreationParams call to the Era CTM. The script
# checks it against the CTM's initialCutHash and initialForceDeploymentHash.
current_chain_creation_params_event_data = ""
