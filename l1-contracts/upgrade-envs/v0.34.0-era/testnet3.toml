# v34 Era upgrade of testnet3's Era CTM: input for deploy-scripts/upgrade/v34-era/CTMUpgrade_v34Era.s.sol.
# The CTM comes from permanent-values/testnet3.toml; everything else from the chain and the v34 genesis.

# The v0.33.0 verifier is a testnet one: deploy EraMultiProofTestnetVerifier, and keep the testnet time
# windows of the live Mailbox and Migrator facets.
testnet_verifier = true
# Stage 1 runs at least 20 minutes after stage 0: the delay stage and testnet upgrades have used since v28/v29.
governance_upgrade_timer_initial_delay = 1200
# CREATE2 salt for every deployment; must differ from stage's (same chain). Kept from the first deployment, so
# unchanged contracts keep their addresses. Generate at Sepolia block 12018509, before that deployment, so the
# rehearsal deploys and checks every contract.
create2_factory_salt = "0xddad502b2a096a3a1442ea9a8ef9fc7188c1876e20722de3b215a7a8d5403f67"
# Never v29 introspection, which the base would pick if the bridgehub's first chain were below v0.31.
use_v29_introspection = false
