# How the generate / replay / deploy pipeline handles this upgrade
# (protocol-ops/src/common/upgrade_descriptor.rs). One forge script prepares it; its L1 transactions
# are the CREATE2 deployments and the publication of the L2 factory deps into the CTM's BytecodesSupplier.
prepare = "forge-script"
script = "deploy-scripts/upgrade/v34-era/CTMUpgrade_v34Era.s.sol:CTMUpgrade_v34Era"
signature = "prepare(string,string,string)"
args = [
  "/upgrade-envs/permanent-values/{env}.toml",
  "/upgrade-envs/v0.34.0-era/{env}.toml",
  "/upgrade-envs/v0.34.0-era/output/{env}/ecosystem.toml",
]
# On the fork the bundle was replayed on: CREATE2 provenance, the ServerNotifier upgrade, governance
# stages, the reference chain's timestamp, drain and upgrade, a test chain, L1 assertions.
verify_fork = ["bash", "upgrade-envs/v0.34.0-era/rehearse.sh"]
# Read-only against the real chain: every factory dep is published and every deployed contract has code.
verify_chain = ["bash", "upgrade-envs/v0.34.0-era/rehearse.sh", "--published-only"]
# protocol-ops' checks, beside rehearse.sh for now: publication; on a fork, provenance and a replay too.
builtin_checks = true
fork_tests = [
  # The output against the chain, build and env; the CTM and chains after; the 15M cap; proof switches.
  { path = "test/foundry/fork/V34EraUpgrade.t.sol" },
  # The first v34 batches; they skip where the reference chain can't upgrade or verifies real proofs.
  { path = "test/foundry/fork/V34EraFirstBatch.t.sol", may_skip_in = ["mainnet"] },
]
