# How the generate / replay / deploy pipeline handles this upgrade
# (protocol-ops/src/common/upgrade_descriptor.rs). One forge script prepares it; its L1 transactions
# are the CREATE2 deployments and the publication of the L2 factory deps into the CTM's BytecodesSupplier.
prepare = "forge-script"
script = "deploy-scripts/upgrade/v34-era/CTMUpgrade_v34Era.s.sol:CTMUpgrade_v34Era"
signature = "prepare(string,string,string)"
args = [
  "/upgrade-envs/permanent-values/{env}.toml",
  "/upgrade-envs/v0.34.0-era/{env}.toml",
  "/upgrade-envs/v0.34.0-era/output/{env}/ecosystem.toml",
]
# protocol-ops' built-in checks; the fork tests run on their replay.
builtin_checks = true
fork_tests = [
  { path = "test/foundry/fork/V34EraUpgrade.t.sol" },
  # Its synthetic batches need a testnet verifier.
  { path = "test/foundry/fork/V34EraFirstBatch.t.sol", envs = ["testnet3"] },
]
