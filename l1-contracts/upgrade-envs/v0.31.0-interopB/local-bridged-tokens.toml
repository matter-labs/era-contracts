# Committed default for the v31 legacy bridged-token migration
# (TokenMigrationUtils.s.sol::_readConfiguredBridgedTokens). Used by local
# fixtures, which never bridged any ERC20s — ETH is registered by stage3
# unconditionally. Real environments are served by the per-env files at
# `upgrade-envs/v0.31.0-interopB/<env>-bridged-tokens.toml` via
# UPGRADE_BRIDGED_TOKENS_INPUT_OVERRIDE (set by `protocol-ops ecosystem
# stage3 --env <env>`).

[tokens]
bridged_tokens = []
