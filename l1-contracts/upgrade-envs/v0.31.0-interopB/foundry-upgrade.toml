# Foundry-specific upgrade configuration for local testing.
#
# The harness deploys at whatever the genesis config declares and then upgrades to
# `new_protocol_version`, and `DefaultCTMUpgrade.initUpgrade` requires
# `ctmProtocolVersion != getNewProtocolVersion()` — so this has to stay one minor ahead of genesis.
# Genesis is at v33.0.0, so the fixture exercises a v33 -> v34 upgrade.
#
# The real v31 -> v33 transition is still covered: the anvil harness pins its own `stateVersion` and
# `run-v31-to-v33-upgrade-test.ts` drives it from the committed `chain-states/v0.31.0` snapshots,
# independent of this genesis version.

old_protocol_version = 0x2100000000  # v33.0.0 (current genesis)

# The fixture's chains are now labelled at the same version as the core contracts it deploys, so
# autodetection would classify the ecosystem correctly on its own; the key is kept explicit so the
# classification does not depend on the introspection heuristic.
pre_v33_introspection = false
v28_protocol_version = 0x1c00000000  # v28.0.0 (for reference)

[contracts]
new_protocol_version = 0x2200000000  # v34.0.0 (target for upgrade)
latest_protocol_version = 0x2200000000  # v34.0.0
