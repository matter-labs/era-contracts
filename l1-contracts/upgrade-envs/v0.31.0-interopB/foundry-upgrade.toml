# Foundry-specific upgrade configuration for local testing.
#
# The local harness deploys at whatever `configs/genesis/era/latest.json` declares and then
# upgrades to `new_protocol_version`, so this must stay one minor ahead of the genesis version:
# `DefaultCTMUpgrade.initUpgrade` requires `ctmProtocolVersion != getNewProtocolVersion()`.
# Genesis is at v33.0.0, so the fixture exercises a v33 -> v34 upgrade.

old_protocol_version = 0x2100000000  # v33.0.0 (current genesis)
v28_protocol_version = 0x1c00000000  # v28.0.0 (for reference)

# Read by `DefaultCTMUpgrade` with a bare `toml.readBool`, so it must be present or the
# upgrade reverts on this fixture. `true` gives the local harness the testnet verifier, as
# every other non-mainnet env config does — the fixture has no real proofs to check.
testnet_verifier = true

[contracts]
new_protocol_version = 0x2200000000  # v34.0.0 (target for upgrade)
latest_protocol_version = 0x2200000000  # v34.0.0
