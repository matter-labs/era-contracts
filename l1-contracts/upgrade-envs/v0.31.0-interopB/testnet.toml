# Per-CTM CREATE2 salts. Each CTM prepare deploys a `GovernanceUpgradeTimer`
# whose constructor args are env-wide constants — without a CTM-distinct salt
# every CTM would land the timer at the same CREATE2 address and gov-replay's
# second startTimer() would revert. Keyed by CTM proxy address.
[create2_factory_salts]
# Era CTM (witness chain 301)
"0x3Cc81628a14C824057a97C1B4Ab17758E5D18864" = "0xb5ae0220aac28e88a4e245a0cf5b1aa23998fc662cb85673951ceacd53b55128"
# ZKsync OS (Atlas) CTM (witness chain 8022833)
"0x54D55e74De9c6003E7a68a1fE70E633f05761eb5" = "0x90ce2c6e2c99da7af5198c3533e5d7b51cbf35eaa96d6ce6aa48bb469d6ff209"
