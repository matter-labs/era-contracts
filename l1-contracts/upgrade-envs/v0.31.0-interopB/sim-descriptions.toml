[[entries]]
target = "upgrade_handler"
selector = "0x2c431917"  # scheduleTransparent
inner_target = "atlas_ctm"  # Atlas CTM
inner_selector = "0xf2fde38b"  # transferOwnership
desc = "Legacy Gov: scheduleTransparent — Atlas CTM.transferOwnership(PUH). Queues setting Atlas CTM.pendingOwner = PUH (Ownable2Step; actual transfer happens via stage-0 acceptOwnership)."

[[entries]]
target = "upgrade_handler"
selector = "0x95218ecd"  # executeInstant
inner_target = "atlas_ctm"
inner_selector = "0xf2fde38b"
desc = "Legacy Gov: executeInstant — Atlas CTM.pendingOwner = PUH. Flushes the queued transferOwnership now (delay=0)."

[[entries]]
target = "upgrade_handler"
selector = "0x2c431917"
inner_target = "atlas_ctm_proxy_admin"  # Atlas CTM's ProxyAdmin
inner_selector = "0xf2fde38b"
desc = "Legacy Gov: scheduleTransparent — Atlas CTM ProxyAdmin.transferOwnership(PUH). Queues handing the PA (single-step Ownable v4) to PUH."

[[entries]]
target = "upgrade_handler"
selector = "0x95218ecd"
inner_target = "atlas_ctm_proxy_admin"
inner_selector = "0xf2fde38b"
desc = "Legacy Gov: executeInstant — Atlas CTM ProxyAdmin is now owned by PUH. PUH can now upgrade Atlas CTM impl in stage 1."

