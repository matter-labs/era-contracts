selector = "0x69340beb"  # multicall
desc = "Era ChainAdmin: multicall — administrative work on Era-owned proxies (e.g. ProxyAdmin or BytecodesSupplier upgrade) signed by Era ChainAdmin's owner (0xd66949…)."

# ─── Bundle 4: Atlas ChainAdmin multicall — in-place ServerNotifier upgrade ───

