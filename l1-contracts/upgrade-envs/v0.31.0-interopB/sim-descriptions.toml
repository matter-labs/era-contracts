# Human-readable descriptions for the v31-interopB stage simulator JSON.
#
# Loaded by `protocol_ops ecosystem governance-toml-to-simulator`. Each
# `[[entries]]` block matches a tx by `(target, selector)` plus optional
# discriminators. First match wins; unmatched txs keep their
# auto-generated description (e.g. "protocol-ops governance stage1 call 14").
#
# Discriminators:
#   - `arg0_address`: first 32-byte word after selector, interpreted as
#     address. Used for `TPA.upgrade(<proxy>, <impl>)` variants.
#   - `inner_target` / `inner_selector`: for wrappers — `ChainAdmin.multicall`
#     (`0x69340beb`), legacy `Governance.scheduleTransparent` (`0x2c431917`),
#     legacy `Governance.executeInstant` (`0x95218ecd`) — match against the
#     FIRST inner call. Lets us distinguish bundle 1's four schedule/execute
#     pairs and the per-CTM ChainAdmin multicalls.
