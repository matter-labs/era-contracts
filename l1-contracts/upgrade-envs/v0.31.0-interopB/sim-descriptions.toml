bridgehub                           = "0x236D1c3Ff32Bd0Ca26b72Af287E895627c0478cE"  # Bridgehub proxy
l1_asset_router                     = "0xfD3130Ea0e8B7Dd61Ac3663328a66d97eb02f84b"  # L1AssetRouter proxy
