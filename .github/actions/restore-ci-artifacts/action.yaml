name: "Restore this commit's build artifacts"
description: >
  Restores the artifacts `build` produced for this exact commit, for the jobs that consume them
  rather than compile their own.

  Cache entries are versioned by their paths. Keep comments outside `path:` blocks: YAML treats
  them as paths inside these block scalars.

  The paired save in `build` and the `build-artifacts` upload still carry their own copies, because
  actions/cache's restore/save split has no mechanism for sharing inputs between them. Keep all
  three in step.

runs:
  using: composite
  steps:
    - name: Restore artifacts cache
      uses: actions/cache/restore@v4
      with:
        fail-on-cache-miss: true
        key: artifacts-l1-ci-${{ github.sha }}
        path: |
          da-contracts/cache-forge
          da-contracts/out
          l1-contracts/cache-forge
          l1-contracts/out
