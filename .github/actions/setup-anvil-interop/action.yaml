name: Setup anvil-interop environment
description: >
  Shared setup for every Anvil Interop CI job: Foundry, Node.js, root dependencies,
  contract artifacts (variant selected via the `artifacts` input) and the
  anvil-interop test dependencies. Checkout must happen before this action runs.

inputs:
  artifacts:
    description: >
      Which contract artifacts to build:
      "dev" — anvil-interop dev artifacts only (interop tests on preloaded state);
      "full" — da + l1 Foundry builds (upgrade tests);
      "deterministic" — da + l1 builds with FOUNDRY_PROFILE=anvil-interop and no
      CBOR metadata, for reproducible bytecode (state-generation check).
    required: true

runs:
  using: composite
  steps:
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: v1.5.1

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: yarn

    - name: Install dependencies
      shell: bash
      run: yarn

    - name: Build anvil-interop dev artifacts
      if: ${{ inputs.artifacts == 'dev' }}
      shell: bash
      run: yarn l1 build:anvil-interop-dev-artifacts

    - name: Build da-contracts artifacts
      if: ${{ inputs.artifacts == 'full' }}
      shell: bash
      run: yarn da build:foundry

    - name: Build l1-contracts artifacts
      if: ${{ inputs.artifacts == 'full' }}
      shell: bash
      run: yarn l1 build:foundry

    - name: Build da-contracts artifacts (no CBOR metadata for determinism)
      if: ${{ inputs.artifacts == 'deterministic' }}
      shell: bash
      run: FOUNDRY_PROFILE=anvil-interop yarn da build:foundry

    - name: Build l1-contracts artifacts (no CBOR metadata for determinism)
      if: ${{ inputs.artifacts == 'deterministic' }}
      shell: bash
      working-directory: l1-contracts
      run: FOUNDRY_PROFILE=anvil-interop forge build

    - name: Install anvil-interop dependencies
      shell: bash
      working-directory: l1-contracts/test/anvil-interop
      run: yarn install
