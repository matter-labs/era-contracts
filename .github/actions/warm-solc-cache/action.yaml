name: "Warm solc build cache"
description: >
  Restores the solc half of a previous commit's contract artifacts so `forge build` recompiles
  only what changed, then drops artifacts whose source no longer exists.

  Four PR-triggered workflows each compile l1-contracts from scratch (~440s apiece, ~29 minutes
  of runner time per PR) and each saves to its own cache key. This shares one cross-commit cache
  between them.

  zksolc output is deliberately excluded: it is not reproducible across builds, so reusing a
  cached `zkout` changes zkBytecodeHash and fails check-hashes. Only the solc side is reused;
  every zkout is rebuilt.

  On trusting a cache: GitHub scopes cache entries per ref, and a fork PR can only write to its
  own PR scope — it cannot write into the base or default-branch scope that other runs read. With
  no push-triggered writer in this repo, reuse is effectively within a single branch. A stale
  entry also fails loudly rather than passing quietly, because check-hashes compares against the
  committed hashes. Even so, keep this out of any job whose output is committed or released, and
  pass enabled: false where a from-scratch build is the point.

inputs:
  enabled:
    description: >
      Set to "false" to skip the restore and compile from scratch. Verification runs — anything
      whose output gets committed or released — should build clean rather than trust a cache.
      The dispatch workflows that commit AllContractsHashes.json, selectors, zkstack-out and the
      chain-state snapshots deliberately do not use this action at all.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Restore solc build cache from a previous commit
      if: inputs.enabled == 'true'
      uses: actions/cache/restore@v4
      with:
        key: artifacts-l1-ci-solc-${{ github.sha }}
        restore-keys: |
          artifacts-l1-ci-solc-
        path: |
          da-contracts/cache-forge
          da-contracts/out
          l1-contracts/cache-forge
          l1-contracts/out

    # Forge never prunes artifacts for sources that are gone, and both calculate-hashes and
    # `forge build --sizes` enumerate the artifact directories — so a cache from a commit that
    # still had a contract would misreport on the commit that deleted it.
    #
    # Matching is per artifact on its full compilationTarget source path, not on the directory
    # basename: forge names artifact directories after the source basename, this repo has 58
    # duplicated basenames, and one directory can therefore hold artifacts from different sources
    # (out/L1NativeTokenVault.sol/ holds both the production contract and the test file's
    # contracts). A basename comparison keeps such a directory alive and its stale artifacts with
    # it. Measured at ~1.5s over 994 artifacts.
    #
    # Only the directories this action actually restores are scanned. zkout is never restored
    # here — zksolc output is not reproducible across builds — and zksolc artifacts carry no
    # compilationTarget to match on anyway.
    - name: Drop artifacts whose source is gone or has changed
      if: inputs.enabled == 'true'
      shell: bash
      run: |
        node "${{ github.action_path }}/prune-stale-artifacts.js" \
          --manifest "$MANIFEST_PATH" \
          "da-contracts:da-contracts/out" \
          "l1-contracts:l1-contracts/out"
      env:
        MANIFEST_PATH: l1-contracts/cache-forge/.warm-solc-cache-sources.json
