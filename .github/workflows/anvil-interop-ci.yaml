name: Anvil Interop CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/workflows/anvil-interop-ci.yaml"
      - ".github/actions/setup-anvil-interop/**"
      - ".github/actions/install-amsterdam-anvil/**"
      - ".github/amsterdam-anvil.env"
      - "l1-contracts/contracts/**"
      - "l1-contracts/deploy-scripts/**"
      - "l1-contracts/dev/**"
      - "l1-contracts/lib/**"
      - "l1-contracts/scripts/**"
      - "l1-contracts/test/**"
      - "l1-contracts/foundry.toml"
      - "l1-contracts/hardhat.config.ts"
      - "l1-contracts/package.json"
      # The upgrade test runs protocol-ops' default upgrade against the genesis version, so the
      # default scripts, the current release's upgrade input and the genesis config decide what it tests.
      - "l1-contracts/upgrade-envs/**"
      - "protocol-ops/**"
      - "protocol-ops.sh"
      - "configs/genesis/**"
      - "package.json"
      - "yarn.lock"

jobs:
  # Fast job: uses pre-generated chain states from the repo.
  # We still compile the runtime deployment artifacts that are not part of those states.
  # If a contract change alters genesis state, regenerate the states via the
  # 'Regenerate Anvil Interop Chain States' workflow; the pre-merge
  # state-generation-check gates that the committed states are current.
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          # Nested libraries affect solc remappings and the metadata the genesis image pins.
          submodules: recursive

      - name: Install Foundry
        uses: ./.github/actions/install-foundry

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn

      - name: Build anvil-interop dev artifacts
        run: yarn l1 build:anvil-interop-dev-artifacts

      - name: Install anvil-interop dependencies
        working-directory: l1-contracts/test/anvil-interop
        run: yarn install

      - name: TypeScript type check
        working-directory: l1-contracts/test/anvil-interop
        run: yarn tsc --noEmit

      # Each suite covers something an ordinary run cannot fail on; see their headers.
      - name: Unit-test the interop harness
        working-directory: l1-contracts/test/anvil-interop
        run: yarn test:unit

      - name: Run interop tests (preloaded state)
        working-directory: l1-contracts/test/anvil-interop
        env:
          # Each worker spawns 6 Anvil chains + a hardhat process; running every spec group at
          # once oversubscribes the 4-core runner and causes load-dependent RPC flakes (worker
          # failures mid-spec). Cap concurrency; locally the suite stays fully parallel.
          ANVIL_INTEROP_MAX_PARALLEL_WORKERS: "4"
        run: |
          echo "Running interop tests with preloaded chain states..."
          yarn ts-node run-hardhat-interop-test.ts

      - name: Cleanup
        if: always()
        working-directory: l1-contracts/test/anvil-interop
        run: |
          bash cleanup.sh

  # Latest upgrade test: boots the previous release's chain states (`upgradeSourceStateVersion` in
  # config/anvil-config.json), prepares the upgrade with protocol-ops' default scripts, executes the
  # governance calls and per-chain upgrades, and checks every chain reached the genesis protocol version.
  # On this release the default upgrade is the registry bootstrap edge (the handover calls,
  # migrate() and the closing validateApplied() completion check, with chains crossing via the
  # legacy handed-cut entrypoint), followed by a patch and a recurring registry-driven hop on the
  # same chains.
  upgrade-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          # Nested libraries affect solc remappings and the metadata the genesis image pins.
          submodules: recursive

      # The committed chain states need a state-compatible Anvil, while the
      # release bytecode is reproduced with the `build` Forge pin.
      - name: Install Anvil toolchain (state-compatible with committed states)
        uses: ./.github/actions/install-foundry

      - name: Preserve the pinned Anvil before switching to the build toolchain
        run: cp "$(command -v anvil)" "$RUNNER_TEMP/anvil-pinned"

      - name: Install foundry
        uses: ./.github/actions/install-foundry

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn

      # Reuses the artifacts l1-contracts-ci built for this commit rather than compiling them again.
      # Via the action, not a bare cache restore: the prefix key can land a previous commit's `out`,
      # and without the pruning a deleted contract's stale ABI would reach the upgrade harness.
      - name: Warm solc build cache
        uses: ./.github/actions/warm-solc-cache

      - name: Build l1-contracts artifacts
        run: yarn l1 build:foundry

      - name: Install anvil-interop dependencies
        working-directory: l1-contracts/test/anvil-interop
        run: yarn install

      - name: Run the latest upgrade test
        working-directory: l1-contracts/test/anvil-interop
        env:
          ANVIL_BIN: ${{ runner.temp }}/anvil-pinned
        run: |
          yarn test:upgrade

      - name: Cleanup
        if: always()
        working-directory: l1-contracts/test/anvil-interop
        run: |
          bash cleanup.sh

  # upgrade-test with the L1 under Glamsterdam's gas rules (L1_GAS_RULES=amsterdam) and the separately
  # pinned anvil that implements them; what it asserts is in the anvil-interop README (Upgrade Tests).
  upgrade-test-glamsterdam:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          # Nested libraries affect solc remappings and the metadata the genesis image pins.
          submodules: recursive

      # The committed chain states need a state-compatible Anvil, while the
      # release bytecode is reproduced with the `build` Forge pin.
      - name: Install Anvil toolchain (state-compatible with committed states)
        uses: ./.github/actions/install-foundry

      - name: Preserve the pinned Anvil before switching to the build toolchain
        run: cp "$(command -v anvil)" "$RUNNER_TEMP/anvil-pinned"

      - name: Install foundry
        uses: ./.github/actions/install-foundry

      - name: Install the Amsterdam L1 anvil
        uses: ./.github/actions/install-amsterdam-anvil

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn

      - name: Warm solc build cache
        uses: ./.github/actions/warm-solc-cache

      - name: Build l1-contracts artifacts
        run: yarn l1 build:foundry

      - name: Install anvil-interop dependencies
        working-directory: l1-contracts/test/anvil-interop
        run: yarn install

      - name: Run the latest upgrade test under Glamsterdam gas rules
        working-directory: l1-contracts/test/anvil-interop
        env:
          ANVIL_BIN: ${{ runner.temp }}/anvil-pinned
          L1_GAS_RULES: amsterdam
        run: |
          yarn test:upgrade

      - name: Cleanup
        if: always()
        working-directory: l1-contracts/test/anvil-interop
        run: |
          bash cleanup.sh

  # The recurring registry-driven hop through the bound executors, over objects the harness deploys
  # itself on the current-genesis chain states (`stateVersion`).
  upgrade-recurring-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          # Nested libraries affect solc remappings and the metadata the genesis image pins.
          submodules: recursive

      - name: Setup anvil-interop environment
        uses: ./.github/actions/setup-anvil-interop
        with:
          artifacts: full

      - name: Run the recurring upgrade test
        working-directory: l1-contracts/test/anvil-interop
        run: |
          yarn test:upgrade-recurring

      - name: Cleanup
        if: always()
        working-directory: l1-contracts/test/anvil-interop
        run: |
          bash cleanup.sh

  # The state determinism gate (state-generation-check) lives in
  # pre-merge-checks.yaml (skipped on draft PRs).
