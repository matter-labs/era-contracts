name: Anvil Interop CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/workflows/anvil-interop-ci.yaml"
      - ".github/actions/install-zksync-foundry/**"
      - "l1-contracts/contracts/**"
      - "l1-contracts/deploy-scripts/**"
      - "l1-contracts/lib/**"
      - "l1-contracts/scripts/**"
      - "l1-contracts/test/**"
      - "l1-contracts/foundry.toml"
      - "l1-contracts/hardhat.config.ts"
      - "l1-contracts/package.json"
      - "l2-contracts/contracts/**"
      - "l2-contracts/lib/**"
      - "l2-contracts/src/**"
      - "l2-contracts/test/**"
      - "l2-contracts/foundry.toml"
      - "l2-contracts/hardhat.config.ts"
      - "l2-contracts/package.json"
      - "system-contracts/bootloader/**"
      - "system-contracts/contracts/**"
      - "system-contracts/lib/**"
      - "system-contracts/scripts/**"
      - "system-contracts/test/**"
      - "system-contracts/foundry.toml"
      - "system-contracts/hardhat.config.ts"
      - "system-contracts/package.json"
      - "da-contracts/contracts/**"
      - "da-contracts/lib/**"
      - "da-contracts/test/**"
      - "da-contracts/foundry.toml"
      - "da-contracts/hardhat.config.ts"
      - "da-contracts/package.json"
      - "package.json"
      - "yarn.lock"

jobs:
  # Fast job: uses pre-generated chain states from the repo.
  # We still compile DummyInteropRecipient so deploy bytecode is available in out/.
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn

      - name: Build anvil-interop dev artifacts
        run: yarn l1 build:anvil-interop-dev-artifacts

      - name: Install anvil-interop dependencies
        working-directory: l1-contracts/test/anvil-interop
        run: yarn install

      - name: TypeScript type check
        working-directory: l1-contracts/test/anvil-interop
        run: yarn tsc --noEmit

      # Pins which RPCs get the fast 100ms polling. Getting this wrong is invisible against Anvil
      # and only bites in live mode, where 100ms is ten requests per second per waiter.
      - name: Unit-test the provider polling interval
        working-directory: l1-contracts/test/anvil-interop
        run: yarn test:create-provider

      # Port offsets and shard paths only matter when runs coexist, which CI never does — so these
      # need pinning here rather than being exercised incidentally.
      - name: Unit-test the coverage shard paths
        working-directory: l1-contracts/test/anvil-interop
        run: yarn test:coverage-paths

      # Guards against a tracing regression passing as "covered nothing".
      - name: Unit-test the coverage trace guard
        working-directory: l1-contracts/test/anvil-interop
        run: yarn test:trace-guard

      # Matching each artifact to the build-info it was compiled under is what lets the artifact
      # cache stay warm without misattributing coverage, so it is pinned.
      - name: Unit-test the build-info selection
        working-directory: l1-contracts/test/anvil-interop
        run: yarn test:build-info

      - name: Run interop tests (preloaded state)
        working-directory: l1-contracts/test/anvil-interop
        env:
          # Each worker spawns 6 Anvil chains + a hardhat process; running all 10 spec groups at
          # once oversubscribes the 4-core runner and causes load-dependent RPC flakes (worker
          # failures mid-spec). Cap concurrency; locally the suite stays fully parallel.
          ANVIL_INTEROP_MAX_PARALLEL_WORKERS: "4"
        run: |
          echo "Running interop tests with preloaded chain states..."
          yarn ts-node run-hardhat-interop-test.ts

      - name: Cleanup
        if: always()
        working-directory: l1-contracts/test/anvil-interop
        run: |
          bash cleanup.sh

  # V31 → V32 upgrade test: loads v31 chain states, runs this release's ecosystem upgrade,
  # executes governance calls, and verifies protocol version is updated. Replaces the former
  # v29 → v31 and v30 → v31 jobs: this release initializes the contracts introduced in v31 on
  # the genesis path only, and its address discovery expects the v31 ABI, so a pre-v31
  # ecosystem can no longer be upgraded straight onto it.
  v31-to-v32-upgrade-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Foundry (for Anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install foundry-zksync (for forge --zksync)
        uses: ./.github/actions/install-zksync-foundry

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn

      # 431s of this job's 17.4m was a cold `forge build` of artifacts that l1-contracts-ci's
      # `build` job already produced for this very commit.
      #
      # This must go through the action rather than restoring the cache directly: the workflows
      # run independently, so on a first run the current-SHA entry does not exist yet and the
      # prefix key lands a *previous* commit's `out`. Without the action's pruning, artifacts for
      # sources this commit deleted survive, and copy-to-zkstack-out and the upgrade harness would
      # then consume stale ABIs — letting the upgrade test pass against a contract no longer built
      # from the current tree.
      - name: Warm solc build cache
        uses: ./.github/actions/warm-solc-cache

      - name: Build da-contracts artifacts
        run: yarn da build:foundry

      - name: Build system-contracts artifacts
        run: yarn sc build:foundry

      # `build:foundry` is `forge build` + a full zksolc pass + copy-to-zkstack-out, and the
      # zksolc half is dead weight here: the test variant of the upgrade script states it
      # outright — "Skip loading zkout bytecodes — they are already on L2 via anvil_setCode" —
      # and it skips factory-deps validation for the same reason. So run solc and refresh
      # zkstack-out (which protocol-ops reads, and which is generated from out/, not zkout),
      # and skip the zksolc pass. That is also the half the solc cache above cannot warm,
      # since zkout is excluded from it deliberately.
      - name: Build l1-contracts artifacts (solc only — zkout is unused here)
        working-directory: l1-contracts
        run: forge build && yarn copy-to-zkstack-out

      - name: Install anvil-interop dependencies
        working-directory: l1-contracts/test/anvil-interop
        run: yarn install

      - name: Run V31 to V32 upgrade test
        working-directory: l1-contracts/test/anvil-interop
        run: |
          echo "Running V31 -> V32 upgrade test..."
          yarn ts-node run-v31-to-v32-upgrade-test.ts

      - name: Cleanup
        if: always()
        working-directory: l1-contracts/test/anvil-interop
        run: |
          bash cleanup.sh

  # Mandatory determinism gate for the current protocol version's chain state:
  # rebuilds the state from scratch and verifies it matches the committed
  # snapshots. If a contract change alters genesis state, this fails —
  # regenerate via the 'Regenerate Anvil Interop Chain States' workflow and push.
  #
  # The compare tolerates block-number-derived drift: the harness runs Anvil with
  # interval mining (`--block-time 1`, required so the interop relayers/TBM keep
  # progressing), so the block count is wall-clock-dependent. compare-chain-states
  # ignores block.number and storage slots that just hold a block number (values
  # ≤ block height), plus the block-indexed MessageRoot storage. Everything else
  # (balances, roots, addresses, code, protocol version) must match exactly, so
  # this still catches real drift. To block merges, add "state-generation-check"
  # to the branch protection required checks.
  state-generation-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Foundry (no foundry-zksync — deterministic bytecode)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn

      - name: Build da-contracts artifacts (no CBOR metadata for determinism)
        run: FOUNDRY_PROFILE=anvil-interop yarn da build:foundry

      - name: Build l1-contracts artifacts (no CBOR metadata for determinism)
        working-directory: l1-contracts
        run: FOUNDRY_PROFILE=anvil-interop forge build

      - name: Install anvil-interop dependencies
        working-directory: l1-contracts/test/anvil-interop
        run: yarn install

      - name: Save committed chain states
        working-directory: l1-contracts/test/anvil-interop
        run: cp -r chain-states chain-states-committed

      - name: Generate chain state
        working-directory: l1-contracts/test/anvil-interop
        run: |
          echo "Generating chain state from scratch..."
          yarn ts-node setup-and-dump-state.ts

      - name: Verify committed state matches generated state
        working-directory: l1-contracts/test/anvil-interop
        run: |
          echo "Comparing generated state against committed chain-states..."
          if yarn ts-node compare-chain-states.ts chain-states-committed chain-states; then
            echo "Committed chain states are up to date"
          else
            echo ""
            echo "Committed chain-states differ from freshly generated state (beyond block-number drift)."
            echo "Run the 'Regenerate Anvil Interop Chain States' workflow from the Actions tab to update them."
            exit 1
          fi

      - name: Cleanup
        if: always()
        working-directory: l1-contracts/test/anvil-interop
        run: |
          bash cleanup.sh
