name: Anvil Interop CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/workflows/anvil-interop-ci.yaml"
      - ".github/actions/install-zksync-foundry/**"
      - "l1-contracts/contracts/**"
      - "l1-contracts/deploy-scripts/**"
      - "l1-contracts/lib/**"
      - "l1-contracts/scripts/**"
      - "l1-contracts/test/**"
      - "l1-contracts/foundry.toml"
      - "l1-contracts/hardhat.config.ts"
      - "l1-contracts/package.json"
      - "l2-contracts/contracts/**"
      - "l2-contracts/lib/**"
      - "l2-contracts/src/**"
      - "l2-contracts/test/**"
      - "l2-contracts/foundry.toml"
      - "l2-contracts/hardhat.config.ts"
      - "l2-contracts/package.json"
      - "system-contracts/bootloader/**"
      - "system-contracts/contracts/**"
      - "system-contracts/lib/**"
      - "system-contracts/scripts/**"
      - "system-contracts/test/**"
      - "system-contracts/foundry.toml"
      - "system-contracts/hardhat.config.ts"
      - "system-contracts/package.json"
      - "da-contracts/contracts/**"
      - "da-contracts/lib/**"
      - "da-contracts/test/**"
      - "da-contracts/foundry.toml"
      - "da-contracts/hardhat.config.ts"
      - "da-contracts/package.json"
      - "package.json"
      - "yarn.lock"

jobs:
  # Fast job: uses pre-generated chain states from the repo.
  # We still compile DummyInteropRecipient so deploy bytecode is available in out/.
  # If a contract change alters genesis state, regenerate the states via the
  # 'Regenerate Anvil Interop Chain States' workflow; the pre-merge
  # state-generation-check gates that the committed states are current.
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn

      - name: Build anvil-interop dev artifacts
        run: yarn l1 build:anvil-interop-dev-artifacts

      - name: Install anvil-interop dependencies
        working-directory: l1-contracts/test/anvil-interop
        run: yarn install

      - name: TypeScript type check
        working-directory: l1-contracts/test/anvil-interop
        run: yarn tsc --noEmit

      # Each suite covers something an ordinary run cannot fail on; see their headers.
      - name: Unit-test the interop harness
        working-directory: l1-contracts/test/anvil-interop
        run: yarn test:unit

      - name: Run interop tests (preloaded state)
        working-directory: l1-contracts/test/anvil-interop
        env:
          # Each worker spawns 6 Anvil chains + a hardhat process; running all 10 spec groups at
          # once oversubscribes the 4-core runner and causes load-dependent RPC flakes (worker
          # failures mid-spec). Cap concurrency; locally the suite stays fully parallel.
          ANVIL_INTEROP_MAX_PARALLEL_WORKERS: "4"
        run: |
          echo "Running interop tests with preloaded chain states..."
          yarn ts-node run-hardhat-interop-test.ts

      - name: Cleanup
        if: always()
        working-directory: l1-contracts/test/anvil-interop
        run: |
          bash cleanup.sh

  # V31 → V32 upgrade test: loads v31 chain states, runs this release's ecosystem upgrade,
  # executes governance calls, and verifies protocol version is updated. Replaces the former
  # v29 → v31 and v30 → v31 jobs: this release initializes the contracts introduced in v31 on
  # the genesis path only, and its address discovery expects the v31 ABI, so a pre-v31
  # ecosystem can no longer be upgraded straight onto it.
  v31-to-v32-upgrade-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Foundry (for Anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install foundry-zksync (for forge --zksync)
        uses: ./.github/actions/install-zksync-foundry

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn

      # Reuses the artifacts l1-contracts-ci built for this commit rather than compiling them again.
      # Via the action, not a bare cache restore: the prefix key can land a previous commit's `out`,
      # and without the pruning a deleted contract's stale ABI would reach the upgrade harness.
      - name: Warm solc build cache
        uses: ./.github/actions/warm-solc-cache

      - name: Build da-contracts artifacts
        run: yarn da build:foundry

      - name: Build system-contracts artifacts
        run: yarn sc build:foundry

      # No zksolc pass: the test variant of the upgrade script says it skips zkout bytecodes
      # ("already on L2 via anvil_setCode"). zkstack-out comes from out/, so solc alone suffices.
      - name: Build l1-contracts artifacts (solc only — zkout is unused here)
        working-directory: l1-contracts
        run: forge build && yarn copy-to-zkstack-out

      - name: Install anvil-interop dependencies
        working-directory: l1-contracts/test/anvil-interop
        run: yarn install

      - name: Run V31 to V32 upgrade test
        working-directory: l1-contracts/test/anvil-interop
        run: |
          echo "Running V31 -> V32 upgrade test..."
          yarn ts-node run-v31-to-v32-upgrade-test.ts

      - name: Cleanup
        if: always()
        working-directory: l1-contracts/test/anvil-interop
        run: |
          bash cleanup.sh

  # The state determinism gate (state-generation-check) lives in
  # pre-merge-checks.yaml (skipped on draft PRs).
