name: "Migrate from Gateway: Phase 1 - Wait Ready"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [stage, stage-interop-tests, sepolia, mainnet]
      protocol_ops_tag:
        description: "protocol-ops Docker image tag"
        required: true
        type: string
      chain_id:
        description: "Numeric chain ID to migrate back from gateway"
        required: true
        type: string
      chain_rpc_url:
        description: "Migrating chain server RPC URL"
        required: true
        type: string
      previous_settlement_change_block:
        description: "previous_settlement_change_block from phase 0 output metadata"
        required: true
        type: string
      timeout_secs:
        description: "Maximum seconds to wait for readiness"
        required: false
        type: string
        default: "300"
      poll_interval_secs:
        description: "Seconds between readiness polls"
        required: false
        type: string
        default: "2"

permissions:
  contents: read

jobs:
  wait-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run phase 1 (wait-ready)
        run: |
          bash protocol-ops.sh --tag "${{ inputs.protocol_ops_tag }}" \
            chain gateway migrate-from phase-1-wait-ready \
            --chain-id "${{ inputs.chain_id }}" \
            --chain-rpc-url "${{ inputs.chain_rpc_url }}" \
            --previous-settlement-change-block "${{ inputs.previous_settlement_change_block }}" \
            --timeout-secs "${{ inputs.timeout_secs }}" \
            --poll-interval-secs "${{ inputs.poll_interval_secs }}"
