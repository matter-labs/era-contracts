name: "Execute Deployer Safe Bundles"

# Apply Safe Transaction Builder bundles whose `target` is the ecosystem
# deployer EOA (e.g. the chain-init workflow's, when the deployer signs all of
# them; any other target is refused). The deployer's private key is pulled from
# the secret of the environment's L1 and used to sign every tx in the bundle via
# `protocol-ops dev execute-safe`. Ecosystem upgrade bundles go through
# `deploy-ecosystem-upgrade.yaml` instead.
#
# The workflow downloads bundles produced by a prior "generate" workflow
# run, so it's typically dispatched after a generate workflow has been
# reviewed off-chain.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment; its L1 selects the DEPLOYER_PRIVATE_KEY_{SEPOLIA,MAINNET} secret"
        required: true
        type: choice
        options: [stage, testnet, mainnet]
      protocol_ops_tag:
        description: "protocol-ops image released by build-docker.yaml: sha256:<digest>, or a tag"
        required: true
        type: string
      l1_rpc_url:
        description: "L1 RPC URL to broadcast against"
        required: true
        type: string
      source_run_id:
        description: "GitHub workflow run ID that produced the Safe-bundle artifact"
        required: true
        type: string
      artifact_name:
        description: "Name of the uploaded Safe-bundle artifact (e.g. safe-bundles-chain-init-270-testnet)"
        required: true
        type: string

permissions:
  contents: read
  actions: read # for downloading artifacts from another workflow run

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUNDLE_DIR: bundles
      # `dev execute-safe` reads the bundles inside the container.
      EXTRA_MOUNTS: ${{ github.workspace }}/bundles:/contracts/bundles
      PROTOCOL_OPS_REQUIRE_RELEASE: "1"
      PROTOCOL_OPS_TAG: ${{ inputs.protocol_ops_tag }}
      L1_RPC_URL: ${{ inputs.l1_rpc_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download Safe-bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ env.BUNDLE_DIR }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}

      - name: Select deployer private key + resolve its address
        id: deployer
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          KEY_SEPOLIA: ${{ secrets.DEPLOYER_PRIVATE_KEY_SEPOLIA }}
          KEY_MAINNET: ${{ secrets.DEPLOYER_PRIVATE_KEY_MAINNET }}
        run: |
          # Deployer secrets are per L1, as in deploy-ecosystem-upgrade.yaml.
          case "$ENVIRONMENT" in
            mainnet)       l1=1        secret=MAINNET key="$KEY_MAINNET" ;;
            stage|testnet) l1=11155111 secret=SEPOLIA key="$KEY_SEPOLIA" ;;
          esac
          rpc_chain=$(bash protocol-ops.sh --tag "$PROTOCOL_OPS_TAG" cast chain-id --rpc-url "$L1_RPC_URL")
          if [[ "$rpc_chain" != "$l1" ]]; then
            echo "error: l1_rpc_url is chain $rpc_chain, but $ENVIRONMENT is on L1 $l1" >&2
            exit 1
          fi
          if [[ -z "$key" ]]; then
            echo "error: DEPLOYER_PRIVATE_KEY_$secret secret is empty" >&2
            exit 1
          fi
          echo "::add-mask::$key"
          addr=$(bash protocol-ops.sh --tag "$PROTOCOL_OPS_TAG" cast wallet address --private-key "$key")
          {
            echo "addr=$addr"
            echo "secret=$secret"
          } >> "$GITHUB_OUTPUT"
          echo "Deployer (from DEPLOYER_PRIVATE_KEY_$secret): $addr"

      - name: Verify every bundle targets the deployer
        env:
          DEPLOYER_ADDR: ${{ steps.deployer.outputs.addr }}
        run: |
          # Sanity check: refuse to broadcast with the deployer key if any
          # bundle's `target` doesn't match the deployer EOA. Prevents
          # signing a governance- or chain-admin-targeted bundle with the
          # wrong signer and landing on a revert (or, worse, a silent
          # wrong-sender broadcast on a multisig setup).
          shopt -s nocasematch
          manifest="$BUNDLE_DIR/manifest.json"
          if [[ ! -f "$manifest" ]]; then
            echo "error: $manifest not found in artifact" >&2
            exit 1
          fi
          mismatches=0
          while read -r target file; do
            if [[ "$target" != "$DEPLOYER_ADDR" ]]; then
              echo "error: bundle $file has target $target, expected deployer $DEPLOYER_ADDR" >&2
              mismatches=$((mismatches + 1))
            fi
          done < <(jq -r '.bundles[] | "\(.target) \(.file)"' "$manifest")
          if [[ $mismatches -gt 0 ]]; then
            echo "refusing to execute $mismatches non-deployer bundle(s) with the deployer key" >&2
            exit 1
          fi
          echo "All bundles target the deployer EOA."

      - name: Execute bundles in manifest order
        env:
          SECRET: ${{ steps.deployer.outputs.secret }}
          KEY_SEPOLIA: ${{ secrets.DEPLOYER_PRIVATE_KEY_SEPOLIA }}
          KEY_MAINNET: ${{ secrets.DEPLOYER_PRIVATE_KEY_MAINNET }}
        run: |
          # The key selected above, read again rather than kept in $GITHUB_ENV.
          if [[ "$SECRET" == MAINNET ]]; then key="$KEY_MAINNET"; else key="$KEY_SEPOLIA"; fi
          # Iterate manifest.json in declared order. There is no receipt journal
          # (`--out`), so a rerun after a partial failure skips only CREATE2
          # deploys whose address already has code: check what mined first.
          manifest="$BUNDLE_DIR/manifest.json"
          jq -r '.bundles[].file' "$manifest" | while read -r file; do
            echo ">>> dev execute-safe $file"
            bash protocol-ops.sh --tag "$PROTOCOL_OPS_TAG" \
              dev execute-safe \
              --safe-file "/contracts/bundles/$file" \
              --l1-rpc-url "$L1_RPC_URL" \
              --private-key "$key"
          done
