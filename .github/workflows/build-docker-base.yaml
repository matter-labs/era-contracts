name: Build Docker Base Image

# Builds + pushes the `protocol-ops-base` image consumed by `build-docker.yaml`.
# Rebuilt only on Dockerfile.base / workflow changes, weekly cron, or manual
# dispatch — none of which fire per-PR — so the main image build can `FROM` it
# and skip ~10 min of toolchain installs each run.
on:
  push:
    branches: [main]
    paths:
      - 'docker/protocol/Dockerfile.base'
      - '.github/workflows/build-docker-base.yaml'
  workflow_dispatch:
    inputs:
      tag_override:
        description: "Optional override for the `:latest` tag (default: latest)."
        type: string
        required: false
  schedule:
    # Weekly Monday 06:00 UTC — picks up apt/Node/foundry CVE patches without
    # requiring the team to remember to rebuild manually.
    - cron: '0 6 * * 1'

jobs:
  build-base:
    name: Build protocol-ops base image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: protocol-ops-base

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        shell: bash
        run: |
          LATEST_TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag_override || 'latest' }}"
          SHA_TAG="$(git rev-parse --short HEAD)"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"

      - name: Build & Push Base Image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          file: docker/protocol/Dockerfile.base
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.latest_tag }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.sha_tag }}
