name: Verify merged commit (clean build)

# The per-PR workflows all trigger on `pull_request` and warm the solc cache, so nothing verified a
# merged commit from scratch: the last run for anything that lands was a PR run built on a cache.
# This closes that gap — one cache-disabled build per merge, plus the checks a stale or poisoned
# cache could subvert, because they are derived from the artifacts rather than from the sources.
#
# It also produces the only artifacts worth trusting for reuse: the cache it saves comes from a
# clean build on a verified base, so PRs targeting that base get a warm *and* trustworthy first
# run instead of a cold one.
#
# `build-release.yaml` also builds cleanly, but only for release tags and manual runs, which is why
# it does not cover ordinary merges.

on:
  # Every push is considered, and the `gate` job below decides. Branch protection alone would not
  # do: of the branches PRs actually merge into, main, atomic-imt-interop-release and draft-v31 are
  # protected, but atomic-imt-reduced — the busiest base — and draft-v32 are not. Protection alone
  # would skip the busiest base; a glob list alone goes stale as new bases appear. So: either.
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# One verification per branch is enough; a newer merge supersedes an in-flight run.
concurrency:
  group: verify-merged-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A few seconds on every push, so that verification follows the branches that matter without a
  # hand-maintained list going stale. Pushes to feature branches stop here.
  gate:
    runs-on: ubuntu-latest
    outputs:
      verify: ${{ steps.decide.outputs.verify }}
    steps:
      - name: Decide whether this ref is a long-lived base
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # These are long-lived bases that are merged into but are not protected today.
          case "$REF_NAME" in
            main | draft-* | atomic-imt-* | release-*) matches_base="true" ;;
            *) matches_base="false" ;;
          esac

          # `protected` covers anything the org protects now or later, without editing this file.
          #
          # A lookup failure must not read as "unprotected": that would silently skip verification
          # for a protected branch whose name is outside the patterns above — the one case the API
          # check exists to cover. Retry, then fail loudly rather than quietly skipping. A branch
          # already matching a pattern does not need the API at all, so a flaky lookup cannot block
          # a merge onto a known base.
          is_protected="false"
          if [ "$matches_base" = "false" ]; then
            for attempt in 1 2 3; do
              if is_protected=$(gh api "repos/$REPO/branches/$REF_NAME" --jq '.protected'); then
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "::error::Could not determine whether $REF_NAME is protected after 3 attempts." \
                  "Refusing to assume it is unprotected, which would skip clean verification."
                exit 1
              fi
              sleep 5
            done
          fi

          if [ "$is_protected" = "true" ] || [ "$matches_base" = "true" ]; then
            echo "Verifying $REF_NAME (protected=$is_protected, long-lived base=$matches_base)"
            echo "verify=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping $REF_NAME: not protected and not a long-lived base."
            echo "verify=false" >> "$GITHUB_OUTPUT"
          fi

  clean-build-and-check:
    needs: gate
    if: needs.gate.outputs.verify == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install foundry-zksync
        uses: ./.github/actions/install-zksync-foundry

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn

      # Explicitly disabled rather than simply omitted, so the intent is visible in the log and the
      # escape hatch has a real caller: this build restores nothing and prunes nothing.
      - name: Confirm the solc cache is disabled for this build
        uses: ./.github/actions/warm-solc-cache
        with:
          enabled: "false"

      # Removed before building so the check below also catches a deleted entry, not just a changed one.
      - name: Drop the committed zkstack-out
        working-directory: l1-contracts
        run: rm -rf zkstack-out

      - name: Build da contracts
        working-directory: da-contracts
        run: yarn build:foundry

      - name: Build l1 contracts
        working-directory: l1-contracts
        run: yarn build:foundry

      - name: Build l2 contracts
        working-directory: l2-contracts
        run: yarn build:foundry

      - name: Build system contracts
        working-directory: system-contracts
        run: |
          yarn install
          yarn build:foundry

      # The three checks whose answers come from the artifacts, so a cache could have shifted them.
      # Here they are answered by a build with no cache at all.
      - name: Check hashes
        run: yarn calculate-hashes:check

      - name: Check selectors
        run: yarn l1 selectors --check

      - name: Check zkstack-out
        working-directory: l1-contracts
        run: |
          if [ -n "$(git status --porcelain -- zkstack-out)" ]; then
            echo "::error::l1-contracts/zkstack-out does not match a clean build of this commit."
            git --no-pager status --porcelain -- zkstack-out
            git --no-pager diff -- zkstack-out || true
            exit 1
          fi

      # Only reached when the clean build agrees with everything committed, so these artifacts are
      # the trustworthy ones to hand to PRs branching from here.
      - name: Save the verified solc build cache
        uses: ./.github/actions/save-solc-cache
