name: Verify merged commit (clean build)

# The per-PR workflows all warm the solc cache, so nothing built a merged commit from scratch. This
# does: one cache-disabled build per merge, plus the checks a stale or poisoned cache could subvert
# (they are derived from artifacts, not sources). It is also the only writer of that cache, so what a
# PR restores comes from a clean build on a branch no PR can write to. build-release.yaml builds
# cleanly too, but only for release tags.

on:
  # Every push is considered, and the `gate` job below decides. Branch protection alone would not
  # do: of the branches PRs actually merge into, main, atomic-imt-interop-release and draft-v31 are
  # protected, but atomic-imt-reduced — the busiest base — and draft-v32 are not. Protection alone
  # would skip the busiest base; a glob list alone goes stale as new bases appear. So: either.
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# One verification per branch is enough; a newer merge supersedes an in-flight run.
concurrency:
  group: verify-merged-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A few seconds on every push, so that verification follows the branches that matter without a
  # hand-maintained list going stale. Pushes to feature branches stop here.
  gate:
    runs-on: ubuntu-latest
    outputs:
      verify: ${{ steps.decide.outputs.verify }}
    steps:
      - name: Decide whether this ref is a long-lived base
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # These are long-lived bases that are merged into but are not protected today.
          case "$REF_NAME" in
            main | draft-* | atomic-imt-* | release-*) matches_base="true" ;;
            *) matches_base="false" ;;
          esac

          # `protected` covers anything the org protects now or later, without editing this file.
          #
          # $REF_NAME is interpolated unencoded on purpose: this endpoint matches the {branch}
          # segment greedily, so slashes work. Verified against this very branch —
          # `gh api repos/matter-labs/era-contracts/branches/kl/ci-speedups` returns it, and the
          # gate job succeeded on that push. Encoding the slash as %2F would be likelier to break.
          #
          # A lookup failure must not read as "unprotected": that would silently skip verification
          # for a protected branch whose name is outside the patterns above — the one case the API
          # check exists to cover. Retry, then fail loudly rather than quietly skipping. A branch
          # already matching a pattern does not need the API at all, so a flaky lookup cannot block
          # a merge onto a known base.
          is_protected="false"
          if [ "$matches_base" = "false" ]; then
            for attempt in 1 2 3; do
              if is_protected=$(gh api "repos/$REPO/branches/$REF_NAME" --jq '.protected'); then
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "::error::Could not determine whether $REF_NAME is protected after 3 attempts." \
                  "Refusing to assume it is unprotected, which would skip clean verification."
                exit 1
              fi
              sleep 5
            done
          fi

          if [ "$is_protected" = "true" ] || [ "$matches_base" = "true" ]; then
            echo "Verifying $REF_NAME (protected=$is_protected, long-lived base=$matches_base)"
            echo "verify=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping $REF_NAME: not protected and not a long-lived base."
            echo "verify=false" >> "$GITHUB_OUTPUT"
          fi

  clean-build-and-check:
    needs: gate
    if: needs.gate.outputs.verify == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: ./.github/actions/install-foundry
        with:
          role: build

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn

      # No warm-solc-cache step on purpose: this build is the one that must not trust a cache.
      # It is also the only writer of one — see the save step after the builds.

      # Removed before building so the check below also catches a deleted entry, not just a changed one.
      - name: Drop the committed zkstack-out
        working-directory: l1-contracts
        run: rm -rf zkstack-out

      - name: Build da contracts
        working-directory: da-contracts
        run: yarn build:foundry

      - name: Build l1 contracts
        working-directory: l1-contracts
        run: yarn build:foundry

      # Saved here, before the checks and suites below, and deliberately so.
      #
      # What makes this cache trustworthy is that it came from a build with no cache at all, on a
      # branch a PR cannot write to — not that this commit's tests were green. A failing check-hashes
      # means the *committed* AllContractsHashes.json is stale, and a failing test means the code has
      # a bug; neither says the artifacts misrepresent the sources they were built from, and the
      # restore side revalidates per-source drift against the manifest anyway.
      #
      # Gating the save on the suites cost real time for no integrity gain: a base branch that is red
      # for a day would hand out no cache at all, so every PR targeting it built cold in four jobs.
      - name: Save the verified solc build cache
        uses: ./.github/actions/save-solc-cache

      # The three checks whose answers come from the artifacts, so a cache could have shifted them.
      # Here they are answered by a build with no cache at all.
      - name: Check hashes
        run: yarn calculate-hashes:check

      - name: Check selectors
        run: yarn l1 selectors --check

      - name: Check zkstack-out
        working-directory: l1-contracts
        run: |
          if [ -n "$(git status --porcelain -- zkstack-out)" ]; then
            echo "::error::l1-contracts/zkstack-out does not match a clean build of this commit."
            git --no-pager status --porcelain -- zkstack-out
            git --no-pager diff -- zkstack-out || true
            exit 1
          fi

      # The checks above only compare committed artifacts against a clean build. A stale artifact
      # could equally have made a *test* pass, and every PR run of these suites read a warm cache —
      # so they are re-run here against artifacts nothing was allowed to warm.
      #
      - name: Run l1 foundry tests
        working-directory: l1-contracts
        run: yarn test:foundry

      - name: Run da foundry tests
        working-directory: da-contracts
        run: yarn test:foundry

      # The committed chain states expect the `anvil` pin's trace schema, while the builds above use
      # the `build` pin for reproducible bytecode. Installed here rather than up top so it does not
      # shadow forge for those builds.
      - name: Install Anvil toolchain
        uses: ./.github/actions/install-foundry
        with:
          role: anvil

      - name: Build anvil-interop dev artifacts
        run: yarn l1 build:anvil-interop-dev-artifacts

      - name: Install anvil-interop dependencies
        working-directory: l1-contracts/test/anvil-interop
        run: yarn install

      - name: Run anvil interop tests
        working-directory: l1-contracts/test/anvil-interop
        env:
          # Each worker runs 6 Anvil chains plus a hardhat process; more than four oversubscribes the
          # runner and produces load-dependent RPC flakes.
          ANVIL_INTEROP_MAX_PARALLEL_WORKERS: "4"
        run: yarn ts-node run-hardhat-interop-test.ts

      - name: Cleanup Anvil
        if: always()
        working-directory: l1-contracts/test/anvil-interop
        run: bash cleanup.sh
