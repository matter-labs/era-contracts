name: Update Hashes in PR

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to update"
        required: true
  workflow_call:
    inputs:
      pr_number:
        description: "Pull Request number to update"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # We need full history to fetch PR branch
          submodules: recursive
          token: ${{ secrets.RELEASE_TOKEN }}
          # Without this, actions/checkout writes the token into .git/config as an http.extraheader
          # and it stays there while this job runs the target branch's own code — `yarn` lifecycle
          # scripts, four `build:foundry` invocations, prettier. Any of those could read it. The push
          # step below carries the token itself instead.
          persist-credentials: false

      - name: Get PR branch info
        id: pr
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number || inputs.pr_number }}
        with:
          script: |
            // Via env, not `${{ }}`: interpolation lands in the script text, so a dispatch input
            // like `1'),0);/*` would be arbitrary JS in a step that has the repo checked out.
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: parseInt(process.env.PR_NUMBER, 10),
            });
            core.setOutput("head_ref", pr.data.head.ref);
            core.setOutput("head_repo", pr.data.head.repo.full_name);

            // We only want to allow updating PRs from this repo, not from forks
            if (pr.data.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed(`PR head repo is ${pr.data.head.repo.full_name}, expected ${context.repo.owner}/${context.repo.repo}`);
            }

      - name: Checkout PR branch
        run: |
          git fetch origin "${{ steps.pr.outputs.head_ref }}"
          git checkout "${{ steps.pr.outputs.head_ref }}"

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install foundry-zksync
        uses: ./.github/actions/install-zksync-foundry

      - name: Install dependencies
        run: yarn

      - name: Run command
        run: |
          set -euo pipefail
          echo "Updating PR #${{ github.event.inputs.pr_number || inputs.pr_number }} on branch ${{ steps.pr.outputs.head_ref }}"
          # Recursive checkout already populated submodules at their (branch-identical) pins; a plain
          # `git submodule update` can fail on pins the submodule remote no longer advertises directly
          # (e.g. lib/@matterlabs/zksync-contracts), so keep it non-fatal.
          git submodule update --init --recursive || true

          yarn

          yarn --cwd da-contracts build:foundry
          yarn --cwd l1-contracts build:foundry
          yarn --cwd l2-contracts build:foundry
          yarn --cwd system-contracts build:foundry

          yarn calculate-hashes:fix

      - name: Commit and push changes
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "zksync[bot]"
          git config user.email "zksync[bot]@users.noreply.github.com"

          git add AllContractsHashes.json
          # Check if there are any changes to commit
          git diff --cached --quiet && { echo "No hash changes to commit"; exit 0; }
          # Push changes otherwise
          git commit -m "chore: Updated hashes from CI"
          # The only step that needs the token, so it is the only step that sees it.
          git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD
