name: Update Hashes in PR

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to update"
        required: true
  workflow_call:
    inputs:
      pr_number:
        description: "Pull Request number to update"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # we need full history to fetch PR branch
          persist-credentials: false # the commit below goes through the API with an App token

      - name: Get PR branch info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: parseInt(context.payload.inputs?.pr_number || '${{ inputs.pr_number }}', 10),
            });
            core.setOutput("head_ref", pr.data.head.ref);
            core.setOutput("head_repo", pr.data.head.repo.full_name);

      - name: Checkout PR branch
        run: |
          git fetch origin "${{ steps.pr.outputs.head_ref }}"
          git checkout "${{ steps.pr.outputs.head_ref }}"

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.18.0
          cache: yarn

      - name: Install foundry-zksync
        run: |
          mkdir ./foundry-zksync
          curl -LO https://github.com/matter-labs/foundry-zksync/releases/download/nightly-ae913af65381734ad46c044a9495b67310bc77c4/foundry_nightly_linux_amd64.tar.gz
          tar zxf foundry_nightly_linux_amd64.tar.gz -C ./foundry-zksync
          chmod +x ./foundry-zksync/forge ./foundry-zksync/cast
          echo "$PWD/foundry-zksync" >> $GITHUB_PATH

      - name: Install dependencies
        run: yarn

      - name: Run command
        run: |
          echo "Updating PR #${{ github.event.inputs.pr_number || inputs.pr_number }} on branch ${{ steps.pr.outputs.head_ref }}"
          git submodule update --init --recursive

          yarn

          yarn --cwd da-contracts build:foundry
          yarn --cwd l1-contracts build:foundry
          yarn --cwd l2-contracts build:foundry
          yarn --cwd system-contracts build:foundry

          yarn calculate-hashes:fix

      # The PR branch is checked out into the workspace above and local actions are read from the
      # working tree when their step runs, so take this action from the dispatched ref instead: a PR
      # branched before the action existed can then still be regenerated.
      - name: Fetch the signed-commit action from the dispatched ref
        uses: actions/checkout@v4
        with:
          path: .ci-actions
          sparse-checkout: .github/actions/signed-commit
          persist-credentials: false

      # Minted only after the PR's own build scripts have run, so no write-capable credential exists
      # while they execute. Scoped to this repository's contents, valid for an hour, revoked at job end.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MATTERLABS_BOTS_APP_ID }}
          private-key: ${{ secrets.MATTERLABS_BOTS_PRIVATE_KEY }}
          permission-contents: write

      # Committed through the GitHub API, so GitHub signs the commit (Verified) and the org's
      # required-signatures rule no longer blocks the PR. The App token, unlike GITHUB_TOKEN, also
      # triggers the PR's workflows on the new commit.
      - name: Commit and push changes (signed by GitHub)
        uses: ./.ci-actions/.github/actions/signed-commit
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ steps.pr.outputs.head_ref }}
          headline: "chore: Updated hashes from CI"
          paths: AllContractsHashes.json
