name: System contracts CI

env:
  ANVIL_ZKSYNC_VERSION: v0.7.0

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install foundry-zksync
        uses: ./.github/actions/install-zksync-foundry

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install Yarn
        run: npm install -g yarn

      - name: Build da-contracts artifacts
        run: yarn da build:foundry

      - name: Build artifacts
        working-directory: system-contracts
        run: |
          yarn install
          yarn build
          yarn build:foundry

      - name: Build artifacts
        working-directory: l1-contracts
        run: |
          yarn install
          yarn build:foundry

      - name: Create cache
        uses: actions/cache/save@v4
        with:
          key: artifacts-system-${{ github.sha }}
          path: |
            system-contracts/zkout
            system-contracts/cache-forge
            system-contracts/bootloader/build
            system-contracts/artifacts-zk
            system-contracts/cache-zk
            system-contracts/typechain
            system-contracts/contracts-preprocessed
            l1-contracts/zkout

  test-bootloader:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2024-08-01

      - name: Restore artifacts cache
        uses: actions/cache/restore@v3
        with:
          fail-on-cache-miss: true
          key: artifacts-system-${{ github.sha }}
          path: |
            system-contracts/zkout
            system-contracts/cache-forge
            system-contracts/bootloader/build
            system-contracts/artifacts-zk
            system-contracts/cache-zk
            system-contracts/typechain
            system-contracts/contracts-preprocessed
            l1-contracts/zkout

      - name: Run bootloader tests
        run: |
          cd system-contracts/bootloader/test_infra
          cargo run

  test-contracts:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn

      - name: Restore artifacts cache
        uses: actions/cache/restore@v4
        with:
          fail-on-cache-miss: true
          key: artifacts-system-${{ github.sha }}
          path: |
            system-contracts/zkout
            system-contracts/cache-forge
            system-contracts/bootloader/build
            system-contracts/artifacts-zk
            system-contracts/cache-zk
            system-contracts/typechain
            system-contracts/contracts-preprocessed

      - name: Generate GitHub App token
        id: anvil_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.MATTERLABS_BOTS_APP_ID }}
          private-key: ${{ secrets.MATTERLABS_BOTS_PRIVATE_KEY }}
          owner: matter-labs
          repositories: anvil-zksync-private

      - name: Install anvil-zksync
        env:
          GH_TOKEN: ${{ steps.anvil_token.outputs.token }}
        run: |
          set -o pipefail
          gh release download ${{ env.ANVIL_ZKSYNC_VERSION }} -R matter-labs/anvil-zksync-private \
            --pattern "anvil-zksync-${{ env.ANVIL_ZKSYNC_VERSION }}-x86_64-unknown-linux-gnu.tar.gz" -O - | tar -xz
          sudo mv anvil-zksync /usr/local/bin/anvil-zksync
          anvil-zksync --version

      # The node's built-in system contracts are used, but the EVM emulator is the one built
      # from this repo, so EvmEmulation.spec.ts exercises the emulator under review.
      - name: Run anvil-zksync
        run: |
          anvil-zksync --offline --protocol-version 29 --evm-interpreter \
            --evm-emulator-path system-contracts/zkout/EvmEmulator.yul/EvmEmulator.json \
            run > anvil_zksync.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8011 -X POST -H "Content-Type: application/json" \
                -d '{"jsonrpc":"2.0","method":"eth_chainId","id":1}'; then
              exit 0
            fi
            sleep 1
          done
          echo "anvil-zksync did not become ready"
          cat anvil_zksync.log
          exit 1

      - name: Run tests
        run: yarn sc test

      - name: Print output logs of anvil-zksync
        if: always()
        run: cat anvil_zksync.log

  test-contracts-foundry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn

      - name: Install foundry-zksync
        uses: ./.github/actions/install-zksync-foundry

      - name: Run tests using foundry
        run: yarn sc test:foundry
