name: Build Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, draft-v31]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build the docker image from. If empty, ref that triggered the workflow will be used."
        type: string
        required: false
      image_tag_override:
        description: "Optional override of the default image tag name"
        type: string
        required: false
      zk_governance_repo:
        description: "owner/repo of the zk-governance checkout (e.g. zksync-association/zk-governance, or a personal fork)."
        type: string
        required: false
        default: "kelemeno/zk-governance"
      zk_governance_ref:
        description: "zk-governance branch/tag/SHA baked into the image. PUH/Guardians redeploy uses this checkout."
        type: string
        required: false
        default: "kl/v31-puh-guardians-redeploy"

jobs:
  build-image:
    name: Build protocol ops Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: protocol-ops

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || github.sha }}
          submodules: recursive

      - name: Checkout zk-governance
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event_name == 'workflow_dispatch' && inputs.zk_governance_repo || 'kelemeno/zk-governance' }}
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.zk_governance_ref || 'kl/v31-puh-guardians-redeploy' }}
          submodules: recursive
          path: zk-governance

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Compute image tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag_override }}" ]; then
            IMAGE_TAG="${{ inputs.image_tag_override }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            IMAGE_TAG="protocol-ops-$(git rev-parse --short HEAD)"
          else
            IMAGE_TAG=$(git rev-parse --short HEAD)-$(date +%s)
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "Computed image tag: $IMAGE_TAG"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: ${{ github.event_name == 'workflow_dispatch' }}
          platforms: linux/amd64
          file: docker/protocol/Dockerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          # GitHub Actions buildx cache. `mode=max` caches every layer (not just
          # the final ones), so cargo-chef cooks and forge builds are reused
          # across runs whenever their inputs haven't changed. Cold first run is
          # the same speed as before; warm runs drop dramatically (~25 min →
          # ~5–10 min when only Rust source changes; ~3–5 min when only contracts
          # change).
          cache-from: type=gha
          cache-to: type=gha,mode=max
