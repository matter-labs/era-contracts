name: Build Docker Image

# Builds the protocol-ops image the calldata workflows run and rehearses an
# upgrade in it; a dispatch also releases it (.github/workflows/README.md#release-flow).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, draft-v31, "draft/**", "release/**"]
    # ready_for_review: the release flow below skips drafts.
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build the docker image from. If empty, ref that triggered the workflow will be used."
        type: string
        required: false
      image_tag_override:
        description: "Optional override of the default image tag name"
        type: string
        required: false
      tested_with_integration_tests:
        description: "This ref passed zksync-os-integration-tests (required: the image is not pushed otherwise)"
        type: boolean
        required: true
        default: false
      integration_tests_run_url:
        description: "The zksync-os-integration-tests run that tested this ref: https://github.com/matter-labs/zksync-os-integration-tests/actions/runs/<id>"
        type: string
        required: true

# Releases run one at a time, so checking that a tag is free and pushing it can't race
# (GitHub keeps one waiting run per group: a third dispatch replaces the waiting one).
concurrency:
  group: build-docker-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-image:
    name: Build protocol ops Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: protocol-ops

    steps:
      - name: Release gate
        if: github.event_name == 'workflow_dispatch'
        env:
          TESTED: ${{ inputs.tested_with_integration_tests }}
          RUN_URL: ${{ inputs.integration_tests_run_url }}
        run: |
          if [[ "$TESTED" != "true" ]]; then
            echo "::error::An image is released only for a ref that passed zksync-os-integration-tests: set tested_with_integration_tests."
            exit 1
          fi
          if [[ ! "$RUN_URL" =~ ^https://github\.com/matter-labs/zksync-os-integration-tests/actions/runs/[0-9]+(/(job|attempts)/[0-9]+)?$ ]]; then
            echo "::error::integration_tests_run_url must be a run of matter-labs/zksync-os-integration-tests, got '$RUN_URL'."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Compute image tag and provenance
        id: meta
        shell: bash
        env:
          IMAGE_TAG_OVERRIDE: ${{ inputs.image_tag_override }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$IMAGE_TAG_OVERRIDE" ]; then
            IMAGE_TAG="$IMAGE_TAG_OVERRIDE"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            IMAGE_TAG="protocol-ops-$(git rev-parse --short HEAD)"
          else
            IMAGE_TAG=$(git rev-parse --short HEAD)-$(date +%s)
          fi
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::'$IMAGE_TAG' is not a docker tag"; exit 1
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "Computed image tag: $IMAGE_TAG"
          {
            echo "revision=$(git rev-parse HEAD)"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # Loaded, not pushed: the steps below test this exact image, then push it.
      - name: Build Docker Image
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6.10.0
        with:
          source: .
          files: docker/protocol/docker-bake.hcl
          targets: protocol
          load: true
          provenance: false
          set: |
            base.cache-from=type=gha,scope=protocol-ops-base
            base.cache-to=type=gha,mode=max,scope=protocol-ops-base
            protocol.cache-from=type=gha,scope=protocol-ops
            protocol.cache-to=type=gha,mode=max,scope=protocol-ops
            protocol.tags=${{ env.IMAGE }}
            protocol.args.CONTRACTS_COMMIT=${{ steps.meta.outputs.revision }}
            protocol.labels.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            protocol.labels.org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            protocol.labels.org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            protocol.labels.org.opencontainers.image.version=${{ env.IMAGE_TAG }}
            protocol.labels.io.matter-labs.protocol-ops.tested-with=${{ inputs.integration_tests_run_url }}

      # verify-bootstrap holds the image's contract build against its AllContractsHashes.json.
      # Not on PRs, whose hashes are regenerated last (docker/protocol/Dockerfile).
      - name: Check the image's contract hashes
        if: github.event_name == 'workflow_dispatch'
        run: docker run --rm "$IMAGE" yarn calculate-hashes:check

      # The anvil-interop upgrade test (anvil-interop-ci.yaml's `upgrade-test`)
      # run entirely from the image: its protocol_ops, forge, anvil and
      # artifacts upgrade the previous release's ecosystem
      # (`upgradeSourceStateVersion` chain states) and its chains to this one.
      - name: Rehearse the upgrade in the image
        timeout-minutes: 40
        run: |
          docker run --rm --network=host \
            -e ANVIL_BIN=/usr/local/bin/anvil \
            -w /contracts/l1-contracts/test/anvil-interop \
            "$IMAGE" \
            bash -c 'yarn install --frozen-lockfile && yarn test:upgrade'

      # The ecosystem-upgrade workflows' commands, through protocol-ops.sh in this image. Not on
      # drafts: it verifies the build against AllContractsHashes.json, which a PR regenerates last
      # (docs/ai-review/docs/ci-green.md, "CI tiers").
      - name: Install Foundry (the release flow's L1)
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        uses: ./.github/actions/install-foundry

      - name: Run the release flow in the image
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        timeout-minutes: 30
        run: PROTOCOL_OPS_TAG="$IMAGE_TAG" bash .github/tests/release-flow.sh

      - name: Login to GitHub Container Registry
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        if: github.event_name == 'workflow_dispatch'
        run: |
          # A released tag is never moved: only a missing manifest means it is free.
          if out="$(docker manifest inspect "$IMAGE" 2>&1)" ||
            [[ "$out" != *"manifest unknown"* && "$out" != *"no such manifest"* ]]; then
            echo "::error::$IMAGE exists, or the registry didn't say it doesn't"; exit 1
          fi
          docker push "$IMAGE"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          echo "Pushed \`$IMAGE\` as \`$digest\`: pass \`protocol_ops_tag=${digest#*@}\` to the calldata workflows." >> "$GITHUB_STEP_SUMMARY"
