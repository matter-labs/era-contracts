name: Build Docker Image

# Builds `ghcr.io/matter-labs/protocol-ops`, the image every ecosystem and chain
# calldata workflow runs (release flow: .github/workflows/README.md). Pushes and
# PRs only build the image and rehearse an upgrade in it; a dispatch also pushes
# it, and only when it names the zksync-os-integration-tests run that tested the
# ref.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, draft-v31, "draft/**", "release/**"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build the docker image from. If empty, ref that triggered the workflow will be used."
        type: string
        required: false
      image_tag_override:
        description: "Optional override of the default image tag name"
        type: string
        required: false
      tested_with_integration_tests:
        description: "This ref passed zksync-os-integration-tests (required: the image is not pushed otherwise)"
        type: boolean
        required: true
        default: false
      integration_tests_run_url:
        description: "The zksync-os-integration-tests run that tested this ref: https://github.com/matter-labs/zksync-os-integration-tests/actions/runs/<id>"
        type: string
        required: true
      zk_governance_commit:
        description: "Full zksync-association/zk-governance commit SHA baked into the image (PUH/Guardians redeploy, PUVT). Default: the one protocol-ops pins."
        type: string
        required: false
        default: "9b06a16159cd58add109f25598e79731450d1772"

concurrency:
  group: build-docker-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Push and PR builds use the default.
  ZK_GOVERNANCE_COMMIT: ${{ inputs.zk_governance_commit || '9b06a16159cd58add109f25598e79731450d1772' }}

jobs:
  build-image:
    name: Build protocol ops Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: protocol-ops

    steps:
      - name: Release gate
        if: github.event_name == 'workflow_dispatch'
        env:
          TESTED: ${{ inputs.tested_with_integration_tests }}
          RUN_URL: ${{ inputs.integration_tests_run_url }}
        run: |
          if [[ "$TESTED" != "true" ]]; then
            echo "::error::An image is released only for a ref that passed zksync-os-integration-tests: set tested_with_integration_tests."
            exit 1
          fi
          if [[ ! "$RUN_URL" =~ ^https://github\.com/matter-labs/zksync-os-integration-tests/actions/runs/[0-9]+(/[^[:space:]]*)?$ ]]; then
            echo "::error::integration_tests_run_url must be a run of matter-labs/zksync-os-integration-tests, got '$RUN_URL'."
            exit 1
          fi

      - name: Validate the zk-governance commit
        run: |
          if [[ ! "$ZK_GOVERNANCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::zk_governance_commit must be a full commit SHA, got '$ZK_GOVERNANCE_COMMIT'."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout zk-governance
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: zksync-association/zk-governance
          ref: ${{ env.ZK_GOVERNANCE_COMMIT }}
          submodules: recursive
          path: zk-governance
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Compute image tag and provenance
        id: meta
        shell: bash
        env:
          RUN_URL: ${{ inputs.integration_tests_run_url }}
          IMAGE_TAG_OVERRIDE: ${{ inputs.image_tag_override }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$IMAGE_TAG_OVERRIDE" ]; then
            IMAGE_TAG="$IMAGE_TAG_OVERRIDE"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            IMAGE_TAG="protocol-ops-$(git rev-parse --short HEAD)"
          else
            IMAGE_TAG=$(git rev-parse --short HEAD)-$(date +%s)
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "Computed image tag: $IMAGE_TAG"
          # Read back by the calldata workflows: they check out the revision
          # the image was built from, and deploy checks it against the bundle.
          {
            echo "revision=$(git rev-parse HEAD)"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "hashes=$(sha256sum AllContractsHashes.json | cut -d' ' -f1)"
            echo "zk_governance=$(git -C zk-governance rev-parse HEAD)"
            echo "tested_with=${RUN_URL:-}"
          } >> "$GITHUB_OUTPUT"

      # Built into the runner's docker, not pushed: the rehearsal below runs
      # this exact image, and only then is it pushed. The toolchain base is
      # built from this commit's Dockerfile.base (docker-bake.hcl), not pulled.
      #
      # GitHub Actions buildx cache, one scope per image. `mode=max` caches
      # every layer (not just the final ones), so the base, cargo-chef cooks
      # and forge builds are reused across runs whenever their inputs haven't
      # changed (~25 min cold; ~5–10 min when only Rust source changes; ~3–5 min
      # when only contracts change).
      - name: Build Docker Image
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6.10.0
        with:
          source: .
          files: docker/protocol/docker-bake.hcl
          targets: protocol
          load: true
          provenance: false
          set: |
            base.cache-from=type=gha,scope=protocol-ops-base
            base.cache-to=type=gha,mode=max,scope=protocol-ops-base
            protocol.cache-from=type=gha,scope=protocol-ops
            protocol.cache-to=type=gha,mode=max,scope=protocol-ops
            protocol.tags=${{ env.IMAGE }}
            protocol.args.CONTRACTS_COMMIT=${{ steps.meta.outputs.revision }}
            protocol.args.ZK_GOVERNANCE_COMMIT=${{ steps.meta.outputs.zk_governance }}
            protocol.labels.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            protocol.labels.org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            protocol.labels.org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            protocol.labels.org.opencontainers.image.version=${{ env.IMAGE_TAG }}
            protocol.labels.io.matter-labs.protocol-ops.all-contracts-hashes-sha256=${{ steps.meta.outputs.hashes }}
            protocol.labels.io.matter-labs.protocol-ops.zk-governance-commit=${{ steps.meta.outputs.zk_governance }}
            protocol.labels.io.matter-labs.protocol-ops.tested-with=${{ steps.meta.outputs.tested_with }}

      # The anvil-interop upgrade test (anvil-interop-ci.yaml's `upgrade-test`)
      # run entirely from the image: its protocol_ops, forge, anvil and
      # artifacts upgrade the previous release's ecosystem
      # (`upgradeSourceStateVersion` chain states) and its chains to this one.
      - name: Rehearse the upgrade in the image
        timeout-minutes: 40
        run: |
          docker run --rm --network=host \
            -e ANVIL_BIN=/usr/local/bin/anvil \
            -w /contracts/l1-contracts/test/anvil-interop \
            "$IMAGE" \
            bash -c 'yarn install --frozen-lockfile && yarn ts-node run-upgrade-test.ts'

      - name: Login to GitHub Container Registry
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        if: github.event_name == 'workflow_dispatch'
        env:
          REVISION: ${{ steps.meta.outputs.revision }}
          TESTED_WITH: ${{ steps.meta.outputs.tested_with }}
        run: |
          docker push "$IMAGE"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          {
            echo "### protocol-ops image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| tag | \`$IMAGE\` |"
            echo "| digest | \`$digest\` |"
            echo "| revision | \`$REVISION\` |"
            echo "| tested with | $TESTED_WITH |"
            echo
            echo "Pass \`protocol_ops_tag=$IMAGE_TAG\` to the calldata workflows."
          } >> "$GITHUB_STEP_SUMMARY"
