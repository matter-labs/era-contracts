name: "Regen & Verify Upgrade Calldata (PUVT)"

# On-demand job that redeploys the v31 ecosystem upgrade calldata against a
# fresh anvil fork of the target L1 and double-checks it with PUVT
# (`protocol_ops ecosystem verify-upgrade`).
#
# It builds the contracts + `protocol_ops` FROM THE CHECKED-OUT BRANCH (not a
# Docker snapshot), so the run always reflects the current source. The actual
# work is delegated to the canonical local driver
# `l1-contracts/test/anvil-interop/regen-and-verify.sh <env>`, which the team
# already uses by hand — this workflow is just that script, wired up with the
# right toolchain, secrets, and a sibling `zk-governance` checkout.
#
# The job is GREEN iff:
#   - `upgrade-prepare-all` produces a fresh `ecosystem.toml`,
#   - the prepare bundles replay cleanly on the fork, and
#   - `verify-upgrade` (PUVT) passes.
# PUVT failure => the script exits non-zero => the job is RED. That is the
# "double check".
#
# Secret hygiene: the L1 RPC URL is read from a secret (or an optional masked
# input), `::add-mask::`'d so it never leaks into logs (incl. anvil's
# `--fork-url` echo), and passed to later steps via $GITHUB_ENV. It is never an
# output or an artifact. The fork rehearsal signs nothing (anvil impersonation
# via `--unlocked`), so NO deployer private key is required — only the canonical
# deployer EOA address.
#
# NOTE on dispatchability: `workflow_dispatch` registers only from the default
# branch. To trigger this from a feature branch, the file must first be merged
# into the repo's default branch (see PR notes).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to regenerate + verify"
        required: true
        type: choice
        default: testnet
        options:
          - testnet
          - stage
          - mainnet
      deployer_address:
        description: "Canonical deployer EOA (impersonated on the fork; no key needed)"
        required: true
        type: string
        default: "0x343Ee72DdD8CCD80cd43D6Adbc6c463a2DE433a7"
      zk_governance_commit:
        description: "zk-governance commit whose PUH/Guardians bytecode PUVT verifies"
        required: true
        type: string
        default: "3e516c5"
      l1_rpc_url:
        description: "Optional L1 RPC override (masked). Leave blank to use the L1_RPC_URL_<NET> secret."
        required: false
        type: string

permissions:
  contents: read

jobs:
  regen-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Exported for the WHOLE build + regen so every `forge`/`forge --zksync`
      # subprocess (incl. protocol_ops' on-the-fly `forge script` calls and the
      # zk-governance DeployPUHAndGuardians compile) inherits it. The
      # `anvil-interop` profile sets `bytecode_hash="none"` + `cbor_metadata=false`
      # so EVM CREATE2 addresses are metadata-free and reproduce the committed
      # artifact. Repos without that profile (system-contracts, l2-contracts,
      # zk-governance) just fall back to their default profile.
      FOUNDRY_PROFILE: anvil-interop
      # Pin protocol_ops' notion of the contracts root to the checkout so the
      # default `../../zk-governance` sibling path resolves deterministically.
      PROTOCOL_CONTRACTS_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout era-contracts
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Resolve & mask the L1 RPC URL
        env:
          INPUT_RPC: ${{ inputs.l1_rpc_url }}
          SECRET_RPC_TESTNET: ${{ secrets.L1_RPC_URL_SEPOLIA }}
          SECRET_RPC_STAGE: ${{ secrets.L1_RPC_URL_SEPOLIA }}
          SECRET_RPC_MAINNET: ${{ secrets.L1_RPC_URL_MAINNET }}
        run: |
          set -euo pipefail
          # testnet + stage are both on Sepolia L1.
          case "${{ inputs.environment }}" in
            testnet|stage) RPC="${SECRET_RPC_TESTNET}" ;;
            mainnet)       RPC="${SECRET_RPC_MAINNET}" ;;
          esac
          if [ -n "${INPUT_RPC}" ]; then
            RPC="${INPUT_RPC}"
          fi
          if [ -z "${RPC}" ]; then
            echo "::error::No L1 RPC URL available. Set the L1_RPC_URL_SEPOLIA / L1_RPC_URL_MAINNET secret, or pass the l1_rpc_url input." >&2
            exit 1
          fi
          # Mask before it can appear anywhere (anvil echoes --fork-url to its log).
          echo "::add-mask::${RPC}"
          # L1_FORK_URL is what regen-and-verify.sh reads. Passed via $GITHUB_ENV,
          # never as an output/artifact.
          echo "L1_FORK_URL=${RPC}" >> "$GITHUB_ENV"

      - name: Install Foundry (provides anvil + cast)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install foundry-zksync (provides forge --zksync)
        uses: ./.github/actions/install-zksync-foundry

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install Rust toolchain
        # rust-toolchain.toml in protocol-ops pins the channel; rustup installs it.
        run: |
          set -euo pipefail
          rustup show
        working-directory: protocol-ops

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: protocol-ops

      - name: Install JS dependencies
        run: yarn

      - name: Build da-contracts artifacts
        run: yarn da build:foundry

      - name: Build l1-contracts artifacts (EVM out/ metadata-free + zkout/)
        run: yarn l1 build:foundry

      - name: Build system-contracts artifacts (zkout/ — Bootloader.json for Era CTM prepare)
        run: yarn sc build:foundry

      - name: Build protocol_ops
        run: cargo build
        working-directory: protocol-ops

      - name: Checkout zk-governance (sibling at contracts_root/../../zk-governance)
        env:
          ZK_GOV_COMMIT: ${{ inputs.zk_governance_commit }}
        run: |
          set -euo pipefail
          # protocol_ops resolves the zk-governance checkout at
          # `contracts_root().join("../../zk-governance")`. With contracts_root
          # == $GITHUB_WORKSPACE, that is two levels up from the workspace.
          ZK_GOV_DEST="$(cd "$GITHUB_WORKSPACE/../.." && pwd)/zk-governance"
          echo "Cloning zk-governance into $ZK_GOV_DEST @ ${ZK_GOV_COMMIT}"
          rm -rf "$ZK_GOV_DEST"
          git clone "https://github.com/zksync-association/zk-governance.git" "$ZK_GOV_DEST"
          git -C "$ZK_GOV_DEST" checkout "${ZK_GOV_COMMIT}"
          git -C "$ZK_GOV_DEST" submodule update --init --recursive
          # Sanity: protocol_ops expects a foundry root here.
          test -f "$ZK_GOV_DEST/foundry.toml" || test -f "$ZK_GOV_DEST/l1-contracts/foundry.toml"

      - name: Regenerate calldata + verify (PUVT)
        env:
          # Fork-rehearsal-only: prepare takes --deployer-address and the
          # broadcast runs --unlocked (anvil impersonation), so nothing is
          # signed → no private key needed.
          DEPLOYER_ADDR: ${{ inputs.deployer_address }}
          ZK_GOVERNANCE_COMMIT: ${{ inputs.zk_governance_commit }}
          # Higher GitHub API rate limit for verify-upgrade's reference fetches.
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: l1-contracts/test/anvil-interop
        run: |
          set -euo pipefail
          ./regen-and-verify.sh "${{ inputs.environment }}"

      - name: Emit git-portable sim-inputs
        if: success()
        run: |
          set -euo pipefail
          OUT="l1-contracts/upgrade-envs/v0.31.0-interopB/output/${{ inputs.environment }}"
          ./protocol-ops/target/debug/protocol_ops ecosystem governance-toml-to-simulator \
            --env "${{ inputs.environment }}" \
            --emit-sim-inputs "$OUT/sim-inputs"

      - name: Show ecosystem.toml diff vs committed (informational)
        if: always()
        run: |
          OUT="l1-contracts/upgrade-envs/v0.31.0-interopB/output/${{ inputs.environment }}"
          echo "### Regenerated ecosystem.toml diff vs committed" >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- "$OUT/ecosystem.toml"; then
            echo "No drift — regenerated ecosystem.toml matches the committed artifact." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Regenerated ecosystem.toml DIFFERS from the committed artifact (see job logs / artifact):" >> "$GITHUB_STEP_SUMMARY"
            echo '```diff' >> "$GITHUB_STEP_SUMMARY"
            git --no-pager diff -- "$OUT/ecosystem.toml" | head -300 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload regenerated artifacts (NO anvil.log — it can echo the RPC)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-upgrade-calldata-${{ inputs.environment }}
          path: |
            l1-contracts/upgrade-envs/v0.31.0-interopB/output/${{ inputs.environment }}/ecosystem.toml
            l1-contracts/upgrade-envs/v0.31.0-interopB/output/${{ inputs.environment }}/sim-inputs/**
            l1-contracts/upgrade-envs/v0.31.0-interopB/output/${{ inputs.environment }}/extra-verification-logs.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup anvil (by port, never `pkill anvil`)
        if: always()
        run: |
          # testnet 29547, stage 29545, mainnet 29549
          for PORT in 29547 29545 29549; do
            PID="$(lsof -t -i :$PORT 2>/dev/null || true)"
            if [ -n "$PID" ]; then
              echo "Killing process on port $PORT (pid $PID)"
              kill "$PID" 2>/dev/null || true
            fi
          done
