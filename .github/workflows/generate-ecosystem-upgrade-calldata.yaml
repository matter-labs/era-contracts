name: "Ecosystem Upgrade Calldata: Regenerate + Verify"

# Generic over the `upgrade` input: `upgrade-envs/<upgrade>/upgrade.toml` says how that upgrade is
# prepared and checked (protocol-ops/src/common/upgrade_descriptor.rs). The notes below describe
# the default, v0.35.0-upgrade-system (`upgrade-prepare-all` + `verify-bootstrap`, the registry
# verifier; only the release's own upgrade directory can use `prepare-all`).

# ═════════════════════════════════════════════════════════════════════════════
# RUNBOOK — from "nothing" to "this chain is upgraded"
# ═════════════════════════════════════════════════════════════════════════════
#
# Terminology: the ECOSYSTEM upgrade (this workflow) deploys the new shared
# contracts and moves the CTM's protocol version. Each individual CHAIN is then
# upgraded separately (step 5) — a chain cannot move to the new version before
# its ecosystem has.
#
# ── 0. Once per branch: make the generated artifacts match reviewed hashes ───
# The prepare asserts that the factory deps it builds equal the hashes pinned in
# `configs/genesis/<flavor>/latest.json`, `AllContractsHashes.json`, and the env
# config. If committed generated files are stale, refresh them with:
#
#   gh workflow run update-generated-artifacts.yaml --ref <branch> -f pr_number=<PR#>
#
# It builds l1 on a clean runner, runs `calculate-hashes:fix`, refreshes the
# selectors, zkstack-out and the ZKsync OS genesis, regenerates the anvil-interop
# chain states, and pushes the result to the PR branch. Needs the
# `RELEASE_TOKEN` secret, and the PR's head must live in this repo (not a fork of
# it). `git pull --ff-only` afterwards.
#
# ── 1. Generate the ecosystem calldata (THIS workflow) ──────────────────────
# `protocol_ops_tag` is an image released per .github/workflows/README.md#release-flow.
#
#   gh workflow run generate-ecosystem-upgrade-calldata.yaml --ref <branch> \
#     -f protocol_ops_tag=<tag> \
#     -f environment=<env> \
#     -f deployer_address=0x…                 # MUST be the EOA that will broadcast
#     [-f fork_block=<n>]                     # see TROUBLESHOOTING
#
# `environment` is the basename of a config pair
# (`upgrade-envs/permanent-values/<env>.toml` + `upgrade-envs/<upgrade>/<env>.toml`);
# the L1 to fork is taken from that env's `l1_chain_id`. Nothing is signed and
# nothing touches real L1 — this runs entirely against an anvil fork.
#
# `deployer_address` is part of the OUTPUT, not just of the rehearsal: the prepare
# passes it as the initial owner of two proxies (`initialize(deployer)`) and to the
# verifier's constructor, so those three CREATE2 addresses are a function of it.
# Generate with the EOA that will actually broadcast — a placeholder produces a
# bundle whose `ecosystem.toml` addresses nobody can reproduce. The bundle records it
# as `deployer_address`, and the deploy workflow refuses to broadcast with a key for a
# different account.
#
# Two artifacts come out:
#
#   ecosystem-upgrade-calldata-<env>      the review set: ecosystem.toml (addresses
#                                         + the governance bundle's calldata),
#                                         sim-inputs/, transaction-simulator.json,
#                                         and EXECUTE.md: the txs whoever executes
#                                         sends by hand, one copy-into-MetaMask table
#                                         per sender, next to the list it is rendered
#                                         from (sim-inputs/ for prepare-all, the `[execution]`
#                                         script's output for a forge-script upgrade)
#   ecosystem-upgrade-deploy-inputs-<env> the DEPLOY BUNDLE (see below): the
#                                         deployer calls + provenance
#
# The `verify-bundle-handoff` job then re-deploys and re-verifies that bundle from
# scratch, from the artifact plus the image it names (the verifier re-derives
# addresses from the image's contract build). If it is green, the bundle is
# provably enough to deploy and verify from — that is the artifact to hand to
# whoever deploys.
#
# ── 2. Deploy the new contracts ─────────────────────────────────────────────
# In CI (signs with `DEPLOYER_PRIVATE_KEY_<net>`):
#
#   gh workflow run deploy-ecosystem-upgrade.yaml --ref <branch> \
#     -f environment=<env> -f generate_run_id=<step-1 run id>
#
# The L1 it signs against is read from the bundle's `l1.chain_id`, NOT inferred
# from the env name. The key's address must be the deployer the bundle was
# prepared for, or the job stops.
#
# Or locally from the downloaded bundle, in the image it records
# (`protocol_ops_image.digest` in `bundle-metadata.json`) — same code path:
#
#   EXTRA_MOUNTS="$PWD/<unpacked-bundle>:/contracts/bundle" \
#     ./protocol-ops.sh --tag sha256:<digest> ecosystem replay-bundle \
#     --bundle /contracts/bundle --rpc <l1-rpc> --key "$DEPLOYER_KEY"
#
# Broadcast ONLY the deployer's bundles; the governance-signed ones are the
# ceremony (step 4). Both paths are idempotent — re-run after a partial deploy.
# Do NOT re-generate to "refresh" a bundle: bytecode is specific to the build that
# produced it, so a re-run yields different addresses and different calldata.
#
# ── 3. Verify what landed (verify-bootstrap), yourself ─────────────────────
# From the bundle, in its image, from a checkout of the commit it names:
# `verify-bootstrap` re-derives every object from the image's contract build,
# held against its `AllContractsHashes.json`, and checks it on L1. The
# governance owner and CREATE2 salts it needs come from the env config:
#
#   EXTRA_MOUNTS="$PWD/<unpacked-bundle>:/contracts/bundle" \
#     ./protocol-ops.sh --tag sha256:<digest> ecosystem replay-bundle \
#     --bundle /contracts/bundle --rpc <l1-rpc> --verify-only    # already deployed
#   #  … or --fork-url <l1-rpc> to rehearse the whole thing on a throw-away fork
#   #  (a recurring upgrade also needs --executor-record <ecosystem/ctm init output>)
#
# ── 4. Execute the governance ceremony ────────────────────────────────────
# `ecosystem.toml`'s `[governance_calls] calls` is the one governance bundle;
# `transaction-simulator.json` is the ready-to-paste simulator input for a dry run
# before signing.
#
# ── 5. Upgrade an individual chain ────────────────────────────────────────
# Once the ecosystem is on the new version, per chain (`chain_id` is the numeric
# chain id; the target version is the one the ecosystem upgrade registered on the
# chain's CTM with `setNewVersionUpgrade`):
#
#   # a) the chain's upgrade calldata for its ChainAdmin
#   gh workflow run generate-chain-upgrade-calldata.yaml --ref <branch> \
#     -f environment=<env> -f protocol_ops_tag=<tag> \
#     -f l1_rpc_url=<l1-rpc> -f chain_id=<chain-id>
#
#   # b) when the chain schedules the switch itself
#   gh workflow run generate-chain-set-upgrade-timestamp-calldata.yaml --ref <branch> \
#     -f environment=<env> -f protocol_ops_tag=<tag> -f l1_rpc_url=<l1-rpc> \
#     -f chain_id=<chain-id> -f upgrade_timestamp=<unix>
#
# Both emit `safe-bundles-*` artifacts for the chain's admin multisig. Bundles
# targeting the ecosystem deployer EOA instead go through
# `execute-deployer-safe-bundles.yaml`. See `.github/workflows/README.md` for the
# full workflow → `protocol_ops` subcommand map.
#
# ── TROUBLESHOOTING ───────────────────────────────────────────────────────
# prepare reverts on owner-gated calls        → the ecosystem is already upgraded;
# `old protocol version must be ...`            pin `fork_block` and rotate the
#                                               env's salts. See ALREADY-UPGRADED
#                                               ECOSYSTEMS above — the usable
#                                               window is narrow and both
#                                               symptoms come from picking it
#                                               wrong.
# `No deploy bundle was published`            → the prepare died before the pack
#                                               step; fix the generate job first.
# deploy job: "bundle was prepared for X but    → the key in CI is not the EOA the
# this key is Y"                                  bundle was generated for. Those two
#                                                 must match: the deployer is in the
#                                                 init code of some deployments, so a
#                                                 different signer moves them.
#                                                 Re-generate with
#                                                 `-f deployer_address=Y`, or use X's
#                                                 key.
#
# Full prose version: `docs/ecosystem-upgrade-deploy.md`.
# ═════════════════════════════════════════════════════════════════════════════

# Regenerates the `upgrade` input's ecosystem calldata for one environment and
# verifies it (`verify-bootstrap` for prepare-all, the declared checks for a
# forge-script upgrade), inside the released protocol-ops image (`protocol_ops_tag`),
# so the bytecode — and therefore the CREATE2 addresses baked into
# `ecosystem.toml` — is the image's, whoever runs it.
#
# Flow (the canonical `protocol_ops ecosystem rehearse-upgrade` command):
#   anvil fork of the L1 RPC
#     -> protocol_ops ecosystem upgrade-prepare-all   (writes ecosystem.toml)
#     -> pack the deploy bundle                       (the transferable handoff)
#     -> fund + fork-replay the prepare bundles
#     -> protocol_ops ecosystem verify-bootstrap (the registry verifier)
#   then emit the git-portable `sim-inputs/` handoff set AND the ready-to-paste
#   `transaction-simulator.json` (the full mainnet calldata artifact set, i.e.
#   the same deliverables PR #2268 committed).
# Artifacts uploaded: `ecosystem.toml` + `sim-inputs/` + `transaction-simulator.json` +
# `EXECUTE.md` (written by the sim-inputs emit).
#
# ─── WHY THE DEPLOY BUNDLE IS THE POINT ───
# Solidity output is not byte-stable across build environments (the default
# foundry profile embeds path-dependent CBOR metadata), so the bytecode — and
# with it every CREATE2 address and all the governance calldata — belongs to the
# machine that compiled it. Nobody can "reproduce" this run elsewhere and get the
# same addresses. What they CAN do is broadcast the exact deployer calls this run
# computed: the `prepare/*.safe.json` transactions carry the CREATE2 init code
# verbatim.
# So this workflow publishes a self-contained DEPLOY BUNDLE
# (`ecosystem-upgrade-deploy-inputs-<env>`): the deployer calls, `ecosystem.toml`,
# the Etherscan verify commands, and a `bundle-metadata.json` pinning the image,
# contracts commit / `AllContractsHashes.json` hash / fork height / toolchain
# versions that the bytecode identity depends on. The `verify-bundle-handoff` job
# below then proves the bundle is sufficient by deploying + verifying it from
# that artifact and the image it names — the image's contract build is held
# against its `AllContractsHashes.json`, which the bundle pins, so it adds
# nothing the bundle does not already name.
#
# ─── ALREADY-UPGRADED ECOSYSTEMS: PICKING `fork_block` ───
# An ecosystem whose upgrade has already EXECUTED cannot be rehearsed at the
# chain tip: its CTMs now report the new version, so the calldata's
# old-protocol-version gate fails (v31 on testnet: "era CTM old protocol version
# must be v0.29.4, got v0.31.0"). Pin
# `fork_block` instead, and pick it from three constraints, not one:
#
#   1. AFTER every governance step the prepare treats as a prerequisite.
#      These are separate proposals, executed shortly before the upgrade itself,
#      that consolidate ownership under governance. Fork before them and the
#      prepare and its checks run against the pre-consolidation owners.
#   2. BEFORE the block that bumped the CTM protocol versions — that is the
#      upgrade execution itself, and past it constraint 1's gate flips.
#   3. Rotate the salts in `upgrade-envs/<upgrade>/<env>.toml` first (the
#      config comments say to do this every regen anyway), and release an image
#      with them (.github/workflows/README.md#release-flow). The previous regen's
#      CREATE2 addresses are already occupied at any post-deployment block, so a
#      re-prepare with the old salts can only run at a block before that
#      deployment — which violates constraint 1.
#
# Do NOT simply fork before the deployment. It satisfies constraint 2 and lets
# the old salts work, but it breaks constraint 1.
#
# Worked example — the v31 upgrade on Sepolia `testnet`:
#   deployment broadcast   blocks 11147277..11165542
#   ownership consolidated block 11171956  (via the ProtocolUpgradeHandler)
#   CTM versions bumped    block 11172145  (v0.29.4→v0.31.0, v0.30.1→v0.31.1)
#   => usable window       11171956..11172144;  the v31 regen used 11172144.
# Read these off the chain with `eth_call` on `protocolVersion()` / `owner()` at
# candidate heights (bisect between the deployment and the tip).
#
# ─── SECRET HYGIENE (the L1 RPC URL carries an API key) ───
# The RPC URL can come from EITHER a repo secret (default, fully hidden) OR an
# optional dispatch-time input (per-run, see the caveat below). Whichever is
# used, the workflow:
#   * registers it with `::add-mask::`, so GitHub redacts that exact string
#     everywhere in the LOGS — including subprocess output we don't control
#     (anvil's `--fork-url`, the prepare's "[SIMULATION] Forking <rpc>" line);
#   * passes it to the regen via $GITHUB_ENV (job-scoped), never
#     $GITHUB_OUTPUT, and never writes it into an uploaded artifact.
#
# ⚠️ CAVEAT on the `l1_rpc_url` INPUT: GitHub has no masked/secret
# workflow_dispatch input. A value typed into the "Run workflow" box is shown
# in the run-summary inputs panel and is retrievable via `gh run view` / the
# API — `::add-mask::` only redacts LOG text, not that UI panel. So the input
# override gives you per-run URLs with LOG redaction, but the typed value is
# visible to anyone with Actions read access. If the URL must never be exposed
# at all, leave the input blank and use the repo secret. Only the L1 RPC URL is
# sensitive here — the deployer is supplied as a plain ADDRESS (no key), so
# there is no private-key input or secret to leak.
#
# Required repository secrets:
#   L1_RPC_URL_SEPOLIA            — used by stage + testnet (both fork Sepolia)
#   L1_RPC_URL_MAINNET            — used by mainnet
#                                   (either may be omitted if you always pass
#                                    the `l1_rpc_url` input instead)
# Optional:
#   GW_RPC_URL                    — Gateway RPC, passed as `--gw-rpc-url`
#                                   when set (the release's checks read L1
#                                   only and ignore it).

on:
  workflow_dispatch:
    inputs:
      upgrade:
        description: "Upgrade to generate: a directory under l1-contracts/upgrade-envs/ with an upgrade.toml. v0.35.0-upgrade-system is the release's prepare-all + verify-bootstrap flow; a forge-script upgrade runs its declared script and checks."
        required: false
        default: "v0.35.0-upgrade-system"
        type: string
      protocol_ops_tag:
        description: "protocol-ops image released by build-docker.yaml: sha256:<digest>, or a tag"
        required: true
        type: string
      environment:
        description: "Environment = basename of the config pair upgrade-envs/permanent-values/<env>.toml + upgrade-envs/<upgrade>/<env>.toml. Today: stage, testnet, mainnet. The L1 to fork is chosen from that env's l1_chain_id (1 → mainnet, 11155111 → Sepolia)."
        required: true
        type: string
      l1_rpc_url:
        description: "L1 RPC URL (optional override; BLANK = use repo secret. NOTE: a typed value is visible in the run summary — not secret-grade)"
        required: false
        default: ""
        type: string
      fork_block:
        description: "L1 block to fork at (BLANK = chain tip). Pin to a block BEFORE the upgrade was deployed if the ecosystem is already live: re-running the prepare against post-deploy tip reverts because ownership has already been handed off from the deployer. CREATE2 addresses are deterministic, so the generated calldata is identical to a tip run."
        required: false
        default: ""
        type: string
      deployer_address:
        description: "Deployer EOA address (public). Only the address is needed — this is a fork rehearsal, the deployer is impersonated and nothing is signed. It is NOT a free parameter though: it goes into the init code of a few deployments (initialize(deployer) on two proxies, and the verifier's constructor), so their CREATE2 addresses depend on it and whoever broadcasts MUST be this same EOA. The bundle records which deployments those are."
        required: true
        type: string

permissions:
  contents: read

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UPGRADE: ${{ inputs.upgrade }}
      # Every protocol_ops / cast call below runs in this image (protocol-ops.sh
      # docker mode). Pulled once here, so a tag moved mid-run changes nothing.
      PROTOCOL_OPS_TAG: ${{ inputs.protocol_ops_tag }}

    steps:
      - name: Pull the protocol-ops image
        id: image
        run: |
          set -euo pipefail
          case "$PROTOCOL_OPS_TAG" in
            sha256:*) image="ghcr.io/matter-labs/protocol-ops@$PROTOCOL_OPS_TAG" ;;
            *) image="ghcr.io/matter-labs/protocol-ops:$PROTOCOL_OPS_TAG" ;;
          esac
          docker pull --quiet --platform=linux/amd64 "$image"
          revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::$image has no revision label: release it with build-docker.yaml"; exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      # So that protocol-ops.sh mounts its upgrade-envs/, where the outputs land.
      - name: Checkout the image's revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.image.outputs.revision }}
          persist-credentials: false

      # Pick the per-network L1 RPC (secret), mask it, and resolve the deployer
      # EOA address. stage + testnet fork Sepolia; mainnet forks mainnet.
      #
      # This is a fork rehearsal: the deployer is IMPERSONATED (anvil
      # --auto-impersonate) and nothing is signed, so only the deployer ADDRESS
      # is needed — never a private key: the `deployer_address` input.
      - name: Select L1 RPC + resolve deployer address
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          # Referenced as shell vars (not `${{ }}`-interpolated into the script
          # body) to avoid shell-injection and metacharacter issues.
          INPUT_RPC: ${{ inputs.l1_rpc_url }}
          INPUT_DEPLOYER: ${{ inputs.deployer_address }}
          RPC_SEPOLIA: ${{ secrets.L1_RPC_URL_SEPOLIA }}
          RPC_MAINNET: ${{ secrets.L1_RPC_URL_MAINNET }}
          GW_RPC_URL: ${{ secrets.GW_RPC_URL }}
        run: |
          set -euo pipefail
          # The env is just a config-pair basename; fail early and legibly if the
          # pair isn't committed, before spending a fork on it.
          # The upgrade is a directory name under upgrade-envs/; never a path.
          if ! printf '%s' "$UPGRADE" | grep -qE '^[A-Za-z0-9._-]+$' || [ "$UPGRADE" = "." ] || [ "$UPGRADE" = ".." ]; then
            echo "::error::invalid upgrade '$UPGRADE': expected a directory name under upgrade-envs/"; exit 1
          fi
          PV="l1-contracts/upgrade-envs/permanent-values/${ENVIRONMENT}.toml"
          UPGRADE_TOML="l1-contracts/upgrade-envs/${UPGRADE}/upgrade.toml"
          ENV_INPUT="l1-contracts/upgrade-envs/${UPGRADE}/${ENVIRONMENT}.toml"
          for f in "$PV" "$UPGRADE_TOML" "$ENV_INPUT"; do
            if [ ! -f "$f" ]; then
              echo "::error::No config for upgrade '$UPGRADE' / env '$ENVIRONMENT' at $f — commit it and release an image with it."; exit 1
            fi
          done
          # `prepare-all` also emits the simulator JSON below; other kinds do not.
          PREPARE_KIND="$(sed -nE 's/^[[:space:]]*prepare[[:space:]]*=[[:space:]]*"([a-z-]+)".*/\1/p' "$UPGRADE_TOML" | head -1)"
          echo "upgrade=$UPGRADE prepare=$PREPARE_KIND"
          echo "PREPARE_KIND=$PREPARE_KIND" >> "$GITHUB_ENV"
          # Which L1 to fork comes from the env itself, so a new ecosystem needs no
          # workflow edit. Capture the digits AFTER '=' so the '1' in the key name
          # can't match.
          L1_CHAIN_ID="$(sed -nE 's/^[[:space:]]*l1_chain_id[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$PV" | head -1)"
          if [ -z "$L1_CHAIN_ID" ]; then
            echo "::error::$PV has no top-level 'l1_chain_id ='"; exit 1
          fi
          case "$L1_CHAIN_ID" in
            1)        rpc="$RPC_MAINNET"; net=mainnet ;;
            11155111) rpc="$RPC_SEPOLIA"; net=sepolia ;;
            *) echo "::error::l1_chain_id=$L1_CHAIN_ID has no RPC secret wired (only 1 / 11155111)"; exit 1 ;;
          esac
          echo "env=$ENVIRONMENT l1_chain_id=$L1_CHAIN_ID -> forking $net"
          # Optional dispatch-time override wins over the secret (see the
          # CAVEAT in the header: the typed value is visible in the run summary).
          if [ -n "${INPUT_RPC:-}" ]; then
            rpc="$INPUT_RPC"
            echo "Using L1 RPC from the dispatch input (masked in logs; visible in run summary)."
          fi
          if [ -z "$rpc" ]; then
            echo "::error::No L1 RPC for $net: pass the l1_rpc_url input or set the matching L1_RPC_URL_* secret"
            exit 1
          fi
          echo "::add-mask::$rpc"
          if [[ ! "$INPUT_DEPLOYER" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
            echo "::error::deployer_address must be an address, got '$INPUT_DEPLOYER'"; exit 1
          fi
          deployer="$INPUT_DEPLOYER"
          echo "Deployer (impersonated on the fork): $deployer"
          # Job-scoped. L1_FORK_URL stays masked; DEPLOYER_ADDR is public. Both are
          # passed to `rehearse-upgrade` as flags below; the deployer is impersonated on
          # the fork (no signing key required).
          {
            echo "L1_FORK_URL=$rpc"
            echo "DEPLOYER_ADDR=$deployer"
          } >> "$GITHUB_ENV"
          if [ -n "${GW_RPC_URL:-}" ]; then
            echo "::add-mask::$GW_RPC_URL"
            echo "GW_RPC_URL=$GW_RPC_URL" >> "$GITHUB_ENV"
          fi

      - name: Regenerate + verify calldata
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          # Optional fork-block pin (blank = tip).
          FORK_BLOCK: ${{ inputs.fork_block }}
        run: |
          set -euo pipefail
          # L1_FORK_URL (masked), DEPLOYER_ADDR and GW_RPC_URL come from $GITHUB_ENV.
          # The command forks L1_FORK_URL into a local anvil and runs the prepare and
          # its checks against localhost, so only anvil sees the real RPC; the deployer is
          # impersonated (no signing key needed).
          args=(--upgrade "$UPGRADE" --env "$ENVIRONMENT" --fork-url "$L1_FORK_URL" --deployer-address "$DEPLOYER_ADDR")
          [ -z "${GW_RPC_URL:-}" ] || args+=(--gw-rpc-url "$GW_RPC_URL")
          [ -z "$FORK_BLOCK" ] || args+=(--fork-block "$FORK_BLOCK")
          bash protocol-ops.sh --tag "$PROTOCOL_OPS_TAG" ecosystem rehearse-upgrade "${args[@]}"

      # Produce the same calldata artifact set PR #2268 committed for mainnet:
      # the git-portable `sim-inputs/` handoff set AND the ready-to-paste
      # `transaction-simulator.json`. Two `governance-toml-to-simulator` calls,
      # matching the documented mainnet flow.
      - name: Emit sim-inputs + transaction-simulator.json
        if: ${{ env.PREPARE_KIND == 'prepare-all' }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          OUT="l1-contracts/upgrade-envs/$UPGRADE/output/$ENVIRONMENT"
          # Relative paths resolve the same inside the image (its workdir is
          # the contracts root, with upgrade-envs mounted from this checkout).
          po() { bash protocol-ops.sh --tag "$PROTOCOL_OPS_TAG" "$@"; }
          # $DEPLOYER_ADDR (resolved earlier) is the Camp-A signer. Its bundles
          # are dropped from the sim-inputs: they're broadcast to the real chain,
          # so the simulator's fork inherits their effects from chain tip and
          # replaying them would revert.
          # 1) Normalized manifest + Camp-B `*.safe.json` sim-input bundles, and
          #    `$OUT/EXECUTE.md`, the runbook of those bundles.
          po ecosystem governance-toml-to-simulator \
            --env "$ENVIRONMENT" \
            --include-manifest "$OUT/prepare/manifest.json" \
            --camp-a-signers "$DEPLOYER_ADDR" \
            --emit-sim-inputs "$OUT/sim-inputs"
          # 2) The full transaction-simulator.json (Camp-B manifest bundles + the
          #    governance bundle + post-upgrade smoke tests).
          #    --include-manifest defaults to sim-inputs/manifest.json (step 1).
          po ecosystem governance-toml-to-simulator \
            --env "$ENVIRONMENT" \
            --out "$OUT/transaction-simulator.json"

      # Upload only the calldata deliverables; the verification logs travel in the
      # deploy bundle below.
      - name: Upload calldata artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-upgrade-calldata-${{ inputs.environment }}
          path: |
            l1-contracts/upgrade-envs/${{ inputs.upgrade }}/output/${{ inputs.environment }}/ecosystem.toml
            l1-contracts/upgrade-envs/${{ inputs.upgrade }}/output/${{ inputs.environment }}/sim-inputs/
            l1-contracts/upgrade-envs/${{ inputs.upgrade }}/output/${{ inputs.environment }}/transaction-simulator.json
            l1-contracts/upgrade-envs/${{ inputs.upgrade }}/output/${{ inputs.environment }}/EXECUTE.md
            l1-contracts/upgrade-envs/${{ inputs.upgrade }}/output/${{ inputs.environment }}/emergency-upgrade-board.json
          if-no-files-found: warn
          retention-days: 30

      # The DEPLOY BUNDLE: everything needed to broadcast this run's contracts and
      # re-verify them, and nothing else. Packed by `rehearse-upgrade` during
      # the regen (right after the prepare, so it exists even if the checks fail):
      #
      #   prepare/manifest.json + prepare/*.safe.json  the deployer calls to send
      #   ecosystem.toml                               addresses + governance calls
      #   extra-verification-logs.txt                  Etherscan verify commands
      #   bundle-metadata.json                         provenance (commit, hashes,
      #                                                fork block, toolchain)
      #
      # Consumed by `deploy-ecosystem-upgrade.yaml` (real broadcast) and by the
      # `verify-bundle-handoff` job below (fork rehearsal + verify-bootstrap). Safe to publish:
      # tx calldata + addresses only, never keys or the RPC URL.
      - name: Upload the deploy bundle (for the Deploy workflow + local replay)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-upgrade-deploy-inputs-${{ inputs.environment }}
          path: l1-contracts/upgrade-envs/${{ inputs.upgrade }}/output/${{ inputs.environment }}/deploy-bundle/
          if-no-files-found: warn
          # 90 days, matching the deploy workflow's result artifact: this is the
          # operational record of which bytecode was deployed, and it cannot be
          # regenerated (a later build produces different bytecode). Archive it
          # elsewhere if it must outlive the retention window.
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────────
  # Proof that the published deploy bundle is SUFFICIENT on its own.
  #
  # This job has only the artifact and the image the bundle names (by digest,
  # from `bundle-metadata.json`) — exactly what an operator downloading the
  # bundle has. The image carries the contract build `verify-bootstrap`
  # re-derives every object from; `verify-bootstrap` holds that build against
  # the image's `AllContractsHashes.json`, and `replay-bundle` holds that file
  # against the bundle's pinned hash, so the image cannot substitute different
  # contracts. It forks L1 at the height recorded in the bundle, replays every
  # bundle under impersonation, and runs `verify-bootstrap` against the result.
  #
  # If this job is green, "deploy the contracts and verify them yourself"
  # provably works from the artifact and the image it names. If the bundle were missing anything
  # (a call, an address, the fork height, the bytecode identity), it fails here
  # instead of failing on somebody's laptop.
  # ─────────────────────────────────────────────────────────────────────────────
  verify-bundle-handoff:
    needs: regen
    # Runs whenever the bundle exists — the regen job packs it before its own
    # replay/verify steps, so a verify failure upstream still lets us check the
    # handoff itself.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Tolerated so the next step can explain WHY there is no bundle: the pack
      # runs right after the prepare, so a prepare that never finished leaves
      # nothing to hand off (and the upload step, being `always()` +
      # `if-no-files-found: warn`, still "succeeds" having uploaded nothing).
      # Outside the workspace: the checkout below would clean it.
      - name: Download the deploy bundle
        id: download-bundle
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ecosystem-upgrade-deploy-inputs-${{ inputs.environment }}
          path: ${{ runner.temp }}/deploy-bundle

      - name: Require a bundle to hand off
        id: bundle
        run: |
          set -euo pipefail
          meta="$RUNNER_TEMP/deploy-bundle/bundle-metadata.json"
          if [ ! -f "$meta" ]; then
            echo '::error::No deploy bundle was published, so there is nothing to verify. The bundle is packed straight after `upgrade-prepare-all`, so the generate job failed at or before the prepare — fix that first.'
            exit 1
          fi
          image="$(jq -er '.protocol_ops_image.digest // "" | capture("^ghcr\\.io/matter-labs/protocol-ops@(?<d>sha256:[0-9a-f]{64})$").d // error("the bundle names no protocol-ops image")' "$meta")"
          commit="$(jq -er '.contracts_commit | select(test("^[0-9a-f]{40}$")) // error("the bundle names no commit")' "$meta")"
          {
            echo "image=$image"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

      # protocol-ops.sh, and its upgrade-envs/ for the replay's outputs.
      - name: Checkout the bundle's commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.bundle.outputs.commit }}
          persist-credentials: false

      - name: Show the bundle's provenance
        run: |
          set -euo pipefail
          echo "=== bundle-metadata.json"
          cat "$RUNNER_TEMP/deploy-bundle/bundle-metadata.json"
          echo "=== files"
          find "$RUNNER_TEMP/deploy-bundle" -type f | sed "s|$RUNNER_TEMP/||" | sort

      - name: Select + mask the L1 RPC to fork (and the GW RPC, if set)
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          INPUT_RPC: ${{ inputs.l1_rpc_url }}
          RPC_SEPOLIA: ${{ secrets.L1_RPC_URL_SEPOLIA }}
          RPC_MAINNET: ${{ secrets.L1_RPC_URL_MAINNET }}
          GW_RPC_URL: ${{ secrets.GW_RPC_URL }}
        run: |
          set -euo pipefail
          # Which L1 the bundle belongs to is recorded IN the bundle — one more
          # thing a consumer doesn't have to be told out of band.
          L1_CHAIN_ID="$(jq -r '.l1.chain_id // empty' "$RUNNER_TEMP/deploy-bundle/bundle-metadata.json")"
          case "$L1_CHAIN_ID" in
            1)        rpc="$RPC_MAINNET" ;;
            11155111) rpc="$RPC_SEPOLIA" ;;
            *) echo "::error::bundle l1.chain_id=$L1_CHAIN_ID has no RPC secret wired"; exit 1 ;;
          esac
          echo "bundle l1_chain_id=$L1_CHAIN_ID"
          if [ -n "${INPUT_RPC:-}" ]; then rpc="$INPUT_RPC"; fi
          if [ -z "$rpc" ]; then
            echo "::error::No L1 RPC to fork (see the regen job's requirements)"; exit 1
          fi
          echo "::add-mask::$rpc"
          echo "L1_FORK_URL=$rpc" >> "$GITHUB_ENV"
          # Passed through as `--gw-rpc-url`, as for the regen (see GW_RPC_URL
          # in the header).
          if [ -n "${GW_RPC_URL:-}" ]; then
            echo "::add-mask::$GW_RPC_URL"
            echo "GW_RPC_URL=$GW_RPC_URL" >> "$GITHUB_ENV"
          fi

      # The same command an operator runs locally against a downloaded bundle.
      - name: Replay the bundle on a fresh fork + verify-bootstrap
        env:
          BUNDLE_IMAGE: ${{ steps.bundle.outputs.image }}
          # Mounted at the same path in the image.
          EXTRA_MOUNTS: ${{ runner.temp }}/deploy-bundle:${{ runner.temp }}/deploy-bundle:ro
        run: |
          set -euo pipefail
          # The fork anvil runs inside the container, so nothing outlives it.
          args=(--bundle "$RUNNER_TEMP/deploy-bundle" --fork-url "$L1_FORK_URL")
          [ -z "${GW_RPC_URL:-}" ] || args+=(--gw-rpc-url "$GW_RPC_URL")
          bash protocol-ops.sh --tag "$BUNDLE_IMAGE" ecosystem replay-bundle "${args[@]}"
