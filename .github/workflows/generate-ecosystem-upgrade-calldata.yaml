name: "Ecosystem Upgrade Calldata: Regenerate + Verify (v31)"

# Regenerates the v31 ecosystem upgrade calldata for one environment and
# verifies it with PUVT, on a Linux runner so the compiled bytecode — and
# therefore the CREATE2 addresses baked into `ecosystem.toml` — is
# bit-identical with CI (the whole reason this can't be trusted from a dev's
# macOS checkout).
#
# It builds the CONTRACTS AND protocol_ops FROM THE CHECKED-OUT BRANCH (not a
# pre-built Docker image), so the regenerated calldata reflects the current
# source — including any contract changes merged in since the last image was
# published.
#
# Flow (the canonical `l1-contracts/test/anvil-interop/regen-and-verify.sh`):
#   anvil fork of the L1 RPC
#     -> protocol_ops ecosystem upgrade-prepare-all   (writes ecosystem.toml)
#     -> fund + fork-replay the prepare bundles
#     -> protocol_ops ecosystem verify-upgrade (PUVT)
#   then emit the git-portable `sim-inputs/` handoff set.
# Artifacts uploaded: `ecosystem.toml` + `sim-inputs/`. NOT `anvil.log` — it
# can contain the forked RPC URL.
#
# ─── SECRET HYGIENE (the L1 RPC URL carries an API key) ───
# The RPC URL can come from EITHER a repo secret (default, fully hidden) OR an
# optional dispatch-time input (per-run, see the caveat below). Whichever is
# used, the workflow:
#   * registers it with `::add-mask::`, so GitHub redacts that exact string
#     everywhere in the LOGS — including subprocess output we don't control
#     (anvil's `--fork-url`, the prepare's "[SIMULATION] Forking <rpc>" line);
#   * passes it to the regen via $GITHUB_ENV (job-scoped), never
#     $GITHUB_OUTPUT, and never writes it into an uploaded artifact.
#
# ⚠️ CAVEAT on the `l1_rpc_url` INPUT: GitHub has no masked/secret
# workflow_dispatch input. A value typed into the "Run workflow" box is shown
# in the run-summary inputs panel and is retrievable via `gh run view` / the
# API — `::add-mask::` only redacts LOG text, not that UI panel. So the input
# override gives you per-run URLs with LOG redaction, but the typed value is
# visible to anyone with Actions read access. If the URL must never be exposed
# at all, leave the input blank and use the repo secret. The deployer private
# key is deliberately secret-only (never a dispatch input).
#
# Required repository secrets:
#   L1_RPC_URL_SEPOLIA            — used by stage + testnet (both fork Sepolia)
#   L1_RPC_URL_MAINNET            — used by mainnet
#                                   (either may be omitted if you always pass
#                                    the `l1_rpc_url` input instead)
#   DEPLOYER_PRIVATE_KEY_SEPOLIA  — deployer EOA key for stage + testnet
#   DEPLOYER_PRIVATE_KEY_MAINNET  — deployer EOA key for mainnet
# Optional:
#   GW_RPC_URL                    — Gateway RPC for PUVT GW-side checks
#                                   (only exercised on gateway-enabled envs;
#                                    defaults to the script's built-in).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - stage
          - testnet
          - mainnet
      l1_rpc_url:
        description: "L1 RPC URL (optional override; BLANK = use repo secret. NOTE: a typed value is visible in the run summary — not secret-grade)"
        required: false
        default: ""
        type: string
      zksync_foundry_version:
        description: "foundry-zksync version (forge --zksync)"
        required: false
        default: "v0.1.5"
        type: string
      push_artifacts:
        description: "On a PUVT-green run, commit the regenerated artifacts (ecosystem.toml + sim-inputs/) and push them to the branch this run was dispatched on (refreshing its PR). Requires the RELEASE_TOKEN secret."
        required: false
        default: false
        type: boolean
      deploy:
        description: "Also broadcast the deployer-EOA bundle to the real L1 (uses DEPLOYER_PRIVATE_KEY_<net>)"
        required: false
        default: false
        type: boolean
      use_new_salt:
        description: "Use a fresh random CREATE2/gov deployment salt for this run (new addresses)"
        required: false
        default: false
        type: boolean

# Read-only GITHUB_TOKEN. The optional `push_artifacts` step does NOT rely on
# write permissions here — it pushes via the scoped `RELEASE_TOKEN` secret,
# mirroring update-generated-artifacts.yaml / update-hashes-on-demand.yaml.
permissions:
  contents: read
  pull-requests: read

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Foundry (for Anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install foundry-zksync (for forge --zksync)
        uses: ./.github/actions/install-zksync-foundry
        with:
          version: ${{ inputs.zksync_foundry_version }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1

      - name: Install dependencies
        run: yarn

      # `yarn l1 build:foundry` builds both EVM (out/) and EraVM (zkout/)
      # artifacts; da + sc artifacts are referenced by the prepare/PUVT.
      - name: Build da-contracts artifacts
        run: yarn da build:foundry
      - name: Build system-contracts artifacts
        run: yarn sc build:foundry
      - name: Build l1-contracts artifacts (EVM + zkout)
        run: yarn l1 build:foundry

      - name: Build protocol_ops
        working-directory: protocol-ops
        run: cargo build --release

      - name: Install anvil-interop dependencies
        working-directory: l1-contracts/test/anvil-interop
        run: yarn install

      # Pick the per-network secrets, mask them, and stash them in the
      # job-scoped environment. stage + testnet fork Sepolia; mainnet forks
      # mainnet.
      - name: Select + mask RPC and deployer-key secrets
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          # Referenced as shell vars (not `${{ }}`-interpolated into the script
          # body) to avoid shell-injection and metacharacter issues.
          INPUT_RPC: ${{ inputs.l1_rpc_url }}
          RPC_SEPOLIA: ${{ secrets.L1_RPC_URL_SEPOLIA }}
          RPC_MAINNET: ${{ secrets.L1_RPC_URL_MAINNET }}
          PK_SEPOLIA: ${{ secrets.DEPLOYER_PRIVATE_KEY_SEPOLIA }}
          PK_MAINNET: ${{ secrets.DEPLOYER_PRIVATE_KEY_MAINNET }}
          GW_RPC_URL: ${{ secrets.GW_RPC_URL }}
        run: |
          set -euo pipefail
          if [ "$ENVIRONMENT" = "mainnet" ]; then
            rpc="$RPC_MAINNET"; pk="$PK_MAINNET"
          else
            rpc="$RPC_SEPOLIA"; pk="$PK_SEPOLIA"
          fi
          # Optional dispatch-time override wins over the secret (see the
          # CAVEAT in the header: the typed value is visible in the run summary).
          if [ -n "${INPUT_RPC:-}" ]; then
            rpc="$INPUT_RPC"
            echo "Using L1 RPC from the dispatch input (masked in logs; visible in run summary)."
          fi
          if [ -z "$rpc" ]; then
            echo "::error::No L1 RPC: pass the l1_rpc_url input or set L1_RPC_URL_SEPOLIA / L1_RPC_URL_MAINNET"
            exit 1
          fi
          if [ -z "$pk" ]; then
            echo "::error::Missing deployer-key secret for '${{ inputs.environment }}' (set DEPLOYER_PRIVATE_KEY_SEPOLIA / DEPLOYER_PRIVATE_KEY_MAINNET)"
            exit 1
          fi
          # Redact both everywhere in the logs, including subprocess echoes.
          echo "::add-mask::$rpc"
          echo "::add-mask::$pk"
          # Job-scoped; not echoed back, never an output or artifact.
          {
            echo "L1_FORK_URL=$rpc"
            echo "DEPLOYER_PK=$pk"
          } >> "$GITHUB_ENV"
          if [ -n "${GW_RPC_URL:-}" ]; then
            echo "::add-mask::$GW_RPC_URL"
            echo "GW_RPC_URL=$GW_RPC_URL" >> "$GITHUB_ENV"
          fi

      # Optional: rotate every deployment salt in the v31 input TOML to fresh
      # random values so this run deploys to brand-new CREATE2 addresses (useful
      # when the current salt's addresses are already occupied on-chain). Runs
      # BEFORE prepare so the new salts flow into the generated calldata. The
      # rotated salts land in the input TOML, so an open_pr run records them.
      - name: Use new random deployment salt
        if: ${{ inputs.use_new_salt }}
        run: |
          set -euo pipefail
          TOML="l1-contracts/upgrade-envs/v0.31.0-interopB/${{ inputs.environment }}.toml"
          newsalt() { echo "0x$(openssl rand -hex 32)"; }
          # Top-level scalar salts (one fresh value each).
          sed -i -E "s|^(create2_factory_salt[[:space:]]*=[[:space:]]*)\"0x[0-9a-fA-F]+\"|\1\"$(newsalt)\"|" "$TOML"
          sed -i -E "s|^(legacy_gov_salt[[:space:]]*=[[:space:]]*)\"0x[0-9a-fA-F]+\"|\1\"$(newsalt)\"|" "$TOML"
          # Per-CTM salts under [create2_factory_salts] — each must stay DISTINCT,
          # so give every entry its own fresh random value.
          # NB: each line is `"0x<ctm-addr>" = "0x<salt>"` — only rotate the
          # VALUE after `=`, never the key (the CTM proxy address prepare keys on).
          awk '
            /^\[create2_factory_salts\]/ { intbl=1; print; next }
            /^\[/ && !/^\[create2_factory_salts\]/ { intbl=0 }
            intbl && /=[[:space:]]*"0x[0-9a-fA-F]+"/ {
              cmd="openssl rand -hex 32"; cmd | getline r; close(cmd);
              sub(/=[[:space:]]*"0x[0-9a-fA-F]+"/, "= \"0x" r "\"");
            }
            { print }
          ' "$TOML" > "$TOML.tmp" && mv "$TOML.tmp" "$TOML"
          echo "Rotated deployment salts in $TOML:"
          grep -nE '^(create2_factory_salt|legacy_gov_salt)[[:space:]]*=' "$TOML"
          sed -n '/^\[create2_factory_salts\]/,/^\[/p' "$TOML" | grep -E '= "0x'

      - name: Regenerate + verify calldata
        working-directory: l1-contracts/test/anvil-interop
        run: |
          # L1_FORK_URL + DEPLOYER_PK come from $GITHUB_ENV (masked). The script
          # forks L1_FORK_URL into a local anvil and runs prepare/PUVT against
          # localhost, so only anvil sees the real RPC.
          ./regen-and-verify.sh "${{ inputs.environment }}"

      # Optional: broadcast the deployer-EOA bundle to the REAL L1. Ungated —
      # just the `deploy` checkbox. Runs even if PUVT reported errors
      # (`!cancelled()`), since prepare's bundles already exist; broadcasting
      # only the deployer-EOA bundle (governance/multisig bundles are never sent
      # here). `dev execute-safe` is idempotent (skips already-deployed CREATE2).
      - name: Deploy deployer bundle to real L1
        if: ${{ !cancelled() && inputs.deploy }}
        run: |
          set -euo pipefail
          ENV="${{ inputs.environment }}"
          OUT="l1-contracts/upgrade-envs/v0.31.0-interopB/output/$ENV"
          MANIFEST="$OUT/prepare/manifest.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::No prepare manifest at $MANIFEST — prepare did not run; nothing to deploy." >&2
            exit 1
          fi
          # DEPLOYER_PK + L1_FORK_URL (the real RPC) come from $GITHUB_ENV (masked).
          DEPLOYER="$(cast wallet address --private-key "$DEPLOYER_PK")"
          DEPLOYER_LC="$(echo "$DEPLOYER" | tr '[:upper:]' '[:lower:]')"
          mapfile -t FILES < <(jq -r --arg d "$DEPLOYER_LC" \
            '.bundles | sort_by(.index)[] | select((.target|ascii_downcase) == $d) | .file' "$MANIFEST")
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No deployer bundle for $DEPLOYER in $MANIFEST" >&2
            exit 1
          fi
          OUT_DIR="$OUT/real-broadcast"; mkdir -p "$OUT_DIR"
          EXECUTED="$OUT_DIR/executed.json"
          for f in "${FILES[@]}"; do
            echo "=== execute-safe: $f -> real $ENV ==="
            ./protocol-ops/target/release/protocol_ops dev execute-safe \
              --safe-file "$OUT/prepare/$f" \
              --l1-rpc-url "$L1_FORK_URL" \
              --private-key "$DEPLOYER_PK" \
              --out "$EXECUTED"
          done
          echo "Broadcast complete. Receipts in $EXECUTED"

      - name: Emit git-portable sim-inputs handoff set
        run: |
          set -euo pipefail
          OUT="l1-contracts/upgrade-envs/v0.31.0-interopB/output/${{ inputs.environment }}"
          ./protocol-ops/target/release/protocol_ops ecosystem governance-toml-to-simulator \
            --env "${{ inputs.environment }}" \
            --emit-sim-inputs "$OUT/sim-inputs"

      # Optional: open a PR with the regenerated artifacts so the
      # simulator-compatible sim-inputs/ are reviewable in a diff (not just a
      # downloadable artifact). Only runs on a PUVT-green run (success()).
      # Optional: commit the regenerated artifacts and push them back to the
      # branch this run was dispatched on (refreshing its open PR), so the
      # simulator-compatible sim-inputs/ are reviewable in the diff. Mirrors
      # update-generated-artifacts.yaml: the workflow's GITHUB_TOKEN stays
      # read-only, and the push is authenticated with the scoped RELEASE_TOKEN
      # secret (not workflow write permissions). Only runs on a PUVT-green run.
      - name: Commit + push regenerated artifacts
        if: ${{ success() && inputs.push_artifacts }}
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TOKEN:-}" ]; then
            echo "::error::push_artifacts is set but the RELEASE_TOKEN secret is missing." >&2
            exit 1
          fi
          ENV="${{ inputs.environment }}"
          OUT="l1-contracts/upgrade-envs/v0.31.0-interopB/output/$ENV"
          BRANCH="${{ github.ref_name }}"

          git config user.name "zksync[bot]"
          git config user.email "zksync[bot]@users.noreply.github.com"

          # Stage the whole output/<env>/ tree WITHOUT -f so .gitignore is
          # honoured: anvil.log (can echo the RPC), prepare/*.safe.json,
          # prepare/manifest.json and fork-rehearsal/ stay out, while the full
          # committed artifact set (ecosystem.toml, *-verification-logs.txt,
          # sim-inputs/*, preserved transactions.txt) is captured.
          git add "$OUT"
          if git diff --cached --quiet; then
            echo "No artifact changes on $BRANCH — calldata already up to date; nothing to push."
            exit 0
          fi
          git commit \
            -m "ci(regen): refresh $ENV upgrade calldata (PUVT-green)" \
            -m "Regenerated by generate-ecosystem-upgrade-calldata (run ${{ github.run_id }}); ecosystem verify-upgrade (PUVT) passed against a fresh anvil fork."
          # Push via RELEASE_TOKEN (scoped), not the read-only workflow token.
          git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:${BRANCH}"
          echo "Pushed refreshed artifacts to ${BRANCH}."

      # Upload only the calldata deliverables. Deliberately NOT anvil.log /
      # *-verification-logs.txt — anvil.log can echo the forked RPC URL.
      - name: Upload calldata artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-upgrade-calldata-${{ inputs.environment }}
          path: |
            l1-contracts/upgrade-envs/v0.31.0-interopB/output/${{ inputs.environment }}/ecosystem.toml
            l1-contracts/upgrade-envs/v0.31.0-interopB/output/${{ inputs.environment }}/sim-inputs/
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup anvil
        if: always()
        working-directory: l1-contracts/test/anvil-interop
        run: bash cleanup.sh
