name: "Ecosystem Upgrade Calldata: Regenerate + Verify (v31)"

# Regenerates the v31 ecosystem upgrade calldata for one environment and
# verifies it with PUVT, on a Linux runner so the compiled bytecode — and
# therefore the CREATE2 addresses baked into `ecosystem.toml` — is
# bit-identical with CI (the whole reason this can't be trusted from a dev's
# macOS checkout).
#
# It builds the CONTRACTS AND protocol_ops FROM THE CHECKED-OUT BRANCH (not a
# pre-built Docker image), so the regenerated calldata reflects the current
# source — including any contract changes merged in since the last image was
# published.
#
# Flow (the canonical `l1-contracts/test/anvil-interop/regen-and-verify.sh`):
#   anvil fork of the L1 RPC
#     -> protocol_ops ecosystem upgrade-prepare-all   (writes ecosystem.toml)
#     -> fund + fork-replay the prepare bundles
#     -> protocol_ops ecosystem verify-upgrade (PUVT)
#   then emit the git-portable `sim-inputs/` handoff set AND the ready-to-paste
#   `transaction-simulator.json` (the full mainnet calldata artifact set, i.e.
#   the same deliverables PR #2268 committed).
# Artifacts uploaded: `ecosystem.toml` + `sim-inputs/` + `transaction-simulator.json`.
# NOT `anvil.log` — it can contain the forked RPC URL.
#
# ─── ALREADY-DEPLOYED ECOSYSTEMS ───
# Re-running the prepare against the chain tip of an ecosystem whose v31 upgrade
# is ALREADY deployed reverts: the deployer no longer owns the ecosystem
# contracts (ownership was handed to governance / the TransitionaryOwner at
# deploy time), so the prepare's owner-gated setup calls fail. Pin `fork_block`
# to a block BEFORE that deployment — the prepare then deploys fresh contracts
# it owns, and because every address is CREATE2-deterministic the generated
# calldata is byte-identical to what a tip run would produce.
#
# ─── SECRET HYGIENE (the L1 RPC URL carries an API key) ───
# The RPC URL can come from EITHER a repo secret (default, fully hidden) OR an
# optional dispatch-time input (per-run, see the caveat below). Whichever is
# used, the workflow:
#   * registers it with `::add-mask::`, so GitHub redacts that exact string
#     everywhere in the LOGS — including subprocess output we don't control
#     (anvil's `--fork-url`, the prepare's "[SIMULATION] Forking <rpc>" line);
#   * passes it to the regen via $GITHUB_ENV (job-scoped), never
#     $GITHUB_OUTPUT, and never writes it into an uploaded artifact.
#
# ⚠️ CAVEAT on the `l1_rpc_url` INPUT: GitHub has no masked/secret
# workflow_dispatch input. A value typed into the "Run workflow" box is shown
# in the run-summary inputs panel and is retrievable via `gh run view` / the
# API — `::add-mask::` only redacts LOG text, not that UI panel. So the input
# override gives you per-run URLs with LOG redaction, but the typed value is
# visible to anyone with Actions read access. If the URL must never be exposed
# at all, leave the input blank and use the repo secret. Only the L1 RPC URL is
# sensitive here — the deployer is supplied as a plain ADDRESS (no key), so
# there is no private-key input or secret to leak.
#
# Required repository secrets:
#   L1_RPC_URL_SEPOLIA            — used by stage + testnet (both fork Sepolia)
#   L1_RPC_URL_MAINNET            — used by mainnet
#                                   (either may be omitted if you always pass
#                                    the `l1_rpc_url` input instead)
# Optional:
#   DEPLOYER_PRIVATE_KEY_SEPOLIA  — deployer EOA key for stage + testnet
#   DEPLOYER_PRIVATE_KEY_MAINNET  — deployer EOA key for mainnet
#                                   (ONLY used to derive the deployer address;
#                                    prefer the `deployer_address` input so no
#                                    key is needed — this is a fork rehearsal
#                                    that impersonates the deployer and signs
#                                    nothing)
#   GW_RPC_URL                    — Gateway RPC for PUVT GW-side checks
#                                   (only exercised on gateway-enabled envs;
#                                    defaults to the script's built-in).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - stage
          - testnet
          - mainnet
      l1_rpc_url:
        description: "L1 RPC URL (optional override; BLANK = use repo secret. NOTE: a typed value is visible in the run summary — not secret-grade)"
        required: false
        default: ""
        type: string
      zksync_foundry_version:
        description: "foundry-zksync version (forge --zksync)"
        required: false
        default: "v0.1.5"
        type: string
      zk_governance_commit:
        description: "zk-governance commit for PUVT bytecode metadata (PUH/Guardians/SecurityCouncil/EmergencyUpgradeBoard). Mainnet v31 = 9b06a16."
        required: false
        default: "9b06a16"
        type: string
      fork_block:
        description: "L1 block to fork at (BLANK = chain tip). Pin to a block BEFORE the upgrade was deployed if the ecosystem is already live: re-running the prepare against post-deploy tip reverts because ownership has already been handed off from the deployer. CREATE2 addresses are deterministic, so the generated calldata is identical to a tip run."
        required: false
        default: ""
        type: string
      deployer_address:
        description: "Deployer EOA address (public). This is a fork rehearsal — the deployer is impersonated, nothing is signed — so only the address is needed, not a key. BLANK = derive it from the DEPLOYER_PRIVATE_KEY_* secret."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Foundry (for Anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install foundry-zksync (for forge --zksync)
        uses: ./.github/actions/install-zksync-foundry
        with:
          version: ${{ inputs.zksync_foundry_version }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1

      - name: Install dependencies
        run: yarn

      # `yarn l1 build:foundry` builds both EVM (out/) and EraVM (zkout/)
      # artifacts; da + sc artifacts are referenced by the prepare/PUVT.
      - name: Build da-contracts artifacts
        run: yarn da build:foundry
      - name: Build system-contracts artifacts
        run: yarn sc build:foundry
      - name: Build l1-contracts artifacts (EVM + zkout)
        run: yarn l1 build:foundry

      - name: Build protocol_ops
        working-directory: protocol-ops
        run: cargo build --release

      - name: Install anvil-interop dependencies
        working-directory: l1-contracts/test/anvil-interop
        run: yarn install

      # Pick the per-network L1 RPC (secret), mask it, and resolve the deployer
      # EOA address. stage + testnet fork Sepolia; mainnet forks mainnet.
      #
      # This is a fork rehearsal: the deployer is IMPERSONATED (anvil
      # --auto-impersonate) and nothing is signed, so only the deployer ADDRESS
      # is needed — never a private key. Provide it via the `deployer_address`
      # input (recommended, esp. for mainnet: no real key ever touches CI), or
      # let it be derived from the optional DEPLOYER_PRIVATE_KEY_* secret.
      - name: Select L1 RPC + resolve deployer address
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          # Referenced as shell vars (not `${{ }}`-interpolated into the script
          # body) to avoid shell-injection and metacharacter issues.
          INPUT_RPC: ${{ inputs.l1_rpc_url }}
          INPUT_DEPLOYER: ${{ inputs.deployer_address }}
          RPC_SEPOLIA: ${{ secrets.L1_RPC_URL_SEPOLIA }}
          RPC_MAINNET: ${{ secrets.L1_RPC_URL_MAINNET }}
          PK_SEPOLIA: ${{ secrets.DEPLOYER_PRIVATE_KEY_SEPOLIA }}
          PK_MAINNET: ${{ secrets.DEPLOYER_PRIVATE_KEY_MAINNET }}
          GW_RPC_URL: ${{ secrets.GW_RPC_URL }}
        run: |
          set -euo pipefail
          if [ "$ENVIRONMENT" = "mainnet" ]; then
            rpc="$RPC_MAINNET"; pk="$PK_MAINNET"
          else
            rpc="$RPC_SEPOLIA"; pk="$PK_SEPOLIA"
          fi
          # Optional dispatch-time override wins over the secret (see the
          # CAVEAT in the header: the typed value is visible in the run summary).
          if [ -n "${INPUT_RPC:-}" ]; then
            rpc="$INPUT_RPC"
            echo "Using L1 RPC from the dispatch input (masked in logs; visible in run summary)."
          fi
          if [ -z "$rpc" ]; then
            echo "::error::No L1 RPC: pass the l1_rpc_url input or set L1_RPC_URL_SEPOLIA / L1_RPC_URL_MAINNET"
            exit 1
          fi
          echo "::add-mask::$rpc"
          # Resolve the deployer address: explicit input wins; otherwise derive
          # it from the deployer key (the address is public, the key stays masked).
          if [ -n "${INPUT_DEPLOYER:-}" ]; then
            deployer="$INPUT_DEPLOYER"
          elif [ -n "${pk:-}" ]; then
            echo "::add-mask::$pk"
            deployer="$(cast wallet address --private-key "$pk")"
          else
            echo "::error::No deployer: pass the deployer_address input or set DEPLOYER_PRIVATE_KEY_SEPOLIA / DEPLOYER_PRIVATE_KEY_MAINNET"
            exit 1
          fi
          echo "Deployer (impersonated on the fork): $deployer"
          # Job-scoped. L1_FORK_URL stays masked; DEPLOYER_ADDR is public.
          # Setting DEPLOYER_ADDR makes regen-and-verify.sh run in impersonation
          # mode (no signing key required).
          {
            echo "L1_FORK_URL=$rpc"
            echo "DEPLOYER_ADDR=$deployer"
          } >> "$GITHUB_ENV"
          if [ -n "${GW_RPC_URL:-}" ]; then
            echo "::add-mask::$GW_RPC_URL"
            echo "GW_RPC_URL=$GW_RPC_URL" >> "$GITHUB_ENV"
          fi

      - name: Regenerate + verify calldata
        working-directory: l1-contracts/test/anvil-interop
        env:
          # zk-governance commit whose AllContractsHashes PUVT uses to verify the
          # redeployed PUH/Guardians/SecurityCouncil/EmergencyUpgradeBoard bytecodes.
          ZK_GOVERNANCE_COMMIT: ${{ inputs.zk_governance_commit }}
          # Optional fork-block pin (blank = tip). regen-and-verify.sh reads this.
          FORK_BLOCK: ${{ inputs.fork_block }}
        run: |
          # L1_FORK_URL (masked) + DEPLOYER_ADDR come from $GITHUB_ENV. The script
          # forks L1_FORK_URL into a local anvil and runs prepare/PUVT against
          # localhost, so only anvil sees the real RPC. DEPLOYER_ADDR puts it in
          # impersonation mode (no signing key needed).
          ./regen-and-verify.sh "${{ inputs.environment }}"

      # Produce the same calldata artifact set PR #2268 committed for mainnet:
      # the git-portable `sim-inputs/` handoff set AND the ready-to-paste
      # `transaction-simulator.json`. Two `governance-toml-to-simulator` calls,
      # matching the documented mainnet flow.
      - name: Emit sim-inputs + transaction-simulator.json
        run: |
          set -euo pipefail
          OUT="l1-contracts/upgrade-envs/v0.31.0-interopB/output/${{ inputs.environment }}"
          BIN=./protocol-ops/target/release/protocol_ops
          # $DEPLOYER_ADDR (resolved earlier) is the Camp-A signer. Its bundles
          # are dropped from the sim-inputs: they're broadcast to the real chain,
          # so the simulator's fork inherits their effects from chain tip and
          # replaying them would revert.
          # 1) Normalized manifest + Camp-B `*.safe.json` sim-input bundles.
          "$BIN" ecosystem governance-toml-to-simulator \
            --env "${{ inputs.environment }}" \
            --include-manifest "$OUT/prepare/manifest.json" \
            --camp-a-signers "$DEPLOYER_ADDR" \
            --emit-sim-inputs "$OUT/sim-inputs"
          # 2) The full transaction-simulator.json (Camp-B manifest bundles + the
          #    PUH stage 0/1/2 governance ceremony + post-upgrade smoke tests).
          #    --include-manifest defaults to sim-inputs/manifest.json (step 1).
          "$BIN" ecosystem governance-toml-to-simulator \
            --env "${{ inputs.environment }}" \
            --out "$OUT/transaction-simulator.json"

      # Upload only the calldata deliverables. Deliberately NOT anvil.log /
      # *-verification-logs.txt — anvil.log can echo the forked RPC URL.
      - name: Upload calldata artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-upgrade-calldata-${{ inputs.environment }}
          path: |
            l1-contracts/upgrade-envs/v0.31.0-interopB/output/${{ inputs.environment }}/ecosystem.toml
            l1-contracts/upgrade-envs/v0.31.0-interopB/output/${{ inputs.environment }}/sim-inputs/
            l1-contracts/upgrade-envs/v0.31.0-interopB/output/${{ inputs.environment }}/transaction-simulator.json
          if-no-files-found: warn
          retention-days: 30

      # Inputs the "Deploy" workflow (step 2) consumes: the deployer prepare
      # bundles it broadcasts to real L1, and the forge verify-contract command
      # log it replays for Etherscan verification. Safe to publish — these hold
      # only tx calldata + addresses, never keys or the RPC URL. NOT anvil.log.
      - name: Upload deploy inputs (for the Deploy workflow)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-upgrade-deploy-inputs-${{ inputs.environment }}
          path: |
            l1-contracts/upgrade-envs/v0.31.0-interopB/output/${{ inputs.environment }}/prepare/manifest.json
            l1-contracts/upgrade-envs/v0.31.0-interopB/output/${{ inputs.environment }}/prepare/*.safe.json
            l1-contracts/upgrade-envs/v0.31.0-interopB/output/${{ inputs.environment }}/extra-verification-logs.txt
            l1-contracts/upgrade-envs/v0.31.0-interopB/output/${{ inputs.environment }}/ecosystem.toml
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup anvil
        if: always()
        working-directory: l1-contracts/test/anvil-interop
        run: bash cleanup.sh
