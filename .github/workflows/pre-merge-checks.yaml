# Pre-merge checks: validation of committed generated artifacts.
#
# Every check in this workflow compares a committed, generated file against a
# fresh regeneration — AllContractsHashes.json, l1-contracts/selectors,
# l1-contracts/zkstack-out, and the anvil-interop chain-state snapshots. These
# fail whenever contract bytecode changes, and the only fix is a regen + commit,
# so running them on every push would force a regeneration per commit. They are
# therefore tied to the PR's draft status:
#
#   - Draft PR: only per-commit CI runs; every job here skips.
#   - Ready-for-review PR: these checks run too — on the ready_for_review
#     transition and on every later push while the PR stays non-draft.
#
# Flow: iterate on a draft PR; when ready, dispatch the "Update All Generated
# Artifacts" workflow for the PR (a single regen that commits hashes,
# selectors, zkstack-out, and chain states to the branch), then mark the PR
# ready for review. If review forces bytecode changes, regen again (or convert
# back to draft until done).
#
# Per-commit CI (l1-contracts-ci, anvil-interop-ci, ...) intentionally excludes
# these checks; the per-commit interop suite deploys from source, so it never
# depends on the committed snapshots.
#
# The workflow also runs unconditionally in a merge queue (merge_group) should
# one ever be enabled, and can be dispatched manually against any branch.
name: Pre-merge checks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install foundry-zksync
        uses: ./.github/actions/install-zksync-foundry

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn

      - name: Build da contracts
        working-directory: da-contracts
        run: |
          yarn build:foundry

      - name: Build l1 contracts
        working-directory: l1-contracts
        run: |
          yarn build:foundry

      - name: Build l2 contracts
        working-directory: l2-contracts
        run: |
          yarn build:foundry

      - name: Build system contracts
        working-directory: system-contracts
        run: |
          yarn install
          yarn build:foundry

      - name: Create cache
        uses: actions/cache/save@v4
        with:
          key: artifacts-l1-pre-merge-${{ github.sha }}
          path: |
            da-contracts/cache-forge
            da-contracts/out
            l1-contracts/cache-forge
            l1-contracts/out
            l1-contracts/zkout
            l2-contracts/cache-forge
            l2-contracts/zkout
            system-contracts/zkout

  check-hashes:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies
        run: yarn

      - name: Restore artifacts cache
        uses: actions/cache/restore@v3
        with:
          fail-on-cache-miss: true
          key: artifacts-l1-pre-merge-${{ github.sha }}
          path: |
            da-contracts/cache-forge
            da-contracts/out
            l1-contracts/cache-forge
            l1-contracts/out
            l1-contracts/zkout
            l2-contracts/cache-forge
            l2-contracts/zkout
            system-contracts/zkout

      - name: Check hashes
        run: yarn calculate-hashes:check

  check-selectors:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies
        run: yarn

      - name: Restore artifacts cache
        uses: actions/cache/restore@v3
        with:
          fail-on-cache-miss: true
          key: artifacts-l1-pre-merge-${{ github.sha }}
          path: |
            da-contracts/cache-forge
            da-contracts/out
            l1-contracts/cache-forge
            l1-contracts/out
            l1-contracts/zkout
            l2-contracts/cache-forge
            l2-contracts/zkout
            system-contracts/zkout

      - name: Install foundry-zksync
        uses: ./.github/actions/install-zksync-foundry

      - name: Check selectors
        run: yarn l1 selectors --check

  check-zkstack-out:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install foundry-zksync
        uses: ./.github/actions/install-zksync-foundry

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn

      - name: Build and check zkstack-out
        working-directory: l1-contracts
        run: |
          rm -rf zkstack-out
          yarn build:foundry

          # Fail if regenerated zkstack-out differs from what was committed
          if [ -n "$(git status --porcelain -- zkstack-out)" ]; then
            echo "::error::l1-contracts/zkstack-out is out of date. Run 'cd l1-contracts && yarn build:foundry' and commit the changes."
            git --no-pager status --porcelain -- zkstack-out
            git --no-pager diff -- zkstack-out || true
            exit 1
          fi

  # Fast interop run against the committed chain-state snapshots — the exact
  # configuration developers run locally. Requires the snapshots to be current
  # (see state-generation-check below); the per-commit fresh-deploy run in
  # anvil-interop-ci.yaml covers correctness of the PR's contracts themselves.
  integration-test-preloaded:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn

      - name: Build anvil-interop dev artifacts
        run: yarn l1 build:anvil-interop-dev-artifacts

      - name: Install anvil-interop dependencies
        working-directory: l1-contracts/test/anvil-interop
        run: yarn install

      - name: Run interop tests (preloaded state)
        working-directory: l1-contracts/test/anvil-interop
        env:
          # Each worker spawns 6 Anvil chains + a hardhat process; running all 10 spec groups at
          # once oversubscribes the 4-core runner and causes load-dependent RPC flakes (worker
          # failures mid-spec). Cap concurrency; locally the suite stays fully parallel.
          ANVIL_INTEROP_MAX_PARALLEL_WORKERS: "4"
        run: |
          echo "Running interop tests with preloaded chain states..."
          yarn ts-node run-hardhat-interop-test.ts

      - name: Cleanup
        if: always()
        working-directory: l1-contracts/test/anvil-interop
        run: |
          bash cleanup.sh

  # Mandatory determinism gate for the current protocol version's chain state:
  # rebuilds the state from scratch and verifies it matches the committed
  # snapshots. If a contract change alters genesis state, this fails —
  # regenerate via the 'Regenerate Anvil Interop Chain States' workflow and push.
  #
  # The compare tolerates block-number-derived drift: the harness runs Anvil with
  # interval mining (`--block-time 1`, required so the interop relayers/TBM keep
  # progressing), so the block count is wall-clock-dependent. compare-chain-states
  # ignores block.number and storage slots that just hold a block number (values
  # ≤ block height), plus the block-indexed MessageRoot storage. Everything else
  # (balances, roots, addresses, code, protocol version) must match exactly, so
  # this still catches real drift. To block merges, add "state-generation-check"
  # to the branch protection required checks.
  state-generation-check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Foundry (no foundry-zksync — deterministic bytecode)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn

      - name: Build da-contracts artifacts (no CBOR metadata for determinism)
        run: FOUNDRY_PROFILE=anvil-interop yarn da build:foundry

      - name: Build l1-contracts artifacts (no CBOR metadata for determinism)
        working-directory: l1-contracts
        run: FOUNDRY_PROFILE=anvil-interop forge build

      - name: Install anvil-interop dependencies
        working-directory: l1-contracts/test/anvil-interop
        run: yarn install

      - name: Save committed chain states
        working-directory: l1-contracts/test/anvil-interop
        run: cp -r chain-states chain-states-committed

      - name: Generate chain state
        working-directory: l1-contracts/test/anvil-interop
        run: |
          echo "Generating chain state from scratch..."
          yarn ts-node setup-and-dump-state.ts

      - name: Verify committed state matches generated state
        working-directory: l1-contracts/test/anvil-interop
        run: |
          echo "Comparing generated state against committed chain-states..."
          if yarn ts-node compare-chain-states.ts chain-states-committed chain-states; then
            echo "Committed chain states are up to date"
          else
            echo ""
            echo "Committed chain-states differ from freshly generated state (beyond block-number drift)."
            echo "Run the 'Regenerate Anvil Interop Chain States' workflow from the Actions tab to update them."
            exit 1
          fi

      - name: Cleanup
        if: always()
        working-directory: l1-contracts/test/anvil-interop
        run: |
          bash cleanup.sh
