name: Regenerate Anvil Interop Chain States

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to update"
        required: true
  workflow_call:
    inputs:
      pr_number:
        description: "Pull Request number to update"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Get PR branch info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: parseInt(context.payload.inputs?.pr_number || '${{ inputs.pr_number }}', 10),
            });
            core.setOutput("head_ref", pr.data.head.ref);
            core.setOutput("head_repo", pr.data.head.repo.full_name);

            if (pr.data.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed(`PR head repo is ${pr.data.head.repo.full_name}, expected ${context.repo.owner}/${context.repo.repo}`);
            }

      # `uses: ./…` resolves from the workspace, which the checkout below rewinds to the PR's
      # head — a branch that predates the actions this workflow revision calls. Stashing them
      # first and restoring them after keeps the build steps pinned to the dispatched revision
      # (which is also what the operator picked), instead of failing to find them at all.
      - name: Stash this revision's composite actions
        run: |
          set -euo pipefail
          cp -r .github/actions "$RUNNER_TEMP/gha-actions"
          # install-foundry reads this out of the workspace, so a stashed copy of the action
          # is useless without it on a branch that predates the pin file.
          cp .github/foundry-versions.env "$RUNNER_TEMP/foundry-versions.env"

      - name: Checkout PR branch
        run: |
          git fetch origin "${{ steps.pr.outputs.head_ref }}"
          git checkout "${{ steps.pr.outputs.head_ref }}"
          # The recursive checkout above already populated submodules at their
          # (branch-identical) pins via the checkout action's smarter fetch. A
          # plain `git submodule update` can fail on pins the submodule remote no
          # longer advertises directly (e.g. lib/@matterlabs/zksync-contracts), so
          # keep it non-fatal — the working tree is already at the correct commit.
          git submodule update --init --recursive || true

      # Fill in only what the target branch lacks (`-n` never clobbers). The PR's own copy wins
      # wherever it exists: a PR that updates the build recipe — a foundry bump, a profile change —
      # has to regenerate with *its* recipe, or state-generation-check, which runs from the PR's
      # copy, rejects the freshly generated snapshots. The stashed copies exist only so dispatch
      # still works for branches that predate an action entirely.
      # Only chain-states/ is committed at the end, so these files staying modified is harmless.
      - name: Fall back to this revision's build recipe where the PR's branch has none
        run: |
          set -euo pipefail
          mkdir -p .github/actions
          cp -rn "$RUNNER_TEMP/gha-actions/." .github/actions/
          cp -n "$RUNNER_TEMP/foundry-versions.env" .github/foundry-versions.env
          # Loud failure beats building with a half-populated recipe.
          test -f .github/actions/build-anvil-interop-artifacts/action.yaml
          test -f .github/foundry-versions.env

      - name: Build anvil-interop artifacts
        uses: ./.github/actions/build-anvil-interop-artifacts

      - name: Generate chain state
        working-directory: l1-contracts/test/anvil-interop
        run: |
          echo "Generating chain state from scratch..."
          npx ts-node setup-and-dump-state.ts

      - name: Cleanup Anvil
        if: always()
        run: |
          pkill -9 anvil 2>/dev/null || true

      # Deliberately commits on any byte difference, which for these gzipped dumps of a
      # wall-clock-dependent chain means every run. Suppressing that with
      # compare-chain-states was tried and reverted: the comparator skips the *entire*
      # storage of every chain diamond (see collectSkipStorageAccounts), so a change
      # confined to diamond storage compares as "up to date" — and a writer that trusts
      # that verdict leaves the committed snapshots stale while reporting success. A
      # redundant commit is the cheaper mistake. Narrowing those exclusions to the
      # genuinely volatile slots would let this be smarter, and would also close the
      # matching blind spot in state-generation-check.
      - name: Commit and push updated chain states
        run: |
          set -euo pipefail
          git config user.name "zksync[bot]"
          git config user.email "zksync[bot]@users.noreply.github.com"

          # -A so the committed directory exactly mirrors what was generated:
          # new/updated `<chainId>.json.gz` are added, and any stale files (e.g.
          # a leftover raw `.json` from before the gzip migration, or a chain
          # dropped from the config) are removed from the index.
          git add -A l1-contracts/test/anvil-interop/chain-states/
          git diff --cached --quiet && { echo "No chain state changes to commit"; exit 0; }
          git commit -m "chore: regenerate anvil-interop chain states

          Auto-generated by CI with the pinned Anvil toolchain (see
          .github/foundry-versions.env) and FOUNDRY_PROFILE=anvil-interop."
          git push origin HEAD
