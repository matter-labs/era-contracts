name: Regenerate Anvil Interop Chain States

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to update"
        required: true
  workflow_call:
    inputs:
      pr_number:
        description: "Pull Request number to update"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false # the commit below goes through the API with an App token

      - name: Get PR branch info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: parseInt(context.payload.inputs?.pr_number || '${{ inputs.pr_number }}', 10),
            });
            core.setOutput("head_ref", pr.data.head.ref);
            core.setOutput("head_repo", pr.data.head.repo.full_name);

            // We only want to allow updating PRs from this repo, not from forks
            if (pr.data.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed(`PR head repo is ${pr.data.head.repo.full_name}, expected ${context.repo.owner}/${context.repo.repo}`);
            }

      - name: Checkout PR branch
        run: |
          git fetch origin "${{ steps.pr.outputs.head_ref }}"
          git checkout "${{ steps.pr.outputs.head_ref }}"
          git submodule update --init --recursive

      - name: Install Foundry (no foundry-zksync — deterministic bytecode)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn

      - name: Build da-contracts artifacts (no CBOR metadata for determinism)
        run: FOUNDRY_PROFILE=anvil-interop yarn da build:foundry

      - name: Build l1-contracts artifacts (no CBOR metadata for determinism)
        working-directory: l1-contracts
        run: FOUNDRY_PROFILE=anvil-interop forge build

      - name: Install anvil-interop dependencies
        working-directory: l1-contracts/test/anvil-interop
        run: yarn install

      - name: Generate chain state
        working-directory: l1-contracts/test/anvil-interop
        run: |
          echo "Generating chain state from scratch..."
          npx ts-node setup-and-dump-state.ts

      - name: Cleanup Anvil
        if: always()
        run: |
          pkill -9 anvil 2>/dev/null || true

      # The PR branch is checked out into the workspace above and local actions are read from the
      # working tree when their step runs, so take this action from the dispatched ref instead: a PR
      # branched before the action existed can then still be regenerated.
      - name: Fetch the signed-commit action from the dispatched ref
        uses: actions/checkout@v4
        with:
          path: .ci-actions
          sparse-checkout: .github/actions/signed-commit
          persist-credentials: false

      # Minted only after the PR's own build scripts have run, so no write-capable credential exists
      # while they execute. Scoped to this repository's contents, valid for an hour, revoked at job end.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MATTERLABS_BOTS_APP_ID }}
          private-key: ${{ secrets.MATTERLABS_BOTS_PRIVATE_KEY }}
          permission-contents: write

      # Committed through the GitHub API, so GitHub signs the commit (Verified) and the org's
      # required-signatures rule no longer blocks the PR. The App token, unlike GITHUB_TOKEN, also
      # triggers the PR's workflows on the new commit.
      - name: Commit and push updated chain states (signed by GitHub)
        uses: ./.ci-actions/.github/actions/signed-commit
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ steps.pr.outputs.head_ref }}
          headline: "chore: regenerate anvil-interop chain states"
          body: "Auto-generated by CI with foundry v1.5.1 and FOUNDRY_PROFILE=anvil-interop."
          paths: l1-contracts/test/anvil-interop/chain-states/
