name: "Chain Upgrade Calldata"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment = basename of upgrade-envs/permanent-values/<env>.toml (read by protocol_ops --env)"
        required: true
        type: choice
        options: [stage, stage3, testnet, mainnet, adi]
      protocol_ops_tag:
        description: "protocol-ops Docker image tag"
        required: true
        type: string
      l1_rpc_url:
        description: "L1 RPC URL"
        required: true
        type: string
      chain_id:
        description: "Numeric chain id of the ZK chain (protocol_ops --chain-id)"
        required: true
        type: string
      access_control_restriction:
        description: "AccessControlRestriction address (leave default for Ownable ChainAdmin)"
        required: false
        type: string
        default: "0x0000000000000000000000000000000000000000"
      acknowledge_unrecommended_noda:
        description: "Pass --acknowledge-unrecommended-noda: accept a validium chain's EmptyNoDA + full pubdata setup that this upgrade leaves unchanged (needs a protocol-ops image that has the flag)"
        required: false
        type: boolean
        default: false

      upgrade_timestamp:
        description: "Also prepare the chain's ServerNotifier.setUpgradeTimestamp bundle first, with this timestamp (1 = no waiting; 0 is rejected). Its bundle comes first in the same manifest, so the simulator scenario replays both in order. BLANK = the upgrade bundle only."
        required: false
        type: string
        default: ""
      upgrade:
        description: "Upgrade directory under l1-contracts/upgrade-envs/ the bundles belong to, e.g. v0.33.2-verifier. Names the simulator scenario, picks its sim-descriptions, and is where commit_outputs writes. BLANK = artifacts only."
        required: false
        type: string
        default: ""
      commit_outputs:
        description: "Commit the bundles to output/<env>/chain-upgrades/<chain id>/ and the scenario to output/<env>/simulator/ of `upgrade`, on the dispatched branch. Needs `upgrade`, the RELEASE_TOKEN secret and a branch of this repository."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WORK_DIR: ${{ github.workspace }}/protocol-ops-workdir
      # protocol-ops.sh mounts the checkout's upgrade-envs/ by default (that is
      # where `--env` reads its config); the work dir is mounted so `--out`
      # inside the container lands where upload-artifact reads it.
      EXTRA_MOUNTS: ${{ github.workspace }}/protocol-ops-workdir:/contracts/work
      UPGRADE: ${{ inputs.upgrade }}
      ENVIRONMENT: ${{ inputs.environment }}
      CHAIN_ID: ${{ inputs.chain_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ inputs.commit_outputs && secrets.RELEASE_TOKEN || github.token }}

      - name: Check the inputs
        run: |
          set -euo pipefail
          printf '%s' "$CHAIN_ID" | grep -qE '^[0-9]+$' || { echo "::error::chain_id must be numeric"; exit 1; }
          if [ -n "$UPGRADE" ]; then
            if ! printf '%s' "$UPGRADE" | grep -qE '^[A-Za-z0-9._-]+$' || [ "$UPGRADE" = "." ] || [ "$UPGRADE" = ".." ] \
              || [ ! -d "l1-contracts/upgrade-envs/$UPGRADE" ]; then
              echo "::error::upgrade '$UPGRADE' is not a directory under l1-contracts/upgrade-envs/"; exit 1
            fi
          elif [ "${{ inputs.commit_outputs }}" = "true" ]; then
            echo "::error::commit_outputs needs the upgrade input"; exit 1
          fi

      - name: Run set-upgrade-timestamp
        if: ${{ inputs.upgrade_timestamp != '' }}
        run: |
          mkdir -p "$WORK_DIR"
          bash protocol-ops.sh --tag "${{ inputs.protocol_ops_tag }}" \
            chain set-upgrade-timestamp \
            --l1-rpc-url                 "${{ inputs.l1_rpc_url }}" \
            --env                        "${{ inputs.environment }}" \
            --chain-id                   "${{ inputs.chain_id }}" \
            --upgrade-timestamp          "${{ inputs.upgrade_timestamp }}" \
            --access-control-restriction "${{ inputs.access_control_restriction }}" \
            --out /contracts/work/safe

      - name: Run chain upgrade
        env:
          ACKNOWLEDGE_UNRECOMMENDED_NODA: ${{ inputs.acknowledge_unrecommended_noda }}
        run: |
          mkdir -p "$WORK_DIR"
          extra=()
          [ "$ACKNOWLEDGE_UNRECOMMENDED_NODA" != "true" ] || extra+=(--acknowledge-unrecommended-noda)
          bash protocol-ops.sh --tag "${{ inputs.protocol_ops_tag }}" \
            chain upgrade \
            --l1-rpc-url                 "${{ inputs.l1_rpc_url }}" \
            --env                        "${{ inputs.environment }}" \
            --chain-id                   "${{ inputs.chain_id }}" \
            --access-control-restriction "${{ inputs.access_control_restriction }}" \
            "${extra[@]}" \
            --out /contracts/work/safe

      # The scenario converter is built from this checkout rather than taken from the image:
      # it is plain Rust (no contracts needed), so the scenario format always matches the branch
      # whatever `protocol_ops_tag` produced the bundles.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1

      - name: Install Foundry (cast)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
          cache: false

      - name: Build protocol_ops
        working-directory: protocol-ops
        run: cargo build --release

      # One transaction-simulator scenario for the bundles above, in manifest order: the
      # set-upgrade-timestamp txs are tagged chain_upgrade_<id>_schedule and the upgrade txs
      # chain_upgrade_<id>_execute. The cut
      # reverts `NotAllBatchesExecuted()` on a fork of a live chain with batches in flight, so
      # the simulator is told to settle this chain's diamond first (a real rollout waits instead).
      - name: Emit the chain's simulator scenario
        env:
          L1_RPC_URL: ${{ inputs.l1_rpc_url }}
        run: |
          set -euo pipefail
          PV="l1-contracts/upgrade-envs/permanent-values/$ENVIRONMENT.toml"
          L1_CHAIN_ID="$(sed -nE 's/^[[:space:]]*l1_chain_id[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$PV" | head -1)"
          case "$L1_CHAIN_ID" in
            1) network=mainnet ;;
            11155111) network=sepolia ;;
            *) echo "::error::no transaction-simulator network for l1_chain_id=$L1_CHAIN_ID"; exit 1 ;;
          esac
          BRIDGEHUB="$(python3 -c "import tomllib,sys; print(tomllib.load(open(sys.argv[1],'rb'))['core_contracts']['bridgehub_proxy_addr'])" "$PV")"
          DIAMOND="$(cast call "$BRIDGEHUB" 'getZKChain(uint256)(address)' "$CHAIN_ID" --rpc-url "$L1_RPC_URL")"
          NAME="${UPGRADE:-chain-upgrade}"
          SCENARIO="$WORK_DIR/simulator/$(date -u +%Y-%m-%d)-$NAME-$ENVIRONMENT-2-chain-$CHAIN_ID.json"
          mkdir -p "$WORK_DIR/simulator"
          args=(--manifest "$WORK_DIR/safe/manifest.json" --network "$network" --tag "chain_upgrade_$CHAIN_ID"
                --emulate-all-batches-executed-for "$DIAMOND" --out "$SCENARIO")
          DESCRIPTIONS=""
          for d in "l1-contracts/upgrade-envs/$UPGRADE/sim-descriptions-$ENVIRONMENT.toml" \
                   "l1-contracts/upgrade-envs/$UPGRADE/sim-descriptions.toml"; do
            if [ -n "$UPGRADE" ] && [ -f "$d" ]; then DESCRIPTIONS="$d"; break; fi
          done
          BIN=./protocol-ops/target/release/protocol_ops
          # With descriptions the converter refuses any call they do not name; a chain missing
          # from them still gets a scenario, unlabelled, rather than none.
          if [ -z "$DESCRIPTIONS" ] || ! "$BIN" ecosystem manifest-to-simulator "${args[@]}" --descriptions "$DESCRIPTIONS"; then
            [ -z "$DESCRIPTIONS" ] || echo "::warning::$DESCRIPTIONS does not name every call of chain $CHAIN_ID; the scenario is unlabelled"
            "$BIN" ecosystem manifest-to-simulator "${args[@]}"
          fi
          echo "scenario: $SCENARIO"

      - uses: actions/upload-artifact@v4
        with:
          name: safe-bundles-chain-upgrade-${{ inputs.chain_id }}-${{ inputs.environment }}
          path: |
            ${{ env.WORK_DIR }}/safe/
            ${{ env.WORK_DIR }}/simulator/
          if-no-files-found: error
          retention-days: 30

      # Opt-in: the same layout the committed per-chain outputs have. Pushes with RELEASE_TOKEN,
      # as update-hashes-on-demand.yaml does, so the branch must live in this repository.
      - name: Commit and push
        if: ${{ inputs.commit_outputs && github.ref_type == 'branch' }}
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          OUT="l1-contracts/upgrade-envs/$UPGRADE/output/$ENVIRONMENT"
          rm -rf "$OUT/chain-upgrades/$CHAIN_ID"
          rm -f "$OUT"/simulator/*-"$UPGRADE-$ENVIRONMENT"-2-chain-"$CHAIN_ID".json
          mkdir -p "$OUT/chain-upgrades/$CHAIN_ID" "$OUT/simulator"
          cp -r "$WORK_DIR"/safe/. "$OUT/chain-upgrades/$CHAIN_ID/"
          cp "$WORK_DIR"/simulator/*.json "$OUT/simulator/"
          git config user.name "zksync[bot]"
          git config user.email "zksync[bot]@users.noreply.github.com"
          git add -A "$OUT/chain-upgrades/$CHAIN_ID" "$OUT/simulator"
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git --no-pager diff --cached --stat
          git commit -m "chore(upgrade): $UPGRADE $ENVIRONMENT chain $CHAIN_ID upgrade bundles" -m "Generated by $RUN_URL"
          # Per-chain runs are dispatched side by side: rebase onto whichever landed first.
          for attempt in 1 2 3 4 5; do
            git push origin "HEAD:$BRANCH" && exit 0
            git pull --rebase origin "$BRANCH"
          done
          echo "::error::could not push to $BRANCH"; exit 1
