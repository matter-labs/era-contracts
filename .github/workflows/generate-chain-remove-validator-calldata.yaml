name: "Chain Remove Validator Calldata"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment = basename of upgrade-envs/permanent-values/<env>.toml (read by protocol_ops --env)"
        required: true
        type: choice
        options: [stage, testnet, mainnet, adi]
      protocol_ops_tag:
        description: "protocol-ops Docker image tag"
        required: true
        type: string
      l1_rpc_url:
        description: "L1 RPC URL"
        required: true
        type: string
      chain_id:
        description: "Numeric chain id of the ZK chain (protocol_ops --chain-id)"
        required: true
        type: string
      validator_address:
        description: "Validator EOA to revoke all batch-operator roles from"
        required: true
        type: string
      access_control_restriction:
        description: "AccessControlRestriction address (leave default for Ownable ChainAdmin)"
        required: false
        type: string
        default: "0x0000000000000000000000000000000000000000"

permissions:
  contents: read

jobs:
  remove-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WORK_DIR: ${{ github.workspace }}/protocol-ops-workdir
      # See generate-chain-upgrade-calldata.yaml: the work dir is mounted so
      # `--out` inside the container lands where upload-artifact reads it.
      EXTRA_MOUNTS: ${{ github.workspace }}/protocol-ops-workdir:/contracts/work
    steps:
      - uses: actions/checkout@v4
      - name: Run remove-validator
        run: |
          mkdir -p "$WORK_DIR"
          bash protocol-ops.sh --tag "${{ inputs.protocol_ops_tag }}" \
            chain remove-validator \
            --l1-rpc-url                 "${{ inputs.l1_rpc_url }}" \
            --env                        "${{ inputs.environment }}" \
            --chain-id                   "${{ inputs.chain_id }}" \
            --validator-address          "${{ inputs.validator_address }}" \
            --access-control-restriction "${{ inputs.access_control_restriction }}" \
            --out /contracts/work/safe
      - uses: actions/upload-artifact@v4
        with:
          name: safe-bundles-chain-remove-validator-${{ inputs.chain_id }}-${{ inputs.environment }}
          path: ${{ env.WORK_DIR }}/safe/
          if-no-files-found: error
          retention-days: 30
