name: Lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn

      - name: Lint
        run: yarn lint:check

      - name: Lint errors
        run: yarn l1 errors-lint --check

  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579 # v2.2

  rust-fmt:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        working-directory:
          - protocol-ops
          - tools/upgrade-readiness-checker
          - tools/verifier-gen
          - tools/wallets-gen
          - tools/zksync-os-genesis-gen
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          components: rustfmt

      - name: Check formatting
        # `+1.91.1` overrides crate-local rust-toolchain.toml files.
        run: cargo +1.91.1 fmt --check
        working-directory: ${{ matrix.working-directory }}

  protocol-ops-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          components: clippy

      - name: Check Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: protocol-ops

  protocol-ops-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1

      # Clippy compiles the tests but never executes them; the source-sync mirror guards
      # (gateway config, L1Nullifier constructor) only bite when their assertions run.
      - name: Run tests
        run: cargo test --all-targets
        working-directory: protocol-ops

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check for typos
        uses: crate-ci/typos@master
