name: Build and Push Docker Image for zksync-os-integration-tests

on:
  push:
    branches:
      - main
      - kl/l2V31upgrade
      - draft-v31

jobs:
  build-and-push:
    name: Build and push protocol-ops Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: protocol-ops

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      # The protocol Dockerfile bakes zk-governance into the image
      # (`COPY zk-governance /zk-governance`), so it must be present in the
      # build context. build-docker.yaml pins it to a commit instead.
      - name: Checkout zk-governance
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: zksync-association/zk-governance
          ref: kl/v31-puh-guardians-redeploy
          submodules: recursive
          path: zk-governance

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          # Docker tags can't contain `/`; convert to `-` so branches like
          # `kl/l2V31upgrade` produce a valid tag.
          BRANCH=${GITHUB_REF_NAME//\//-}
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Tags: $SHA, $BRANCH"

          echo "sha_tag=ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${SHA}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${BRANCH}" >> "$GITHUB_OUTPUT"

      # On a toolchain base built from the same commit, as in build-docker.yaml.
      - name: Build and push Docker image
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6.10.0
        with:
          source: .
          files: docker/protocol/docker-bake.hcl
          targets: protocol
          push: true
          set: |
            base.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:buildcache-base
            base.cache-to=type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:buildcache-base,mode=max
            protocol.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:buildcache
            protocol.cache-to=type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
            protocol.tags=${{ steps.tags.outputs.sha_tag }}
            protocol.tags=${{ steps.tags.outputs.branch_tag }}
