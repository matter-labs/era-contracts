name: Build and Push Docker Image for zksync-os-integration-tests

on:
  push:
    branches:
      - main
      - kl/l2V31upgrade
      - draft-v31

jobs:
  build-and-push:
    name: Build and push protocol-ops Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: protocol-ops

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      # The protocol Dockerfile bakes zk-governance into the image
      # (`COPY zk-governance /zk-governance`), so it must be present in the
      # build context. Same checkout as in build-docker.yaml.
      - name: Checkout zk-governance
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: zksync-association/zk-governance
          ref: kl/v31-puh-guardians-redeploy
          submodules: recursive
          path: zk-governance

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          # Docker tags can't contain `/`; convert to `-` so branches like
          # `kl/l2V31upgrade` produce a valid tag.
          BRANCH=${GITHUB_REF_NAME//\//-}
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Tags: $SHA, $BRANCH"

          TAGS="ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${SHA}"
          TAGS="${TAGS},ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${BRANCH}"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      # tools/zksync-os-genesis-gen depends on zksync-os-private, which pulls in
      # zksync-airbender-private. Read-only, scoped to those two repos, valid for an hour.
      - name: Mint token for private cargo dependencies
        id: private-deps-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MATTERLABS_BOTS_APP_ID }}
          private-key: ${{ secrets.MATTERLABS_BOTS_PRIVATE_KEY }}
          owner: matter-labs
          repositories: zksync-os-private,zksync-airbender-private
          permission-contents: read

      - name: Build and push Docker image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          file: docker/protocol/Dockerfile
          secrets: |
            git_token=${{ steps.private-deps-token.outputs.token }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
