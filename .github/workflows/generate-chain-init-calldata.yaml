name: "Chain Init Calldata"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment = basename of upgrade-envs/permanent-values/<env>.toml (read by protocol_ops --env)"
        required: true
        type: choice
        options: [stage, testnet, mainnet, adi]
      protocol_ops_tag:
        description: "protocol-ops image released by build-docker.yaml: sha256:<digest>, or a tag"
        required: true
        type: string
      l1_rpc_url:
        description: "L1 RPC URL for the target environment"
        required: true
        type: string
      chain_id:
        description: "Chain ID (uint64)"
        required: true
        type: string
      deployer_address:
        description: "Deployer EOA that will broadcast the emitted bundle"
        required: true
        type: string
      chain_owner:
        description: "Chain owner EOA"
        required: true
        type: string
      commit_operator:
        description: "Chain commit-operator EOA"
        required: true
        type: string
      prove_operator:
        description: "Chain prove-operator EOA"
        required: true
        type: string
      execute_operator:
        description: "Chain execute-operator EOA (ZKsync OS only)"
        required: true
        type: string
      l1_da_validator_addr:
        description: "L1 DA validator address for the new chain"
        required: true
        type: string
      base_token_addr:
        description: "Base token address (0x0000...0001 for ETH)"
        required: false
        type: string
        default: "0x0000000000000000000000000000000000000001"
      base_token_price_ratio:
        description: "Base token price ratio (e.g. 4000/1 for ZK, 1/1 for ETH)"
        required: false
        type: string
        default: "1/1"
      pause_deposits:
        description: "Keep deposits paused after init"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  chain-init:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WORK_DIR: ${{ github.workspace }}/protocol-ops-workdir
      # `--out` inside the container lands where upload-artifact reads it.
      EXTRA_MOUNTS: ${{ github.workspace }}/protocol-ops-workdir:/contracts/work
      PROTOCOL_OPS_REQUIRE_RELEASE: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run chain init
        env:
          PROTOCOL_OPS_TAG: ${{ inputs.protocol_ops_tag }}
          L1_RPC_URL: ${{ inputs.l1_rpc_url }}
          ENVIRONMENT: ${{ inputs.environment }}
          CHAIN_ID: ${{ inputs.chain_id }}
          DEPLOYER_ADDRESS: ${{ inputs.deployer_address }}
          CHAIN_OWNER: ${{ inputs.chain_owner }}
          COMMIT_OPERATOR: ${{ inputs.commit_operator }}
          PROVE_OPERATOR: ${{ inputs.prove_operator }}
          EXECUTE_OPERATOR: ${{ inputs.execute_operator }}
          L1_DA_VALIDATOR_ADDR: ${{ inputs.l1_da_validator_addr }}
          BASE_TOKEN_ADDR: ${{ inputs.base_token_addr }}
          BASE_TOKEN_PRICE_RATIO: ${{ inputs.base_token_price_ratio }}
          PAUSE_DEPOSITS: ${{ inputs.pause_deposits }}
        run: |
          mkdir -p "$WORK_DIR"
          bash protocol-ops.sh --tag "$PROTOCOL_OPS_TAG" \
            chain init \
            --l1-rpc-url          "$L1_RPC_URL" \
            --env                 "$ENVIRONMENT" \
            --chain-id            "$CHAIN_ID" \
            --deployer-address    "$DEPLOYER_ADDRESS" \
            --owner               "$CHAIN_OWNER" \
            --commit-operator     "$COMMIT_OPERATOR" \
            --prove-operator      "$PROVE_OPERATOR" \
            --execute-operator    "$EXECUTE_OPERATOR" \
            --l1-da-validator     "$L1_DA_VALIDATOR_ADDR" \
            --base-token-addr     "$BASE_TOKEN_ADDR" \
            --base-token-price-ratio "$BASE_TOKEN_PRICE_RATIO" \
            --pause-deposits      "$PAUSE_DEPOSITS" \
            --out /contracts/work/safe

      - name: Upload Safe bundles
        uses: actions/upload-artifact@v4
        with:
          name: safe-bundles-chain-init-${{ inputs.chain_id }}-${{ inputs.environment }}
          path: ${{ env.WORK_DIR }}/safe/
          if-no-files-found: error
          retention-days: 30
