name: "Ecosystem Upgrade: Deploy + Verify"

# Step 2 of the two-step ecosystem-upgrade flow. Step 1
# (`generate-ecosystem-upgrade-calldata.yaml`) produces the calldata + the
# deployer prepare bundles on a fork; THIS workflow takes those deployer
# bundles and actually BROADCASTS them to a real L1, producing
# `transactions.txt` (the record of what was broadcast). Each deployed contract
# is verified on Etherscan as soon as the broadcast lands it, and the run then
# checks that Etherscan shows this checkout's sources for every one of them.
# To verify an existing deployment without loading its signing key or sending
# any transactions, dispatch with verify_only=true and run_verify=true using
# the SAME generate_run_id that supplied the deployed bundle.
#
# It runs the SAME `protocol_ops` commands you'd run locally (see
# `docs/ecosystem-upgrade-deploy.md`), so a local deploy and a CI deploy are
# byte-for-byte the same tool — CI is just a convenience wrapper.
#
# The run must check out the commit the bundle was generated from, with clean
# contract sources, and before any key is loaded `protocol_ops ecosystem
# check-deployer-plan` holds every call the deployer would sign to this
# checkout's build, the env's reviewed inputs and what L1 says (the CTMs'
# ProxyAdmin, BytecodesSupplier and ValidatorTimelock, the Bridgehub's
# ProxyAdmin). What it admits, and the protected-environment
# proposal for this job: `docs/upgrade-operations.md` ("Deployer signing").
#
# What gets broadcast: ONLY the deployer's (Camp-A) bundles — the ones whose
# `manifest.bundles[].target` is the deployer EOA. The legacy-Governance /
# ProtocolUpgradeHandler (Camp-B) bundles are the governance ceremony and are
# executed separately by their own multisig; `--skip-unkeyed` drops them here.
#
# The sender broadcasts strictly one tx at a time and is robust to public-L1
# hazards: a stuck (underpriced) tx is re-broadcast at a higher gas price up to
# `max_gas_price_gwei`. If the sender's nonce moves past ours and none of our
# submissions shows a receipt within a few blocks, the run stops with their
# hashes instead of resending, which could execute the call twice (see
# `submit_and_confirm` in `protocol-ops/src/commands/dev/execute_safe.rs`).
#
# ─── WHICH L1, WHICH SECRETS ───
# The target L1 is taken from the downloaded bundle's `bundle-metadata.json`
# (`l1.chain_id`), NOT inferred from the `environment` name. This prevents a
# mismatched name from selecting the wrong chain and key. So:
#
#   l1.chain_id = 1         → L1_RPC_URL_MAINNET + DEPLOYER_PRIVATE_KEY_MAINNET
#   l1.chain_id = 11155111  → L1_RPC_URL_SEPOLIA + DEPLOYER_PRIVATE_KEY_SEPOLIA
#
# Etherscan verification passes `--chain <l1.chain_id>`.
#
# Unlike step 1 (a fork rehearsal that impersonates the deployer and signs
# nothing), this step signs REAL transactions, so it needs the deployer key. The
# job also refuses to start if that key's address isn't the deployer the bundle was
# prepared for — otherwise `--skip-unkeyed` would drop every bundle and "succeed"
# having deployed nothing.
#
# With run_verify (the default):
#   ETHERSCAN_API_KEY                         — for Etherscan verification and the source check
# The L1 RPC URL comes from the secret (never a plaintext input) so its API key
# is never shown in the run-summary UI.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment = the same config-pair basename you generated with (stage, testnet, mainnet). Which L1 gets broadcast to is NOT derived from this name — it comes from the bundle's own `bundle-metadata.json` `l1.chain_id`."
        required: true
        type: string
      generate_run_id:
        description: "Run ID of the 'Ecosystem Upgrade Calldata' (step 1) run to download the deployer bundles from"
        required: true
        type: string
      resume_deploy_run_id:
        description: "Optional earlier deploy-workflow run whose partial receipt journal should be restored before retrying"
        required: false
        default: ""
        type: string
      resume_from_other_bundle:
        description: "Allow resume_deploy_run_id to point at a run that deployed a DIFFERENT bundle of the same environment (a re-cut after contract changes). The executor then skips only the calls that journal proves already mined — matched on target, calldata and value and confirmed by the on-chain receipt — and sends the rest. Off by default: normally a resume must belong to the same generation run and bundle."
        required: false
        default: false
        type: boolean
      max_gas_price_gwei:
        description: "Gas-price ceiling in gwei, decimals allowed (e.g. 0.5). It caps the stuck-tx bump loop and the first broadcast, so a value below the 1 gwei floor is the price every tx pays."
        required: false
        default: "500"
        type: string
      run_verify:
        description: "Verify the deployed contracts on Etherscan after broadcasting"
        required: false
        default: true
        type: boolean
      verify_only:
        description: "Verify already deployed contracts on Etherscan only: never load the deployer key or broadcast transactions"
        required: false
        default: false
        type: boolean
      etherscan_earlier_commits:
        description: "Space-separated full contracts_commit hashes of earlier cuts of this release on the same L1, each an ancestor of this run's commit. A re-cut keeps a contract whose code and salt did not change, and Etherscan then shows the sources of the cut that deployed it: the source check accepts those."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read # Download the deploy bundle from the generation workflow run.

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # The generation workflow uploads its bundle with `if: always()` so a failed
      # run still leaves diagnostics. Never turn that diagnostic artifact into a
      # real deployment: require the exact handoff-proof job to have succeeded.
      - name: Require a successful bundle handoff proof
        uses: actions/github-script@v7
        env:
          GENERATE_RUN_ID: ${{ inputs.generate_run_id }}
          RESUME_DEPLOY_RUN_ID: ${{ inputs.resume_deploy_run_id }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          RUN_VERIFY: ${{ inputs.run_verify }}
        with:
          script: |
            if (process.env.VERIFY_ONLY === "true" &&
                (process.env.RUN_VERIFY !== "true" || process.env.RESUME_DEPLOY_RUN_ID)) {
              core.setFailed("verify_only requires run_verify=true and no resume_deploy_run_id");
              return;
            }
            const runAttempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            if (runAttempt > 1) {
              core.setFailed(
                "Do not re-run this job in place after a partial broadcast. " +
                  "Dispatch a new deploy run and set resume_deploy_run_id to this run ID.",
              );
              return;
            }

            const runId = Number(process.env.GENERATE_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed(`generate_run_id must be a positive integer, got ${process.env.GENERATE_RUN_ID}`);
              return;
            }

            const { owner, repo } = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: runId,
            });
            const expectedPath = ".github/workflows/generate-ecosystem-upgrade-calldata.yaml";
            if (run.path !== expectedPath) {
              core.setFailed(`run ${runId} used ${run.path}, expected ${expectedPath}`);
              return;
            }
            if (run.event !== "workflow_dispatch" || run.conclusion !== "success") {
              core.setFailed(
                `generation run ${runId} must be a successful workflow_dispatch run; ` +
                  `event=${run.event}, conclusion=${run.conclusion}`,
              );
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: runId,
              filter: "latest",
              per_page: 100,
            });
            const handoffJobs = jobs.filter((job) => job.name === "verify-bundle-handoff");
            if (handoffJobs.length !== 1 || handoffJobs[0].conclusion !== "success") {
              const found = handoffJobs.map((job) => `${job.id}:${job.conclusion}`).join(", ") || "none";
              core.setFailed(`run ${runId} has no single successful verify-bundle-handoff job (found ${found})`);
              return;
            }

            core.exportVariable("GENERATE_HEAD_SHA", run.head_sha);
            core.exportVariable("GENERATE_RUN_URL", run.html_url);
            core.info(`Handoff proof passed: ${handoffJobs[0].html_url}`);

            if (process.env.RESUME_DEPLOY_RUN_ID) {
              const resumeRunId = Number(process.env.RESUME_DEPLOY_RUN_ID);
              if (!Number.isSafeInteger(resumeRunId) || resumeRunId <= 0) {
                core.setFailed(
                  `resume_deploy_run_id must be a positive integer, got ${process.env.RESUME_DEPLOY_RUN_ID}`,
                );
                return;
              }
              const { data: resumeRun } = await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: resumeRunId,
              });
              const expectedResumePath = ".github/workflows/deploy-ecosystem-upgrade.yaml";
              if (resumeRun.path !== expectedResumePath || resumeRun.event !== "workflow_dispatch") {
                core.setFailed(
                  `resume run ${resumeRunId} must be a workflow_dispatch run of ${expectedResumePath}; ` +
                    `path=${resumeRun.path}, event=${resumeRun.event}`,
                );
                return;
              }
              core.exportVariable("RESUME_RUN_URL", resumeRun.html_url);
            }

      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          # Recursive, as AllContractsHashes.json was built: the deployer plan check holds this
          # build to it, and nested libraries are part of the remapping set.
          submodules: recursive

      - name: Install Foundry (cast + forge for verify)
        uses: ./.github/actions/install-foundry

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1

      - name: Install dependencies
        run: yarn

      - name: Test verification-only workflow guards
        run: node --test .github/tests/deploy-verify-only.test.cjs

      - name: Build protocol_ops
        working-directory: protocol-ops
        run: cargo build --release

      # The deployer plan check holds every deployment to the creation code of
      # this build, and forge verify-contract compiles the source to compare
      # against the on-chain bytecode: both need the EVM (out/) artifacts.
      - name: Build contracts (for the deployer plan check and Etherscan verify)
        if: ${{ inputs.run_verify || !inputs.verify_only }}
        run: yarn l1 build:foundry

      # The deploy bundle produced by step 1: the deployer calls, ecosystem.toml,
      # the Etherscan verify log and `bundle-metadata.json`.
      - name: Download the deploy bundle from the calldata (step 1) run
        uses: actions/download-artifact@v4
        with:
          name: ecosystem-upgrade-deploy-inputs-${{ inputs.environment }}
          path: ${{ github.workspace }}/deploy-inputs
          run-id: ${{ inputs.generate_run_id }}
          github-token: ${{ github.token }}

      - name: Download the prior deploy receipt journal
        if: ${{ !inputs.verify_only && inputs.resume_deploy_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ecosystem-upgrade-deploy-result-${{ inputs.environment }}
          path: ${{ github.workspace }}/previous-deploy-result
          run-id: ${{ inputs.resume_deploy_run_id }}
          github-token: ${{ github.token }}

      - name: Validate deploy bundle integrity
        run: |
          set -euo pipefail
          META="$(find "$GITHUB_WORKSPACE/deploy-inputs" -name bundle-metadata.json -print -quit)"
          if [ -z "$META" ]; then
            echo "::error::bundle-metadata.json not found in the downloaded deploy inputs"
            exit 1
          fi
          DEPLOY_BUNDLE_DIR="$(dirname "$META")"
          ./protocol-ops/target/release/protocol_ops ecosystem verify-bundle "$DEPLOY_BUNDLE_DIR"
          echo "DEPLOY_BUNDLE_DIR=$DEPLOY_BUNDLE_DIR" >> "$GITHUB_ENV"

      # The bundle names the upgrade it was generated for; that upgrade's upgrade.toml in this
      # checkout says how its broadcast is checked (protocol-ops/src/common/upgrade_descriptor.rs).
      - name: Resolve the bundle's upgrade
        run: |
          set -euo pipefail
          UPGRADE="$(jq -r '.upgrade // empty' "$DEPLOY_BUNDLE_DIR/bundle-metadata.json")"
          if ! printf '%s' "$UPGRADE" | grep -qE '^[A-Za-z0-9._-]+$' || [ "$UPGRADE" = "." ] || [ "$UPGRADE" = ".." ]; then
            echo "::error::bundle names an invalid upgrade '$UPGRADE'"; exit 1
          fi
          DESCRIPTOR="l1-contracts/upgrade-envs/$UPGRADE/upgrade.toml"
          if [ ! -f "$DESCRIPTOR" ]; then
            echo "::error::this checkout has no $DESCRIPTOR for the bundle's upgrade"; exit 1
          fi
          KIND="$(sed -nE 's/^[[:space:]]*prepare[[:space:]]*=[[:space:]]*"([a-z-]+)".*/\1/p' "$DESCRIPTOR" | head -1)"
          echo "Bundle upgrade: $UPGRADE (prepare = $KIND)"
          {
            echo "UPGRADE=$UPGRADE"
            echo "UPGRADE_KIND=$KIND"
          } >> "$GITHUB_ENV"

      # Tie the downloaded bytes back to the exact successful generation run,
      # and this checkout to the commit it was generated from: the deployer plan
      # check and the Etherscan verification both build this checkout.
      - name: Check bundle provenance against the proven run
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          META="$DEPLOY_BUNDLE_DIR/bundle-metadata.json"
          cat "$META"
          bundle_commit="$(jq -r '.contracts_commit // empty' "$META")"
          bundle_run="$(jq -r '.generated_by.workflow_run // empty' "$META")"
          bundle_env="$(jq -r '.env // empty' "$META")"
          bundle_dirty="$(jq -r 'if has("contracts_worktree_dirty") then (.contracts_worktree_dirty | tostring) else empty end' "$META")"
          if [ "$bundle_run" != "$GENERATE_RUN_URL" ]; then
            echo "::error::bundle provenance run '$bundle_run' does not match proven run '$GENERATE_RUN_URL'"; exit 1
          fi
          if [ "$bundle_commit" != "$GENERATE_HEAD_SHA" ]; then
            echo "::error::bundle commit '$bundle_commit' does not match generation head '$GENERATE_HEAD_SHA'"; exit 1
          fi
          if [ "$bundle_env" != "$ENVIRONMENT" ]; then
            echo "::error::bundle env '$bundle_env' does not match requested env '$ENVIRONMENT'"; exit 1
          fi
          if [ "$bundle_dirty" != "false" ]; then
            echo "::error::bundle was generated from a dirty or unknown worktree"; exit 1
          fi
          if [ "$bundle_commit" != "$GITHUB_SHA" ]; then
            echo "::error::bundle was generated from $bundle_commit but this run checked out $GITHUB_SHA. Dispatch this workflow on a ref at $bundle_commit: the deployer plan is checked against, and Etherscan verifies, this checkout's build."; exit 1
          fi

      # A failed broadcast can already have mined some CREATE2 transactions.
      # Restore its journal before retrying so idempotently skipped calls do not
      # disappear from the deployment record.
      - name: Initialize or restore the deployment receipt journal
        if: ${{ !inputs.verify_only }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          GENERATE_RUN_ID: ${{ inputs.generate_run_id }}
          RESUME_DEPLOY_RUN_ID: ${{ inputs.resume_deploy_run_id }}
          RESUME_FROM_OTHER_BUNDLE: ${{ inputs.resume_from_other_bundle }}
        run: |
          set -euo pipefail
          OUTDIR="$GITHUB_WORKSPACE/deploy-result"
          mkdir -p "$OUTDIR"
          bundle_metadata_sha256="$(sha256sum "$DEPLOY_BUNDLE_DIR/bundle-metadata.json" | awk '{print $1}')"

          if [ -n "$RESUME_DEPLOY_RUN_ID" ]; then
            previous_meta="$(find "$GITHUB_WORKSPACE/previous-deploy-result" -name resume-metadata.json -print -quit)"
            if [ -z "$previous_meta" ]; then
              echo "::error::resume artifact has no resume-metadata.json"; exit 1
            fi
            if [ "$RESUME_FROM_OTHER_BUNDLE" = "true" ]; then
              # Re-cut bundle: the journal comes from another generation run and
              # bundle of the SAME environment. Only the environment is checked
              # here; the executor decides per call, from the journal and the
              # chain, what already mined.
              jq -e \
                --arg deployment_run "$RESUME_RUN_URL" \
                --arg env "$ENVIRONMENT" \
                '.deployment_run == $deployment_run and .environment == $env' \
                "$previous_meta" >/dev/null || {
                  echo "::error::resume journal does not belong to deploy run $RESUME_DEPLOY_RUN_ID and environment $ENVIRONMENT"; exit 1;
                }
              echo "::warning::resuming from a different bundle: journal generation run $(jq -r .generation_run "$previous_meta"), this bundle from $GENERATE_RUN_URL. Only calls the journal proves mined are skipped."
            else
              jq -e \
                --arg generation_run "$GENERATE_RUN_URL" \
                --arg deployment_run "$RESUME_RUN_URL" \
                --arg env "$ENVIRONMENT" \
                --arg digest "$bundle_metadata_sha256" \
                '.generation_run == $generation_run and
                 .deployment_run == $deployment_run and
                 .environment == $env and
                 .bundle_metadata_sha256 == $digest' \
                "$previous_meta" >/dev/null || {
                  echo "::error::resume journal does not belong to this generation run, environment, and bundle (set resume_from_other_bundle to resume a re-cut)"; exit 1;
                }
            fi
            previous_dir="$(dirname "$previous_meta")"
            [ ! -f "$previous_dir/transactions.txt" ] || cp "$previous_dir/transactions.txt" "$OUTDIR/transactions.txt"
            [ ! -f "$previous_dir/deploy-executed.json" ] || cp "$previous_dir/deploy-executed.json" "$OUTDIR/deploy-executed.json"
            echo "Restored receipt journal from deploy run $RESUME_DEPLOY_RUN_ID"
          fi

          jq -n \
            --arg generation_run "$GENERATE_RUN_URL" \
            --arg deployment_run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg env "$ENVIRONMENT" \
            --arg digest "$bundle_metadata_sha256" \
            '{generation_run: $generation_run, deployment_run: $deployment_run,
              environment: $env, bundle_metadata_sha256: $digest}' \
            > "$OUTDIR/resume-metadata.json"
          {
            echo "DEPLOY_OUTDIR=$OUTDIR"
            echo "TXLOG=$OUTDIR/transactions.txt"
          } >> "$GITHUB_ENV"

      # Which L1 to broadcast to comes from the BUNDLE, not from the env's name:
      # `bundle-metadata.json` records the `l1.chain_id` the calldata was computed
      # against, avoiding a name-based selection of the wrong chain and key.
      - name: Select + mask the L1 RPC (L1 from the bundle)
        if: ${{ !inputs.verify_only }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          RPC_SEPOLIA: ${{ secrets.L1_RPC_URL_SEPOLIA }}
          RPC_MAINNET: ${{ secrets.L1_RPC_URL_MAINNET }}
        run: |
          set -euo pipefail
          META="$DEPLOY_BUNDLE_DIR/bundle-metadata.json"
          L1_CHAIN_ID="$(jq -r '.l1.chain_id // empty' "$META")"
          case "$L1_CHAIN_ID" in
            1)        rpc="$RPC_MAINNET"; net=mainnet ;;
            11155111) rpc="$RPC_SEPOLIA"; net=sepolia ;;
            *) echo "::error::Cannot map l1_chain_id='$L1_CHAIN_ID' to a secret (only 1 / 11155111 are wired)"; exit 1 ;;
          esac
          echo "Broadcasting '$ENVIRONMENT' to L1 $net (chain id $L1_CHAIN_ID)"
          if [ -z "$rpc" ]; then
            echo "::error::Missing L1 RPC secret for $net (L1_RPC_URL_$(echo "$net" | tr a-z A-Z))"; exit 1
          fi
          echo "::add-mask::$rpc"
          actual_chain_id="$(cast chain-id --rpc-url "$rpc")"
          if [ "$actual_chain_id" != "$L1_CHAIN_ID" ]; then
            echo "::error::RPC selected for $net reports chain id $actual_chain_id, bundle requires $L1_CHAIN_ID"
            exit 1
          fi
          echo "RPC chain id verified: $actual_chain_id"
          {
            echo "L1_RPC_URL=$rpc"
            echo "L1_NETWORK=$net"
          } >> "$GITHUB_ENV"

      # Every call the deployer key would sign, held to this checkout before the
      # key is loaded: no value, CREATE2 deployments only of the reviewed build
      # under the env's declared salts, any other call only from the reviewed
      # allowlist (protocol-ops/src/commands/ecosystem/deployer_plan.rs). It reads
      # the CTMs' ProxyAdmin, BytecodesSupplier and ValidatorTimelock and the
      # Bridgehub's ProxyAdmin from L1, and refuses unless this checkout is the
      # bundle's commit with clean contract sources.
      - name: Check the deployer plan against this checkout
        if: ${{ !inputs.verify_only }}
        run: |
          set -euo pipefail
          ./protocol-ops/target/release/protocol_ops ecosystem check-deployer-plan \
            --bundle "$DEPLOY_BUNDLE_DIR" \
            --l1-rpc-url "$L1_RPC_URL"

      # The build carries no CBOR metadata, so the bytecode does not bind its verified source:
      # whoever verifies an address first sets the source Etherscan shows for it. This submits
      # each contract as soon as the broadcast lands it, not after the whole broadcast. It runs
      # in the background from here, before the deployer key is loaded; "Verify contracts on
      # Etherscan" waits for it.
      - name: Start Etherscan verification alongside the broadcast
        if: ${{ inputs.run_verify && !inputs.verify_only }}
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: bash .github/scripts/deploy-ecosystem-upgrade/start-etherscan-follower.sh

      - name: Check the deployer key against the bundle
        if: ${{ !inputs.verify_only }}
        env:
          PK_SEPOLIA: ${{ secrets.DEPLOYER_PRIVATE_KEY_SEPOLIA }}
          PK_MAINNET: ${{ secrets.DEPLOYER_PRIVATE_KEY_MAINNET }}
        run: |
          set -euo pipefail
          META="$DEPLOY_BUNDLE_DIR/bundle-metadata.json"
          case "$L1_NETWORK" in
            mainnet) pk="$PK_MAINNET" ;;
            sepolia) pk="$PK_SEPOLIA" ;;
            *) echo "::error::No deployer key wired for L1 network '$L1_NETWORK'"; exit 1 ;;
          esac
          if [ -z "$pk" ]; then
            echo "::error::Missing deployer key secret for $L1_NETWORK (DEPLOYER_PRIVATE_KEY_$(echo "$L1_NETWORK" | tr a-z A-Z))"; exit 1
          fi
          echo "::add-mask::$pk"
          deployer="$(cast wallet address --private-key "$pk")"
          echo "Deployer (real signer): $deployer"
          # The bundle names the EOA whose bundles are the deployer's. If the key in
          # CI is a different account, `--skip-unkeyed` would silently broadcast
          # nothing, so say so now rather than "succeeding" with an empty deploy.
          want="$(jq -r '.deployer_address // empty' "$META")"
          if [ -z "$want" ]; then
            echo "::error::bundle metadata has no deployer_address"; exit 1
          fi
          if [ "$(echo "$want" | tr 'A-Z' 'a-z')" != "$(echo "$deployer" | tr 'A-Z' 'a-z')" ]; then
            echo "::error::bundle was prepared for deployer $want but this key is $deployer — its bundles would be skipped. Re-generate with -f deployer_address=$deployer, or use that account's key."
            exit 1
          fi
          # The key itself is not exported: $GITHUB_ENV reaches every later step,
          # including the Etherscan step that runs commands built from the
          # downloaded bundle. The broadcast step reads it from the secret again.
          echo "DEPLOYER_ADDR=$deployer" >> "$GITHUB_ENV"

      # Broadcast ONLY the deployer bundles (target == deployer), robustly, one
      # at a time. Writes transactions.txt next to --out, the record of what was
      # broadcast.
      - name: Broadcast deployer bundles to L1
        if: ${{ !inputs.verify_only }}
        env:
          PK_SEPOLIA: ${{ secrets.DEPLOYER_PRIVATE_KEY_SEPOLIA }}
          PK_MAINNET: ${{ secrets.DEPLOYER_PRIVATE_KEY_MAINNET }}
          MAX_GAS_PRICE_GWEI: ${{ inputs.max_gas_price_gwei }}
        run: |
          set -euo pipefail
          case "$L1_NETWORK" in
            mainnet) pk="$PK_MAINNET" ;;
            sepolia) pk="$PK_SEPOLIA" ;;
            *) echo "::error::No deployer key wired for L1 network '$L1_NETWORK'"; exit 1 ;;
          esac
          MANIFEST="$DEPLOY_BUNDLE_DIR/prepare/manifest.json"
          echo "Manifest: $MANIFEST"
          halt=()
          if [ -n "${ETHERSCAN_VERIFY_DIR:-}" ]; then halt=(--halt-when "$ETHERSCAN_VERIFY_DIR/failed"); fi
          if ! ./protocol-ops/target/release/protocol_ops ecosystem upgrade-broadcast \
            --manifest "$MANIFEST" \
            --l1-rpc-url "$L1_RPC_URL" \
            --key "${DEPLOYER_ADDR}=${pk}" \
            --skip-unkeyed \
            --max-gas-price-gwei "$MAX_GAS_PRICE_GWEI" \
            --out "$DEPLOY_OUTDIR/deploy-executed.json" \
            "${halt[@]}"; then
            if [ -n "${ETHERSCAN_VERIFY_DIR:-}" ] && [ -f "$ETHERSCAN_VERIFY_DIR/failed" ]; then
              cat "$ETHERSCAN_VERIFY_DIR/log"
              echo "::error::The Etherscan verifier exited during the broadcast (its log is above), so the broadcast stopped before its next transaction. Fix the cause, then resume the deploy (resume_deploy_run_id): its verifier first submits what already landed."
            fi
            exit 1
          fi
          echo "=== transactions.txt ==="
          cat "$TXLOG" || true

      # A forge-script upgrade declares a read-only `verify_chain` check, run here against the
      # real chain. A prepare-all upgrade's post-deploy check is `verify-bootstrap` (the registry
      # verifier, run by `replay-bundle --verify-only`), which stays a separate step: see
      # docs/ecosystem-upgrade-deploy.md.
      - name: Check the broadcast on L1 (the upgrade's declared check)
        if: ${{ !inputs.verify_only && env.UPGRADE_KIND == 'forge-script' }}
        run: |
          set -euo pipefail
          ./protocol-ops/target/release/protocol_ops ecosystem replay-bundle \
            --bundle "$DEPLOY_BUNDLE_DIR" \
            --rpc "$L1_RPC_URL" \
            --verify-only

      - name: Upload transactions.txt + executed log
        if: ${{ always() && !inputs.verify_only }}
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-upgrade-deploy-result-${{ inputs.environment }}
          path: ${{ github.workspace }}/deploy-result
          if-no-files-found: warn
          retention-days: 90

      # Etherscan verification of every contract step 1 logged
      # (`forge verify-contract <address> <Contract> [--constructor-args <hex>]`, the
      # arguments taken from the CREATE2 init code it deployed). A deploy run first waits for the
      # verifier started before the broadcast, which does not wait for Etherscan's verdicts. This
      # step then submits the whole bundle again and waits for each verdict; Etherscan answers an
      # address it has verified as such. Failures are reported, never fatal: the source check
      # below is what passes or fails the run.
      - name: Verify contracts on Etherscan
        if: ${{ inputs.run_verify }}
        continue-on-error: true
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${ETHERSCAN_VERIFY_DIR:-}" ]; then
            # The broadcast is over: the verifier makes a last pass and reports what never landed.
            touch "$ETHERSCAN_VERIFY_DIR/broadcast-done"
            while [ ! -f "$ETHERSCAN_VERIFY_DIR/status" ]; do sleep 10; done
            cat "$ETHERSCAN_VERIFY_DIR/log"
            if [ "$(cat "$ETHERSCAN_VERIFY_DIR/status")" != 0 ]; then
              echo "::warning::The verifier that followed the broadcast did not submit every contract"
            fi
          fi
          forge_script=()
          if [ "${UPGRADE_KIND:-}" = "forge-script" ]; then forge_script=(--forge-script); fi
          ./protocol-ops/target/release/protocol_ops ecosystem etherscan-verify \
            --bundle "$DEPLOY_BUNDLE_DIR" \
            "${forge_script[@]}"

      # What Etherscan shows for every deployed address must be this checkout's sources, or an
      # earlier cut's (etherscan_earlier_commits), byte for byte, comments included; so must a
      # similar match. For each address that fails, protocol_ops prints what to do.
      - name: Check Etherscan shows this checkout's sources
        if: ${{ inputs.run_verify }}
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          ETHERSCAN_EARLIER_COMMITS: ${{ inputs.etherscan_earlier_commits }}
        run: |
          set -euo pipefail
          forge_script=()
          if [ "${UPGRADE_KIND:-}" = "forge-script" ]; then forge_script=(--forge-script); fi
          earlier=()
          read -ra commits <<< "$ETHERSCAN_EARLIER_COMMITS"
          for commit in "${commits[@]}"; do
            if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::etherscan_earlier_commits: '$commit' is not a full commit hash"; exit 1
            fi
            earlier+=(--also-commit "$commit")
          done
          if [ "${#earlier[@]}" -gt 0 ] && [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            # An earlier cut must be in this checkout's history, which protocol_ops checks: fetch
            # that history, never a commit by hash (GitHub serves forks' commits that way too).
            git fetch --no-tags --unshallow origin "$(git rev-parse HEAD)"
          fi
          ./protocol-ops/target/release/protocol_ops ecosystem etherscan-check \
            --bundle "$DEPLOY_BUNDLE_DIR" \
            "${forge_script[@]}" \
            "${earlier[@]}"
