# One-click regen for everything pre-merge-checks.yaml validates: contract
# hashes, selectors, and zkstack-out first, then the anvil-interop chain-state
# snapshots (sequential so the two pushes to the PR branch don't race).
# Dispatch this once when a draft PR is done, then mark it ready for review.
name: Update All Generated Artifacts

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to update"
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  update-hashes:
    name: Update hashes, selectors, zkstack-out
    uses: ./.github/workflows/update-hashes-on-demand.yaml
    with:
      pr_number: ${{ github.event.inputs.pr_number }}
    secrets: inherit

  regenerate-chain-states:
    name: Regenerate chain states
    needs: [update-hashes]
    uses: ./.github/workflows/regenerate-chain-states.yaml
    with:
      pr_number: ${{ github.event.inputs.pr_number }}
    secrets: inherit
