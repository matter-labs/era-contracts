# One-click regen for what pre-merge-checks.yaml validates: hashes + selectors +
# zkstack-out, then chain states (sequential so the pushes don't race).
#
# configs/genesis/zksync-os/latest.json is covered too: update-hashes-on-demand runs the
# tools/zksync-os-genesis-gen binary against the same Linux build and commits the result.
name: Update All Generated Artifacts

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to update"
        required: true
      push_changes:
        description: "Push generated changes; disable to download patches for signed commits"
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

jobs:
  update-hashes:
    name: Update hashes, selectors, zkstack-out
    uses: ./.github/workflows/update-hashes-on-demand.yaml
    with:
      pr_number: ${{ github.event.inputs.pr_number }}
      push_changes: ${{ inputs.push_changes }}
    secrets: inherit

  regenerate-chain-states:
    name: Regenerate chain states
    needs: [update-hashes]
    uses: ./.github/workflows/regenerate-chain-states.yaml
    with:
      pr_number: ${{ github.event.inputs.pr_number }}
      push_changes: ${{ inputs.push_changes }}
      apply_generated_patch: ${{ !inputs.push_changes }}
    secrets: inherit
