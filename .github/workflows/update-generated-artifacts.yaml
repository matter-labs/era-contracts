# One-click regen for what pre-merge-checks.yaml validates: hashes + selectors +
# zkstack-out, then chain states (sequential so the pushes don't race).
#
# Not yet covered: configs/genesis/zksync-os/latest.json, which check-zksync-os-genesis
# validates. Regenerating it needs the tools/zksync-os-genesis-gen Rust binary run against
# a default-profile Linux build, so a stale genesis still has to be regenerated by hand.
name: Update All Generated Artifacts

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to update"
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  update-hashes:
    name: Update hashes, selectors, zkstack-out
    uses: ./.github/workflows/update-hashes-on-demand.yaml
    with:
      pr_number: ${{ github.event.inputs.pr_number }}
    secrets: inherit

  regenerate-chain-states:
    name: Regenerate chain states
    needs: [update-hashes]
    uses: ./.github/workflows/regenerate-chain-states.yaml
    with:
      pr_number: ${{ github.event.inputs.pr_number }}
    secrets: inherit
