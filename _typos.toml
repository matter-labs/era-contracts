[files]
# Temporarily commenting a lot so that at least *.sol files are included.
extend-exclude = [
    "/l1-contracts/lib/",
    "/l1-contracts/out/",
    "/l1-contracts/node_modules/",
    "/l1-contracts/artifacts",
    "/l1-contracts-foundry/lib/",
    "*.json",
    "*.lock",
    ".git/",
    "SECURITY.md"
]

[default.extend-words]
# Don't correct the surname "Teh"
FOT = "FOT"
ue = "ue"
# Valid Rust module naming convention for constants
consts = "consts"
IZ = "IZ"
# "BA" is the B->A leg abbreviation in the atomic-interop swap tests (hBA, baProof, ...)
BA = "BA"
