[package]
name = "zksync-os-genesis-gen"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
name = "zksync_os_genesis_gen"
path = "src/lib.rs"

[[bin]]
name = "zksync-os-genesis-gen"
path = "src/main.rs"

[dependencies]
structopt = "0.3.26"
zksync_os_interface = { version = "0.0.7" }

alloy = { version = "2.4.1", default-features = false, features = ["consensus", "eips", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake2 = "0.10.6"
zk_os_api = { package = "zksync_os_api", git = "https://github.com/matter-labs/zksync-os", tag = "v0.5.3-private" }
zk_os_basic_system = { package = "basic_system", git = "https://github.com/matter-labs/zksync-os", tag = "v0.5.3-private" }

anyhow = "1"
hex = "0.4"
hex-literal = "1.0.0"

# Use workspace to allow using the tool from other workspaces without conflicts
[workspace]

# v0.5.3-private still names the private remote; the same commit is available publicly.
[patch."https://github.com/matter-labs/zksync-airbender-private.git"]
blake2s_u32 = { git = "https://github.com/matter-labs/zksync-airbender", rev = "af42767a2835411ba18a0f45a4e435d692faa8bf" }
common_constants = { git = "https://github.com/matter-labs/zksync-airbender", rev = "af42767a2835411ba18a0f45a4e435d692faa8bf" }
cs = { git = "https://github.com/matter-labs/zksync-airbender", rev = "af42767a2835411ba18a0f45a4e435d692faa8bf" }
field = { git = "https://github.com/matter-labs/zksync-airbender", rev = "af42767a2835411ba18a0f45a4e435d692faa8bf" }
riscv_transpiler = { git = "https://github.com/matter-labs/zksync-airbender", rev = "af42767a2835411ba18a0f45a4e435d692faa8bf" }
worker = { git = "https://github.com/matter-labs/zksync-airbender", rev = "af42767a2835411ba18a0f45a4e435d692faa8bf" }
