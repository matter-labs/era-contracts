[package]
name = "zksync-os-genesis-gen"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
name = "zksync_os_genesis_gen"
path = "src/lib.rs"

[[bin]]
name = "zksync-os-genesis-gen"
path = "src/main.rs"

[dependencies]
structopt = "0.3.26"
zksync_os_interface = { version = "0.0.7" }

alloy = { version = "2.0.5", default-features = false, features = ["consensus", "eips", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake2 = "0.10.6"
# TODO: `dev-20260724-atomic-interop` is a dev pre-release of the atomic-interop zksync-os line
# (needed because older releases don't build on the nightly-2026-02-10 toolchain); update to the
# proper release tag once it is cut.
zk_os_api = { package = "zksync_os_api", git = "https://github.com/matter-labs/zksync-os", tag = "dev-20260724-atomic-interop" }
zk_os_basic_system = { package = "basic_system", git = "https://github.com/matter-labs/zksync-os", tag = "dev-20260724-atomic-interop" }

anyhow = "1"
hex = "0.4"
hex-literal = "1.0.0"

# Use workspace to allow using the tool from other workspaces without conflicts
[workspace]
