[package]
name = "zksync-os-genesis-gen"
version = "0.1.0"
edition = "2024"

[lib]
name = "zksync_os_genesis_gen"
path = "src/lib.rs"

[[bin]]
name = "zksync-os-genesis-gen"
path = "src/main.rs"

[dependencies]
structopt = "0.3.26"
zksync_os_interface = { version = "0.0.7" }

alloy = { version = "2.0.5", default-features = false, features = ["consensus", "eips", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake2 = "0.10.6"
zk_os_api = { package = "zksync_os_api", git = "https://github.com/matter-labs/zksync-os", tag = "v0.2.9-interface-v0.0.14" }
zk_os_basic_system = { package = "basic_system", git = "https://github.com/matter-labs/zksync-os", tag = "v0.2.9-interface-v0.0.14" }

anyhow = "1"
hex = "0.4"
hex-literal = "1.0.0"

[dev-dependencies]
tempfile = "3"

# Use workspace to allow using the tool from other workspaces without conflicts
[workspace]
