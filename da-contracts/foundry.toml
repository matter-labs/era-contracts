[profile.default]
src = 'contracts'
out = 'out'
libs = ['node_modules', 'lib']
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/",
]
allow_paths = []
fs_permissions = [
    { access = "read", path = "./script-config" },
    { access = "read-write", path = "./script-out" },
    { access = "read", path = "./out" }
]
cache_path = 'cache-forge'
test = 'test/foundry'
solc_version = "0.8.28"
evm_version = "prague"
ignored_error_codes = [
    "missing-receive-ether",
    "code-size",
]
ignored_warnings_from = [
    "test",
    "contracts/dev-contracts"
]

# Profile for anvil-interop state generation: disables CBOR metadata to produce
# deterministic bytecode across platforms (macOS vs Linux CI).
# Usage: FOUNDRY_PROFILE=anvil-interop forge build
[profile.anvil-interop]
cbor_metadata = false
bytecode_hash = "none"

# See more config options https://github.com/foundry-rs/foundry/tree/master/crates/config
